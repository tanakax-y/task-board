<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d2125" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TaskBoard">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>TaskBoard</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #fff; --panel2: #ebecf0; --hover: #f1f2f4; --border: #e1e4ea;
  --text: #172b4d; --muted: #6b778c; --accent: #0c66e4; --accent-weak: #e9f2ff;
  --danger: #c9372c; --done: #22a06b; --col: #ebecf0;
  --shadow: 0 1px 1px rgba(9,30,66,.2), 0 0 1px rgba(9,30,66,.25);
  --menu-shadow: 0 8px 24px rgba(9,30,66,.22);
  --top-h: 52px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1d2125; --panel: #22272b; --panel2: #2c333a; --hover: #2a3036; --border: #384048;
    --text: #dee4ea; --muted: #9fadbc; --accent: #579dff; --accent-weak: #1c2b41;
    --danger: #f87168; --done: #4bce97; --col: #161a1d;
    --shadow: 0 1px 1px rgba(0,0,0,.5); --menu-shadow: 0 8px 24px rgba(0,0,0,.55);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Meiryo", "Noto Sans JP", sans-serif;
  font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input { font: inherit; color: inherit; font-size: 16px; } /* 16px未満だとiPhoneで勝手にズームする */
.muted { color: var(--muted); }
.center { min-height: 100dvh; display: grid; place-items: center; }

/* ---- header ---- */
.top {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding: env(safe-area-inset-top) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
  height: calc(var(--top-h) + env(safe-area-inset-top));
  background: var(--panel); border-bottom: 1px solid var(--border);
}
.brand { font-weight: 800; letter-spacing: .3px; display: flex; align-items: center; gap: 8px; }
.brand img { width: 24px; height: 24px; }
.tabs { display: flex; gap: 4px; background: var(--panel2); padding: 3px; border-radius: 9px; margin: 0 auto; }
.tabs button { padding: 5px 14px; border-radius: 7px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.tabs button.on { background: var(--panel); color: var(--text); box-shadow: var(--shadow); }
.tabs button.drop { outline: 2px dashed var(--accent); }
.badge { font-size: 11px; background: var(--accent); color: #fff; border-radius: 10px; padding: 0 6px; min-width: 18px; text-align: center; line-height: 17px; }
.sync { width: 8px; height: 8px; border-radius: 50%; background: var(--done); flex: none; }
.sync.off { background: var(--danger); }

/* ---- common controls ---- */
.check { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: 50%; }
.check i {
  width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--muted);
  display: grid; place-items: center; transition: background .12s, border-color .12s;
}
.check:hover i { border-color: var(--done); }
.check.on i { background: var(--done); border-color: var(--done); }
.check svg { width: 11px; height: 11px; stroke: #fff; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.dots {
  width: 30px; height: 28px; flex: none; border-radius: 6px; color: var(--muted);
  font-size: 18px; line-height: 1; letter-spacing: -1px; display: grid; place-items: center;
}
.dots:hover, .dots[aria-expanded="true"] { background: var(--panel2); color: var(--text); }
.menu {
  position: fixed; z-index: 300; min-width: 210px; max-width: calc(100vw - 16px); max-height: 65vh; overflow: auto;
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: var(--menu-shadow); padding: 5px; animation: pop .1s ease-out;
}
@keyframes pop { from { opacity: 0; transform: scale(.97); } }
.mi { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mi:hover { background: var(--hover); }
.mi .ic { width: 18px; text-align: center; color: var(--muted); flex: none; }
.mi.danger, .mi.danger .ic { color: var(--danger); }
.msec { font-size: 11px; font-weight: 700; color: var(--muted); padding: 8px 10px 3px; }
.msep { height: 1px; background: var(--border); margin: 5px 0; }
.edit {
  flex: 1; min-width: 0; padding: 3px 6px; border: 2px solid var(--accent); border-radius: 6px;
  background: var(--panel); outline: none;
}
.chip { padding: 4px 11px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); border: 1px solid var(--border); background: var(--panel); white-space: nowrap; }
.chip.on { background: var(--accent-weak); color: var(--accent); border-color: transparent; }
.seg { display: inline-flex; background: var(--panel2); padding: 2px; border-radius: 8px; }
.seg button { padding: 4px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--panel); color: var(--text); box-shadow: var(--shadow); }
.btn { padding: 7px 14px; border-radius: 7px; font-weight: 600; background: var(--accent); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--panel2); color: var(--text); }

/* ---- inbox ---- */
.inbox { max-width: 760px; margin: 0 auto; padding: 14px max(12px, env(safe-area-inset-right)) calc(90px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
.composer {
  display: flex; align-items: center; gap: 6px; background: var(--panel);
  border: 1px solid var(--border); border-radius: 10px; padding: 5px 5px 5px 12px; box-shadow: var(--shadow);
}
.composer:focus-within { border-color: var(--accent); }
.composer input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; padding: 5px 0; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 12px 0 4px; }
.toolbar .chips { display: flex; gap: 6px; }
.search { flex: 1; min-width: 120px; display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 0 8px; }
.search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; padding: 4px 0; font-size: 16px; }
.ghead { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; font-weight: 700; color: var(--muted); margin: 16px 4px 6px; }
.list { list-style: none; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
.row { display: flex; align-items: center; gap: 6px; padding: 4px 4px 4px 6px; min-height: 40px; border-top: 1px solid var(--border); }
.row:first-child { border-top: 0; }
.row:hover { background: var(--hover); }
.list .row:first-child { border-radius: 10px 10px 0 0; } .list .row:last-child { border-radius: 0 0 10px 10px; } .list .row:only-child { border-radius: 10px; }
.text { flex: 1; min-width: 0; word-break: break-word; white-space: pre-wrap; padding: 2px 0; }
.done .text { text-decoration: line-through; color: var(--muted); }
.stamp { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.empty { text-align: center; color: var(--muted); padding: 34px 12px; font-size: 14px; }

/* calendar */
.inbox.calmode { max-width: 1100px; }
.calwrap { display: grid; gap: 14px; margin-top: 12px; }
@media (min-width: 900px) { .calwrap { grid-template-columns: 340px 1fr; align-items: start; } .cal { position: sticky; top: calc(var(--top-h) + 14px); } }
.cal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px; }
.cal-head { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; }
.cal-head strong { flex: 1; text-align: center; font-size: 15px; }
.icon { width: 32px; height: 32px; border-radius: 8px; font-size: 20px; color: var(--muted); }
.icon:hover { background: var(--panel2); color: var(--text); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-w { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); padding: 2px 0 4px; }
.cal-w.sun { color: #e5484d; } .cal-w.sat { color: #3e7bfa; }
.cal-d { aspect-ratio: 1 / 1; max-height: 52px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-variant-numeric: tabular-nums; }
.cal-d:hover { background: var(--hover); }
.cal-d .n { font-size: 14px; line-height: 1.1; }
.cal-d .cnt { font-size: 10px; line-height: 14px; min-width: 16px; height: 14px; padding: 0 4px; border-radius: 7px; background: var(--accent); color: #fff; font-weight: 700; }
.cal-d .cnt.alldone { background: var(--panel2); color: var(--muted); }
.cal-d .cnt.none { background: transparent; }
.cal-d.today .n { color: var(--accent); font-weight: 800; }
.cal-d.sel { background: var(--accent); }
.cal-d.sel .n { color: #fff; font-weight: 700; }
.cal-d.sel .cnt { background: #fff; color: var(--accent); }

/* ---- board ---- */
.board {
  display: flex; gap: 12px; align-items: flex-start; overflow-x: auto;
  padding: 12px max(12px, env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  height: calc(100dvh - var(--top-h) - env(safe-area-inset-top));
}
.col { flex: 0 0 284px; max-height: 100%; display: flex; flex-direction: column; background: var(--col); border-radius: 12px; }
.col-head { display: flex; align-items: center; gap: 6px; padding: 8px 6px 6px 12px; }
.col-head h3 { flex: 1; font-size: 14px; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: text; }
.col-head .count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.col-body { flex: 1 1 auto; overflow-y: auto; padding: 2px 8px 4px; display: flex; flex-direction: column; gap: 8px; min-height: 12px; }
.col-body.drop-end::after { content: ""; height: 3px; flex: none; background: var(--accent); border-radius: 2px; }
.col-foot { padding: 4px 8px 8px; }
.add-btn { width: 100%; text-align: left; padding: 7px 8px; border-radius: 8px; color: var(--muted); font-weight: 600; font-size: 14px; }
.add-btn:hover { background: var(--panel2); color: var(--text); }
.add-form input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 2px solid var(--accent); background: var(--panel); outline: none; }
.add-form .acts { display: flex; gap: 6px; margin-top: 6px; }
.card {
  display: flex; align-items: flex-start; gap: 4px; padding: 5px 2px 5px 4px;
  background: var(--panel); border-radius: 8px; box-shadow: var(--shadow); cursor: grab;
}
.card:hover { box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
.card.dragging { opacity: .4; }
.card.drop-before { box-shadow: 0 -4px 0 -1px var(--accent), var(--shadow); }
.card-main { flex: 1; min-width: 0; padding-top: 3px; display: flex; flex-direction: column; gap: 2px; }
.card-main .stamp { font-size: 11px; }
.add-col { background: transparent; border: 2px dashed var(--border); }
.add-col .add-btn { padding: 10px 12px; }
.add-col .add-form { padding: 8px; }
@media (max-width: 640px) {
  .board { scroll-snap-type: x mandatory; scroll-padding: 0 12px; gap: 10px; }
  .col { flex-basis: 86vw; scroll-snap-align: start; }
  .tabs button { padding: 5px 11px; }
  .brand span { display: none; }
}

/* ---- board v2: 細いカード・右に日時・タッチ対応ドラッグ ---- */
.card {
  align-items: center; gap: 2px; padding: 2px 0 2px 2px; cursor: pointer;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
.card .check { width: 26px; height: 26px; }
.card .check i { width: 16px; height: 16px; }
.card .text { font-size: 14px; line-height: 1.35; padding: 5px 2px; }
.card .stamp { font-size: 10.5px; margin-left: 2px; }
.card .dots { width: 26px; height: 26px; font-size: 15px; }
.card.drop-before { box-shadow: 0 -4px 0 -1px var(--accent), var(--shadow); }
.col-body { gap: 6px; }
.col-head { cursor: grab; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.col.dragging { opacity: .35; }
.col.col-drop-before { box-shadow: -7px 0 0 -3px var(--accent); }
.board.is-dragging { scroll-snap-type: none !important; cursor: grabbing; }
.board.is-dragging .card:hover { box-shadow: var(--shadow); }
.drag-ghost {
  position: fixed; z-index: 500; pointer-events: none; transform: rotate(2.5deg);
  background: var(--panel); border-radius: 8px; padding: 9px 12px; font-size: 14px; font-weight: 600;
  box-shadow: 0 12px 28px rgba(9,30,66,.32); overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
.drag-ghost.col { background: var(--col); border: 2px solid var(--accent); padding: 12px; }
body.drop-inbox [data-drop="inbox"] { outline: 2px dashed var(--accent); outline-offset: -3px; border-radius: 8px; }
.row .text { cursor: pointer; }
.imeta { display: inline-flex; gap: 6px; margin-left: 6px; font-size: 11.5px; color: var(--muted); white-space: nowrap; vertical-align: 1px; text-decoration: none; }
.imeta .sp { font-variant-numeric: tabular-nums; }
.imeta .ok { color: var(--done); }

/* item detail */
.dt-top { display: flex; align-items: flex-start; gap: 6px; }
.dt-title { flex: 1; border: 0; outline: none; resize: none; overflow: hidden; background: transparent; color: var(--text); font: inherit; font-size: 18px; font-weight: 700; line-height: 1.4; padding: 2px 0; }
.dt-title:focus { box-shadow: 0 2px 0 var(--accent); }
.dt-title.done { text-decoration: line-through; color: var(--muted); }
.dt-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 6px 0 4px 34px; font-size: 12px; color: var(--muted); }
.dt-meta select { font: inherit; font-size: 14px; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
.dt-sec { margin-top: 16px; }
.dt-sec > label { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.dt-note { width: 100%; min-height: 72px; resize: none; overflow: hidden; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; font-size: 16px; line-height: 1.5; padding: 8px 10px; outline: none; }
.dt-note:focus { border-color: var(--accent); }
.pbar { height: 4px; border-radius: 2px; background: var(--panel2); overflow: hidden; margin-bottom: 4px; }
.pbar i { display: block; height: 100%; background: var(--done); transition: width .2s; }
.subs { list-style: none; }
.sub { display: flex; align-items: center; gap: 2px; border-bottom: 1px solid var(--border); }
.sub input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; padding: 8px 4px; font-size: 16px; color: var(--text); }
.sub.done input { text-decoration: line-through; color: var(--muted); }
.sub .x { width: 32px; height: 32px; flex: none; border-radius: 6px; color: var(--muted); font-size: 18px; }
.sub .x:hover { background: var(--panel2); color: var(--danger); }
.sub-add { display: flex; align-items: center; gap: 6px; padding-top: 6px; }
.sub-add > span { width: 28px; text-align: center; color: var(--muted); font-size: 18px; flex: none; }
.sub-add input { flex: 1; min-width: 0; border: 0; border-bottom: 1px dashed var(--border); background: transparent; outline: none; padding: 8px 2px; font-size: 16px; color: var(--text); }
.sub-add input:focus { border-bottom-color: var(--accent); }

/* ---- board v3: 期限・カテゴリ ---- */
.card .cbody { flex: 1; min-width: 0; padding: 4px 2px; }
.card .cbody .text { padding: 1px 0; }
.csub, .rsub { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 3px; }
.rsub { display: inline-flex; margin: 0 0 0 6px; vertical-align: 1px; }
.csub .imeta { margin-left: 0; }
.due { font-size: 11.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; text-decoration: none; display: inline-block; }
.due b { margin-left: 4px; font-weight: 700; }
.due.ok b { color: var(--muted); }
.due.near b { color: #b38600; }
.due.soon { color: #c25100; } .due.soon b { color: #c25100; }
.due.over { color: var(--danger); } .due.over b { color: var(--danger); }
.due.fin { opacity: .7; }
@media (prefers-color-scheme: dark) { .due.near b { color: #f5cd47; } .due.soon, .due.soon b { color: #fea362; } }
.cbadge { display: inline-flex; align-items: center; font-size: 11px; font-weight: 700; line-height: 17px; padding: 0 7px; border-radius: 9px; white-space: nowrap; color: var(--text); background: color-mix(in srgb, var(--c) 22%, transparent); text-decoration: none; }
.card.has-cat { box-shadow: inset 4px 0 0 var(--cc), var(--shadow); padding-left: 5px; }
.card.has-cat:hover { box-shadow: inset 4px 0 0 var(--cc), 0 0 0 1px var(--accent), var(--shadow); }
.card.has-cat.drop-before { box-shadow: inset 4px 0 0 var(--cc), 0 -4px 0 -1px var(--accent), var(--shadow); }
.row.has-cat { box-shadow: inset 4px 0 0 var(--cc); }
.board-wrap { display: flex; flex-direction: column; height: calc(100dvh - var(--top-h) - env(safe-area-inset-top)); }
.board-wrap .board { flex: 1; min-height: 0; height: auto; }
.board-dock { margin: 10px 12px 0; }
/* 表示サイズ（🔍 大/中/小） */
.board-wrap.z2 .col { flex-basis: 220px; }
.board-wrap.z3 .col { flex-basis: 170px; }
.board-wrap.z2 .board { gap: 8px; }
.board-wrap.z3 .board { gap: 6px; }
.board-wrap.z2 .card .text { font-size: 12.5px; line-height: 1.3; padding: 4px 1px; }
.board-wrap.z3 .card .text { font-size: 11.5px; line-height: 1.25; padding: 3px 1px; }
.board-wrap:is(.z2, .z3) .col-head { padding: 6px 2px 4px 8px; gap: 2px; }
.board-wrap:is(.z2, .z3) .col-head h3 { font-size: 12.5px; }
.board-wrap:is(.z2, .z3) .col-body { padding: 2px 5px 4px; gap: 4px; }
.board-wrap:is(.z2, .z3) .col-foot { padding: 2px 5px 6px; }
.board-wrap:is(.z2, .z3) .add-btn { font-size: 12.5px; padding: 5px 6px; }
.board-wrap:is(.z2, .z3) .card .check { width: 22px; height: 22px; }
.board-wrap:is(.z2, .z3) .card .check i { width: 13px; height: 13px; }
.board-wrap:is(.z2, .z3) .card .dots { width: 20px; height: 22px; font-size: 13px; }
.board-wrap:is(.z2, .z3) .card .stamp { display: none; }   /* 縮小表示では日時を省いて本文を広く */
@media (max-width: 640px) {
  .board-wrap.z2 .col { flex-basis: calc((100vw - 24px - 8px) / 2); }
  .board-wrap.z3 .col { flex-basis: calc((100vw - 24px - 12px) / 3); }
}
.rec-head { align-items: center; flex-wrap: wrap; gap: 4px; }
.rec-head .chips { display: flex; gap: 6px; flex: none; margin-left: auto; }
.rday { display: flex; align-items: center; gap: 2px; white-space: nowrap; }
.rday .chip { margin-left: 4px; font-size: 12px; padding: 2px 9px; }
.colnav { display: none; }
@media (max-width: 640px) {
  .board-wrap { position: relative; }
  .board-wrap .board { padding-bottom: 46px; }
  .colnav {
    display: flex; gap: 2px; position: absolute; left: 50%; bottom: 10px; translate: -50% 0; max-width: calc(100% - 24px); overflow-x: auto;
    padding: 3px; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--border); border-radius: 9px; box-shadow: var(--shadow);
    scrollbar-width: none; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .colnav::-webkit-scrollbar { display: none; }
  .colnav button { flex: none; display: flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 6px; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .colnav button b { font-weight: 600; font-size: 10.5px; font-variant-numeric: tabular-nums; opacity: .8; }
  .colnav button.on { background: var(--accent); color: #fff; font-weight: 600; }
}
.catbar { display: flex; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 1px; }
.catbar::-webkit-scrollbar { display: none; }
.catbar .chip { flex: none; }
.cchip { display: inline-flex; align-items: center; gap: 5px; }
.cchip i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.cchip.on { background: color-mix(in srgb, var(--c) 22%, var(--panel)); color: var(--text); border-color: var(--c); }
.catpick { display: flex; flex-wrap: wrap; gap: 6px; }

/* 時間：アクションの並べ替え */

/* ---- action log ---- */
.logv { max-width: 760px; margin: 0 auto; padding: 12px max(12px, env(safe-area-inset-right)) calc(90px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }

}

}

/* daily */
.dhead { display: flex; align-items: center; gap: 4px; margin: 2px 0 10px; }

.dval { width: 100%; border: 0; outline: none; background: transparent; padding: 1px 0; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); min-height: 30px; }

@media (pointer: coarse) {
  .tbox .dval.k-time, .drow:not(.has) .tbox .dval.k-time:not(:focus) { color: transparent; }
  .tshow { display: block; position: absolute; left: 0; top: 50%; transform: translateY(-50%); pointer-events: none;
    font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); }

}
.ldur.wrap { white-space: pre-wrap; overflow-wrap: anywhere; text-align: right; font-weight: 500; font-size: 14px; min-width: 0; }
.hgrid .hrow:not(.hhead) { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.hgrid .hrow.dragging { opacity: .35; }

.hgrid .hrow.drop-after { box-shadow: inset 0 -3px 0 var(--accent); }
.nowbtn { flex: none; }

.stats { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }

/* habit */
.hgrid { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 6px 8px; }
.hrow { display: grid; grid-template-columns: minmax(0, 1fr) repeat(7, 34px); gap: 3px; align-items: center; padding: 5px 0; border-top: 1px solid var(--border); }

    position: fixed; left: 0; right: 0; z-index: 35; margin: 0;
    bottom: calc(var(--nav-h) + env(safe-area-inset-bottom));
    padding: 8px max(10px, env(safe-area-inset-right)) 8px max(10px, env(safe-area-inset-left));
    background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
  }
  .inbox-dock { flex-direction: column; gap: 8px; }
  .inbox-dock .toolbar { flex-wrap: nowrap; justify-content: space-between; gap: 6px; }
  .inbox-dock .chip { padding: 4px 9px; }
  .inbox, .logv { padding-top: 10px; padding-bottom: calc(var(--dock-h) + var(--nav-h) + env(safe-area-inset-bottom) + 20px); }
  .board { height: calc(100dvh - var(--top-h) - env(safe-area-inset-top) - var(--nav-h) - env(safe-area-inset-bottom)); }
  .toast { bottom: calc(var(--dock-h) + var(--nav-h) + env(safe-area-inset-bottom) + 10px); }
  .rep-nav strong { font-size: 15px; }
  /* 時間：今の記録＋アクションボタンを親指の届く範囲にコンパクトに */
  .rec-dock .now { min-height: 0; padding: 9px 12px; gap: 10px; border-radius: 12px; }
  .rec-dock .now-ic { font-size: 28px; }
  .rec-dock .now-time { font-size: 26px; }
  .rec-dock .now-name { font-size: 13px; }
  .rec-dock .stop { width: 44px; height: 44px; }
  .rec-dock .now-idle { font-size: 13px; padding: 6px 0; }
  .rec-dock .now-idle small { display: none; }
  /* 2段分の高さ。3段目以降はスクロール */
  .rec-dock .agrid { grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; max-height: var(--agrid-h, 132px); overflow-y: auto; overscroll-behavior: contain; scroll-snap-type: y proximity; }
  .rec-dock .agrid > * { scroll-snap-align: start; }
  .rec-dock .abtn { padding: 8px 2px 6px; gap: 3px; }
  .rec-dock .abtn .aic { font-size: 22px; }
  .rec-dock .abtn .an { font-size: 11.5px; }
  .dhead .dnum { font-size: 28px; }
}

/* ---- toast ---- */
.toast {
  position: fixed; z-index: 200; left: 50%; translate: -50% 0;
  bottom: calc(18px + env(safe-area-inset-bottom));
  display: flex; align-items: center; gap: 14px; max-width: calc(100vw - 24px);
  background: #172b4d; color: #fff; padding: 9px 10px 9px 16px; border-radius: 10px;
  box-shadow: var(--menu-shadow); font-size: 14px; animation: pop .15s ease-out;
}
.toast button { color: #85b8ff; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
.toast button:hover { background: rgba(255,255,255,.1); }

/* ---- auth ---- */
.auth { min-height: 100dvh; display: grid; place-items: center; padding: 20px; }
.auth-card { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 26px 22px; box-shadow: var(--shadow); }
.auth-card h1 { font-size: 22px; display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 6px; }
.auth-card h1 img { width: 30px; }
.auth-card p { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 18px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
.field input { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); outline: none; }
.field input:focus { border-color: var(--accent); }
.auth .btn { width: 100%; padding: 10px; }
.msg { font-size: 13px; margin-top: 10px; text-align: center; }
.msg.err { color: var(--danger); }
.link { display: block; margin: 14px auto 0; color: var(--accent); font-size: 13px; }
</style>
</head>
<body>
<div id="app"><div class="center muted">読み込み中…</div></div>
<script type="module">
import { html, render, useState, useEffect, useRef, useCallback, useMemo } from 'https://unpkg.com/htm@3.1.1/preact/standalone.module.js'
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.49.4'

// LifeOS / 7つの習慣 と同じ Supabase プロジェクト・同じアカウントを使う（テーブルは tb_ プレフィックス）
const sb = createClient('https://aowozgaddvxfrmxvhdms.supabase.co', 'sb_publishable_UoEj1KjRpaoCH1f__MplAw_Yd6NOY0L')
const DEFAULT_COLUMNS = ['未着手', '進行中', '完了']
const DEFAULT_CATEGORIES = [['家族', '#3498db'], ['仕事', '#e84393'], ['勉強', '#f1c40f']]

/* ================= utils ================= */
const uuid = () => (globalThis.crypto?.randomUUID ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16) }))
const pad = n => String(n).padStart(2, '0')
const WD = '日月火水木金土'
const dayKey = d => { const x = typeof d === 'string' ? new Date(d) : d; return `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}` }
const todayKey = () => dayKey(new Date())
const keyToDate = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d) }
function fmtStamp(iso) {
  const d = new Date(iso), t = `${pad(d.getHours())}:${pad(d.getMinutes())}`, md = `${d.getMonth() + 1}/${d.getDate()}`
  return d.getFullYear() !== new Date().getFullYear() ? `${d.getFullYear()}/${md} ${t}` : `${md} ${t}`
}
const fmtFull = iso => { const d = new Date(iso); return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]}) ${pad(d.getHours())}:${pad(d.getMinutes())} 作成` }
function dayLabel(k) {
  const y = new Date(); y.setDate(y.getDate() - 1)
  const d = keyToDate(k), base = `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`
  if (k === todayKey()) return `今日 ${base}`
  if (k === dayKey(y)) return `昨日 ${base}`
  return d.getFullYear() !== new Date().getFullYear() ? `${d.getFullYear()}/${base}` : base
}
const isEnter = e => e.key === 'Enter' && !e.isComposing && e.keyCode !== 229   // 日本語変換の確定Enterは無視
const byCreatedDesc = (a, b) => (a.created_at < b.created_at ? 1 : -1)
function useLS(key, init) {
  const [v, setV] = useState(() => localStorage.getItem(key) ?? init)
  return [v, x => { localStorage.setItem(key, x); setV(x) }]
}

/* ================= data ================= */
function useBoard(userId, notify) {
  const [items, setItems] = useState([])
  const [columns, setColumns] = useState([])
  const [categories, setCategories] = useState([])
  const [loading, setLoading] = useState(true)
  const [online, setOnline] = useState(true)
  const itemsRef = useRef(items); itemsRef.current = items
  const colsRef = useRef(columns); colsRef.current = columns
  const catsRef = useRef(categories); catsRef.current = categories
  const notifyRef = useRef(notify); notifyRef.current = notify

  const load = useCallback(async () => {
    const [ir, cr, kr] = await Promise.all([
      sb.from('tb_items').select('*').order('created_at', { ascending: false }).limit(5000),
      sb.from('tb_columns').select('*').order('position'),
      sb.from('tb_categories').select('*').order('position'),
    ])
    const err = ir.error || cr.error || kr.error
    if (err) { setOnline(false); setLoading(false); notifyRef.current('読み込みに失敗しました: ' + err.message); return }
    let cols = cr.data, cats = kr.data
    const seedKey = 'tb_seeded_' + userId
    if (cols.length === 0 && !localStorage.getItem(seedKey)) {
      localStorage.setItem(seedKey, '1')
      const { data } = await sb.from('tb_columns').insert(DEFAULT_COLUMNS.map((title, i) => ({ id: uuid(), title, position: i, user_id: userId }))).select()
      cols = data || []
    }
    const catKey = 'tb_cats_seeded_' + userId
    if (cats.length === 0 && !localStorage.getItem(catKey)) {
      localStorage.setItem(catKey, '1')
      const { data } = await sb.from('tb_categories').insert(DEFAULT_CATEGORIES.map(([name, color], i) => ({ id: uuid(), name, color, position: i, user_id: userId }))).select()
      cats = data || []
    }
    setItems(ir.data); setColumns(cols); setCategories([...cats].sort((a, b) => a.position - b.position)); setOnline(true); setLoading(false)
  }, [userId])

  useEffect(() => {
    load()
    let t
    const soon = () => { clearTimeout(t); t = setTimeout(load, 600) }
    // 他の端末での変更をリアルタイムに反映
    const ch = sb.channel('tb-sync-' + userId)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'tb_items' }, soon)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'tb_columns' }, soon)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'tb_categories' }, soon)
      .subscribe()
    const onVis = () => document.visibilityState === 'visible' && load()
    document.addEventListener('visibilitychange', onVis)
    window.addEventListener('online', load)
    return () => { clearTimeout(t); sb.removeChannel(ch); document.removeEventListener('visibilitychange', onVis); window.removeEventListener('online', load) }
  }, [load])

  const act = useMemo(() => {
    const now = () => new Date().toISOString()
    const fail = error => { if (error) { notifyRef.current('保存に失敗しました: ' + error.message); setOnline(false); load() } return !!error }
    const nextPos = colId => { const ps = itemsRef.current.filter(i => i.column_id === colId).map(i => i.position); return ps.length ? Math.max(...ps) + 1 : 0 }
    const colName = id => colsRef.current.find(c => c.id === id)?.title ?? ''

    const a = {
      async addItem(content, columnId = null, extra = {}) {
        const it = { id: uuid(), content, done: false, done_at: null, column_id: columnId, position: columnId ? nextPos(columnId) : 0, created_at: now(), note: '', subtasks: [], due: null, category_id: null, ...extra }
        setItems(p => [it, ...p])
        const { error } = await sb.from('tb_items').insert({ ...it, user_id: userId }); fail(error)
      },
      async update(id, patch) {
        setItems(p => p.map(i => (i.id === id ? { ...i, ...patch } : i)))
        const { error } = await sb.from('tb_items').update({ ...patch, updated_at: now() }).eq('id', id); return !fail(error)
      },
      toggle: item => a.update(item.id, item.done ? { done: false, done_at: null } : { done: true, done_at: now() }),
      async remove(item) {
        setItems(p => p.filter(i => i.id !== item.id))
        const { error } = await sb.from('tb_items').delete().eq('id', item.id)
        if (fail(error)) return
        notifyRef.current('削除しました', async () => {
          const back = { ...item, column_id: colsRef.current.some(c => c.id === item.column_id) ? item.column_id : null }
          setItems(p => [back, ...p].sort(byCreatedDesc))
          const { error } = await sb.from('tb_items').insert({ ...back, user_id: userId }); fail(error)
        })
      },
      // columnId=null で Inbox に戻す。beforeId を渡すとそのカードの直前に入れる
      async move(id, columnId, beforeId = null, { silent = false } = {}) {
        const it = itemsRef.current.find(i => i.id === id)
        if (!it || beforeId === id) return
        let position = 0
        if (columnId) {
          const list = itemsRef.current.filter(i => i.column_id === columnId && i.id !== id).sort((x, y) => x.position - y.position)
          const idx = beforeId ? list.findIndex(i => i.id === beforeId) : -1
          if (idx === -1) position = list.length ? list[list.length - 1].position + 1 : 0
          else position = idx === 0 ? list[0].position - 1 : (list[idx - 1].position + list[idx].position) / 2
        }
        const prev = { column_id: it.column_id, position: it.position }
        const ok = await a.update(id, { column_id: columnId, position })
        if (ok && !silent && prev.column_id !== columnId) {
          notifyRef.current(columnId ? `「${colName(columnId)}」へ移動しました` : 'Inboxに戻しました', () => a.update(id, prev))
        }
      },
      async addColumn(title) {
        const c = { id: uuid(), title, position: colsRef.current.length ? Math.max(...colsRef.current.map(c => c.position)) + 1 : 0, created_at: now() }
        setColumns(p => [...p, c])
        const { error } = await sb.from('tb_columns').insert({ ...c, user_id: userId }); fail(error)
      },
      async renameColumn(id, title) {
        setColumns(p => p.map(c => (c.id === id ? { ...c, title } : c)))
        const { error } = await sb.from('tb_columns').update({ title }).eq('id', id); fail(error)
      },
      // ドラッグで列を beforeId の直前へ（null なら一番右）
      async reorderColumn(id, beforeId) {
        const list = colsRef.current.filter(c => c.id !== id)
        const idx = beforeId ? list.findIndex(c => c.id === beforeId) : -1
        const position = idx === -1 ? (list.length ? list[list.length - 1].position + 1 : 0)
          : idx === 0 ? list[0].position - 1 : (list[idx - 1].position + list[idx].position) / 2
        setColumns(p => p.map(c => (c.id === id ? { ...c, position } : c)).sort((x, y) => x.position - y.position))
        const { error } = await sb.from('tb_columns').update({ position }).eq('id', id); fail(error)
      },
      async shiftColumn(id, dir) {
        const cols = [...colsRef.current], i = cols.findIndex(c => c.id === id), j = i + dir
        if (i < 0 || j < 0 || j >= cols.length) return
        const A = cols[i], B = cols[j]
        let pa = B.position, pb = A.position
        if (pa === pb) { pa = j; pb = i }
        setColumns(p => p.map(c => (c.id === A.id ? { ...c, position: pa } : c.id === B.id ? { ...c, position: pb } : c)).sort((x, y) => x.position - y.position))
        const r = await Promise.all([sb.from('tb_columns').update({ position: pa }).eq('id', A.id), sb.from('tb_columns').update({ position: pb }).eq('id', B.id)])
        fail(r[0].error || r[1].error)
      },
      async removeColumn(col) {
        // 列を消しても中のカードは消さずに Inbox へ戻す（DB側も on delete set null）
        setItems(p => p.map(i => (i.column_id === col.id ? { ...i, column_id: null } : i)))
        setColumns(p => p.filter(c => c.id !== col.id))
        const r1 = await sb.from('tb_items').update({ column_id: null }).eq('column_id', col.id)
        if (fail(r1.error)) return
        const { error } = await sb.from('tb_columns').delete().eq('id', col.id); fail(error)
      },
      // カテゴリ（色分け）
      async addCategory(name, color) {
        const c = { id: uuid(), name, color, position: catsRef.current.length ? Math.max(...catsRef.current.map(x => x.position)) + 1 : 0, created_at: now() }
        setCategories(p => [...p, c])
        const { error } = await sb.from('tb_categories').insert({ ...c, user_id: userId }); fail(error)
      },
      async updateCategory(id, patch) {
        setCategories(p => p.map(c => (c.id === id ? { ...c, ...patch } : c)))
        const { error } = await sb.from('tb_categories').update(patch).eq('id', id); fail(error)
      },
      async reorderCategory(id, dir) {
        const list = catsRef.current, i = list.findIndex(c => c.id === id), j = i + dir
        if (i < 0 || j < 0 || j >= list.length) return
        const A = list[i], B = list[j]
        let pa = B.position, pb = A.position
        if (pa === pb) { pa = j; pb = i }
        setCategories(p => p.map(c => (c.id === A.id ? { ...c, position: pa } : c.id === B.id ? { ...c, position: pb } : c)).sort((x, y) => x.position - y.position))
        const r = await Promise.all([sb.from('tb_categories').update({ position: pa }).eq('id', A.id), sb.from('tb_categories').update({ position: pb }).eq('id', B.id)])
        fail(r[0].error || r[1].error)
      },
      async removeCategory(cat) {
        // カテゴリを消してもカードは残す（色分けが外れるだけ。DB側も on delete set null）
        setItems(p => p.map(i => (i.category_id === cat.id ? { ...i, category_id: null } : i)))
        setCategories(p => p.filter(c => c.id !== cat.id))
        const { error } = await sb.from('tb_categories').delete().eq('id', cat.id); fail(error)
      },
    }
    return a
  }, [userId, load])

  return { items, columns, categories, loading, online, act, reload: load }
}

/* ================= small components ================= */
function DotMenu({ render, label = 'メニュー' }) {
  const [pos, setPos] = useState(null)
  const btn = useRef(), menu = useRef()
  const close = () => setPos(null)
  useEffect(() => {
    if (!pos) return
    const down = e => { if (!menu.current?.contains(e.target) && !btn.current?.contains(e.target)) close() }
    const key = e => e.key === 'Escape' && close()
    const scroll = e => { if (!menu.current?.contains(e.target)) close() }
    document.addEventListener('pointerdown', down)
    document.addEventListener('keydown', key)
    window.addEventListener('scroll', scroll, true)
    window.addEventListener('resize', close)
    return () => {
      document.removeEventListener('pointerdown', down); document.removeEventListener('keydown', key)
      window.removeEventListener('scroll', scroll, true); window.removeEventListener('resize', close)
    }
  }, [pos])
  const toggle = e => {
    e.stopPropagation()
    if (pos) return close()
    const r = btn.current.getBoundingClientRect()
    const right = Math.max(8, innerWidth - r.right)
    setPos(r.bottom < innerHeight * 0.6 ? { top: r.bottom + 4, right } : { bottom: innerHeight - r.top + 4, right })
  }
  // 開いたあとで実際の大きさを測り、画面（スマホの下部ナビ・キーボードを含む）からはみ出さないように寄せる
  useEffect(() => {
    const m = menu.current; if (!pos || !m) return
    const vv = window.visualViewport, vw = vv ? vv.width : innerWidth, vh = vv ? vv.height : innerHeight
    const nav = document.querySelector('.bnav'), inSheet = m.closest('.sheet')
    const navTop = nav && !inSheet && getComputedStyle(nav).display !== 'none' ? nav.getBoundingClientRect().top : vh
    const bottomLimit = Math.min(vh, navTop) - 8, topLimit = 8
    m.style.maxHeight = (bottomLimit - topLimit) + 'px'
    let r = m.getBoundingClientRect()
    if (r.bottom > bottomLimit) { m.style.bottom = 'auto'; m.style.top = Math.max(topLimit, bottomLimit - r.height) + 'px' }
    else if (r.top < topLimit) { m.style.bottom = 'auto'; m.style.top = topLimit + 'px' }
    r = m.getBoundingClientRect()
    if (r.left < 8) { m.style.right = 'auto'; m.style.left = '8px' }
    if (r.right > vw - 8) { m.style.left = 'auto'; m.style.right = '8px' }
  }, [pos])
  return html`
    <button ref=${btn} class="dots" aria-label=${label} aria-haspopup="menu" aria-expanded=${pos ? 'true' : 'false'} onClick=${toggle} draggable=${false}>•••</button>
    ${pos && html`<div ref=${menu} class="menu" role="menu" style=${pos} onClick=${e => e.stopPropagation()}>${render(close)}</div>`}`
}

const Check = ({ done, onToggle }) => html`
  <button class=${'check' + (done ? ' on' : '')} role="checkbox" aria-checked=${done ? 'true' : 'false'}
    title=${done ? 'クリックで未済に戻す' : 'クリックで処理済にする'} onClick=${e => { e.stopPropagation(); onToggle() }}>
    <i>${done && html`<svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7" /></svg>`}</i>
  </button>`

function EditInput({ value, onSave, onCancel }) {
  const [v, setV] = useState(value)
  const ref = useRef(), finished = useRef(false)
  useEffect(() => { ref.current.focus(); ref.current.select() }, [])
  const save = () => { if (finished.current) return; finished.current = true; const t = v.trim(); t && t !== value ? onSave(t) : onCancel() }
  return html`<input ref=${ref} class="edit" value=${v} onInput=${e => setV(e.target.value)} onBlur=${save}
    onKeyDown=${e => { if (isEnter(e)) { e.preventDefault(); save() } else if (e.key === 'Escape') { finished.current = true; onCancel() } }} />`
}

const MI = ({ icon, label, onClick, danger }) => html`
  <button class=${'mi' + (danger ? ' danger' : '')} role="menuitem" onClick=${onClick}><span class="ic">${icon}</span>${label}</button>`

/* ================= inbox ================= */
function InboxRow({ item, cat, columns, act, openDetail }) {
  return html`
    <li class=${'row' + (item.done ? ' done' : '') + (cat ? ' has-cat' : '')} style=${cat ? `--cc:${cat.color}` : ''}>
      <${Check} done=${item.done} onToggle=${() => act.toggle(item)} />
      <span class="text" role="button" tabindex="0" title="タップで詳細（補足・小タスク・期限・カテゴリ）" onClick=${() => openDetail(item.id)}
        onKeyDown=${e => e.key === 'Enter' && openDetail(item.id)}>${item.content}<${ItemMeta} item=${item} />${(item.due || cat) && html`<span class="rsub"><${DueBadge} item=${item} /><${CatBadge} cat=${cat} /></span>`}</span>
      <time class="stamp" datetime=${item.created_at} title=${fmtFull(item.created_at)}>${fmtStamp(item.created_at)}</time>
      <${DotMenu} render=${close => html`
        <${MI} icon="✎" label="詳細・編集" onClick=${() => { close(); openDetail(item.id) }} />
        <${MI} icon=${item.done ? '↺' : '✓'} label=${item.done ? '未済に戻す' : '処理済にする'} onClick=${() => { close(); act.toggle(item) }} />
        <div class="msec">ボード（カンバン）へ移動</div>
        ${columns.length === 0 && html`<div class="msec" style="font-weight:400">列がありません</div>`}
        ${columns.map(c => html`<${MI} key=${c.id} icon="→" label=${c.title} onClick=${() => { close(); act.move(item.id, c.id) }} />`)}
        <div class="msep"></div>
        <${MI} icon="🗑" label="削除" danger onClick=${() => { close(); act.remove(item) }} />`} />
    </li>`
}

function Calendar({ month, setMonth, counts, day, setDay }) {
  const y = month.getFullYear(), m = month.getMonth()
  const lead = new Date(y, m, 1).getDay(), n = new Date(y, m + 1, 0).getDate(), tk = todayKey()
  const cells = [...Array(lead).fill(0), ...Array.from({ length: n }, (_, i) => i + 1)]
  const goToday = () => { const d = new Date(); setMonth(new Date(d.getFullYear(), d.getMonth(), 1)); setDay(tk) }
  return html`
    <div class="cal">
      <div class="cal-head">
        <button class="icon" aria-label="前の月" onClick=${() => setMonth(new Date(y, m - 1, 1))}>‹</button>
        <strong>${y}年${m + 1}月</strong>
        <button class="icon" aria-label="次の月" onClick=${() => setMonth(new Date(y, m + 1, 1))}>›</button>
        <button class="chip" onClick=${goToday}>今日</button>
      </div>
      <div class="cal-grid">
        ${[...WD].map((w, i) => html`<div class=${'cal-w' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '')}>${w}</div>`)}
        ${cells.map((d, i) => {
          if (!d) return html`<div key=${'b' + i}></div>`
          const k = `${y}-${pad(m + 1)}-${pad(d)}`, c = counts[k]
          return html`<button key=${k} class=${'cal-d' + (k === day ? ' sel' : '') + (k === tk ? ' today' : '')} onClick=${() => setDay(k)}
              title=${c ? `${c.total}件（未済 ${c.open}）` : ''}>
            <span class="n">${d}</span>
            <span class=${'cnt' + (!c ? ' none' : c.open === 0 ? ' alldone' : '')}>${c ? (c.open || c.total) : ''}</span>
          </button>`
        })}
      </div>
    </div>`
}

function Inbox({ items, columns, categories, act, openDetail }) {
  const catById = useMemo(() => Object.fromEntries(categories.map(c => [c.id, c])), [categories])
  const [text, setText] = useState('')
  const [view, setView] = useLS('tb_view', 'list')
  const [status, setStatus] = useLS('tb_status', 'all')
  const [q, setQ] = useState('')
  const [day, setDay] = useState(todayKey)
  const [month, setMonth] = useState(() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1) })
  const inputRef = useRef()

  const add = () => {
    const t = text.trim(); if (!t) return
    act.addItem(t); setText('')
    if (view === 'calendar') { const d = new Date(); setDay(todayKey()); setMonth(new Date(d.getFullYear(), d.getMonth(), 1)) }
    inputRef.current?.focus()
  }

  const base = useMemo(() => {
    const ql = q.trim().toLowerCase()
    return items.filter(i => (status === 'all' || (status === 'open' ? !i.done : i.done)) && (!ql || i.content.toLowerCase().includes(ql)))
  }, [items, status, q])
  const counts = useMemo(() => {
    const m = {}
    for (const i of items) { const k = dayKey(i.created_at); (m[k] ||= { total: 0, open: 0 }).total++; if (!i.done) m[k].open++ }
    return m
  }, [items])
  const groups = useMemo(() => {
    const out = []; let cur = null
    for (const i of base) { const k = dayKey(i.created_at); if (!cur || cur.k !== k) out.push(cur = { k, list: [] }); cur.list.push(i) }
    return out
  }, [base])
  const dayList = useMemo(() => base.filter(i => dayKey(i.created_at) === day), [base, day])

  const rows = list => html`<ul class="list">${list.map(i => html`<${InboxRow} key=${i.id} item=${i} cat=${catById[i.category_id]} columns=${columns} act=${act} openDetail=${openDetail} />`)}</ul>`
  const openCount = items.filter(i => !i.done).length

  return html`
    <main class=${'inbox' + (view === 'calendar' ? ' calmode' : '')}>
      <${Dock} cls="inbox-dock">
        <div class="toolbar">
          <div class="seg" role="tablist">
            <button class=${view === 'list' ? 'on' : ''} onClick=${() => setView('list')}>☰ 一覧</button>
            <button class=${view === 'calendar' ? 'on' : ''} onClick=${() => setView('calendar')}>▦ カレンダー</button>
          </div>
          <div class="chips">
            ${[['all', 'すべて'], ['open', '未済'], ['done', '処理済']].map(([k, l]) => html`<button class=${'chip' + (status === k ? ' on' : '')} onClick=${() => setStatus(k)}>${l}</button>`)}
          </div>
        </div>
        <div class="composer">
          <input ref=${inputRef} value=${text} placeholder="思いついたことを入力…" enterkeyhint="done" aria-label="新しいメモ・タスク"
            onInput=${e => setText(e.target.value)} onKeyDown=${e => { if (isEnter(e)) { e.preventDefault(); add() } }} />
          <button class="btn" disabled=${!text.trim()} onClick=${add}>追加</button>
        </div>
      <//>
      <label class="search"><span class="muted">⌕</span><input type="search" placeholder="検索" value=${q} onInput=${e => setQ(e.target.value)} /></label>

      ${view === 'list' ? html`
        ${groups.length === 0 && html`<div class="empty">${items.length ? '条件に合うものはありません' : 'まだ何もありません。入力欄に思いついたことを書いてみましょう。'}</div>`}
        ${groups.map(g => html`<section key=${g.k}><div class="ghead"><span>${dayLabel(g.k)}</span><span>${g.list.length}件</span></div>${rows(g.list)}</section>`)}
        ${items.length > 0 && html`<div class="ghead" style="justify-content:center;margin-top:20px"><span>Inbox 未済 ${openCount} 件</span></div>`}
      ` : html`
        <div class="calwrap">
          <${Calendar} month=${month} setMonth=${setMonth} counts=${counts} day=${day} setDay=${setDay} />
          <section>
            <div class="ghead" style="margin-top:0"><span>${dayLabel(day)}</span><span>${dayList.length}件</span></div>
            ${dayList.length ? rows(dayList) : html`<div class="empty list">この日の項目はありません</div>`}
          </section>
        </div>`}
    </main>`
}

/* ================= item detail（補足メモ・小タスク・期限・カテゴリ） ================= */
const autoGrow = el => { if (el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px' } }
const CAT_COLORS = ['#3498db', '#e84393', '#f1c40f', '#2ecc71', '#9b59b6', '#e67e22', '#e74c3c', '#1abc9c', '#34495e', '#95a5a6', '#0984e3', '#fd79a8']

// 期限 → 表示用（あと何日・超過など）
function dueInfo(due) {
  if (!due) return null
  const d = keyToDate(due), diff = Math.round((d - startOfDay(new Date())) / 86400000)
  const label = `${d.getFullYear() !== new Date().getFullYear() ? d.getFullYear() + '/' : ''}${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`
  const rest = diff > 1 ? `あと${diff}日` : diff === 1 ? '明日まで' : diff === 0 ? '今日まで' : `${-diff}日超過`
  return { label, rest, diff, level: diff < 0 ? 'over' : diff <= 1 ? 'soon' : diff <= 3 ? 'near' : 'ok' }
}
const DueBadge = ({ item }) => {
  const d = dueInfo(item.due)
  if (!d) return ''
  return html`<span class=${'due ' + (item.done ? 'fin' : d.level)} title="期限">📅 ${d.label}${item.done ? '' : html`<b>${d.rest}</b>`}</span>`
}
const CatBadge = ({ cat }) => (cat ? html`<span class="cbadge" style=${`--c:${cat.color}`}>${cat.name}</span>` : '')

const ItemMeta = ({ item }) => {
  const subs = item.subtasks || [], d = subs.filter(s => s.done).length
  if (!item.note && !subs.length) return ''
  return html`<span class="imeta">${item.note ? html`<span title="補足メモあり">📝</span>` : ''}${subs.length ? html`<span class=${'sp' + (d === subs.length ? ' ok' : '')} title="小タスク">☑ ${d}/${subs.length}</span>` : ''}</span>`
}

function SubRow({ s, onToggle, onText, onDelete }) {
  const [v, setV] = useState(s.text)
  useEffect(() => setV(s.text), [s.text])
  return html`
    <li class=${'sub' + (s.done ? ' done' : '')}>
      <${Check} done=${s.done} onToggle=${onToggle} />
      <input value=${v} aria-label="小タスク" onInput=${e => setV(e.target.value)} onKeyDown=${e => isEnter(e) && e.target.blur()}
        onBlur=${() => { const t = v.trim(); if (!t) setV(s.text); else if (t !== s.text) onText(t) }} />
      <button class="x" aria-label="小タスクを削除" title="削除" onClick=${onDelete}>×</button>
    </li>`
}

function ItemDetail({ item, columns, categories, act, onClose, openCats }) {
  const [title, setTitle] = useState(item.content)
  const [note, setNote] = useState(item.note || '')
  const [newSub, setNewSub] = useState('')
  const focus = useRef(null), titleRef = useRef(), noteRef = useRef()
  const latest = useRef(); latest.current = { title, note, item }
  const subs = item.subtasks || []
  // 他の端末で変わった内容を反映（入力中の欄は上書きしない）
  useEffect(() => { if (focus.current !== 'title') setTitle(item.content) }, [item.content])
  useEffect(() => { if (focus.current !== 'note') setNote(item.note || '') }, [item.note])
  useEffect(() => { autoGrow(titleRef.current); autoGrow(noteRef.current) }, [title, note])
  const saveTitle = () => { focus.current = null; const t = latest.current.title.trim(); if (!t) return setTitle(item.content); if (t !== latest.current.item.content) act.update(item.id, { content: t }) }
  const saveNote = () => { focus.current = null; if (latest.current.note !== (latest.current.item.note || '')) act.update(item.id, { note: latest.current.note }) }
  // 閉じたときに未保存の入力があれば保存
  useEffect(() => () => {
    const { title: t, note: n, item: it } = latest.current
    const patch = {}
    if (t.trim() && t.trim() !== it.content) patch.content = t.trim()
    if (n !== (it.note || '')) patch.note = n
    if (Object.keys(patch).length) act.update(it.id, patch)
  }, [])
  const setSubs = s => act.update(item.id, { subtasks: s })
  const addSub = () => { const t = newSub.trim(); if (!t) return; setSubs([...subs, { id: uuid(), text: t, done: false }]); setNewSub('') }
  const doneN = subs.filter(s => s.done).length
  const setDue = v => act.update(item.id, { due: v || null })
  const d = dueInfo(item.due)
  return html`<${Modal} title="詳細" onClose=${onClose}>
    <div class="dt-top">
      <${Check} done=${item.done} onToggle=${() => act.toggle(item)} />
      <textarea ref=${titleRef} class=${'dt-title' + (item.done ? ' done' : '')} rows="1" value=${title} aria-label="タイトル"
        onFocus=${() => { focus.current = 'title' }} onInput=${e => { setTitle(e.target.value); autoGrow(e.target) }} onBlur=${saveTitle}
        onKeyDown=${e => { if (isEnter(e)) { e.preventDefault(); e.target.blur() } }}></textarea>
    </div>
    <div class="dt-meta">
      <span>🕒 ${fmtFull(item.created_at)}</span>
      <select value=${item.column_id || ''} aria-label="置き場所" onChange=${e => act.move(item.id, e.target.value || null)}>
        <option value="">📥 Inbox</option>
        ${columns.map(c => html`<option value=${c.id}>🗂️ ${c.title}</option>`)}
      </select>
    </div>
    <div class="dt-sec">
      <label><span>期限</span>${d && !item.done && html`<span class=${'due ' + d.level}><b>${d.rest}</b></span>`}</label>
      <div class="duerow">
        <input type="date" value=${item.due || ''} aria-label="期限" onChange=${e => setDue(e.target.value)} />
        <button class="chip" onClick=${() => setDue(todayKey())}>今日</button>
        <button class="chip" onClick=${() => setDue(dayKey(addDays(new Date(), 1)))}>明日</button>
        <button class="chip" onClick=${() => setDue(dayKey(addDays(new Date(), 7)))}>1週間後</button>
        ${item.due && html`<button class="chip" onClick=${() => setDue('')}>なし</button>`}
      </div>
    </div>
    <div class="dt-sec">
      <label><span>カテゴリ</span><button class="link-btn" onClick=${openCats}>編集</button></label>
      <div class="catpick">
        <button class=${'chip' + (!item.category_id ? ' on' : '')} onClick=${() => act.update(item.id, { category_id: null })}>なし</button>
        ${categories.map(c => html`<button key=${c.id} class=${'chip cchip' + (item.category_id === c.id ? ' on' : '')} style=${`--c:${c.color}`}
          onClick=${() => act.update(item.id, { category_id: item.category_id === c.id ? null : c.id })}><i></i>${c.name}</button>`)}
      </div>
    </div>
    <div class="dt-sec">
      <label>補足・メモ</label>
      <textarea ref=${noteRef} class="dt-note" rows="3" value=${note} placeholder="詳しい内容や補足を書く…"
        onFocus=${() => { focus.current = 'note' }} onInput=${e => { setNote(e.target.value); autoGrow(e.target) }} onBlur=${saveNote}></textarea>
    </div>
    <div class="dt-sec">
      <label><span>小タスク</span>${subs.length > 0 && html`<span>${doneN} / ${subs.length}</span>`}</label>
      ${subs.length > 0 && html`<div class="pbar"><i style=${`width:${(doneN / subs.length) * 100}%`}></i></div>`}
      <ul class="subs">
        ${subs.map(s => html`<${SubRow} key=${s.id} s=${s}
          onToggle=${() => setSubs(subs.map(x => (x.id === s.id ? { ...x, done: !x.done } : x)))}
          onText=${t => setSubs(subs.map(x => (x.id === s.id ? { ...x, text: t } : x)))}
          onDelete=${() => setSubs(subs.filter(x => x.id !== s.id))} />`)}
      </ul>
      <div class="sub-add">
        <span>＋</span>
        <input value=${newSub} placeholder="小タスクを追加" enterkeyhint="enter" aria-label="小タスクを追加"
          onInput=${e => setNewSub(e.target.value)} onKeyDown=${e => { if (isEnter(e)) { e.preventDefault(); addSub() } }} />
        <button class="btn" disabled=${!newSub.trim()} onMouseDown=${e => e.preventDefault()} onClick=${addSub}>追加</button>
      </div>
    </div>
    <div class="acts">
      <button class="btn danger" onClick=${() => { onClose(); act.remove(item) }}>削除</button>
      <span class="grow"></span>
      <button class="btn" onClick=${onClose}>完了</button>
    </div>
  <//>`
}

function CatName({ cat, act }) {
  const [v, setV] = useState(cat.name)
  useEffect(() => setV(cat.name), [cat.name])
  return html`<input class="cname" value=${v} aria-label="カテゴリ名" onInput=${e => setV(e.target.value)} onKeyDown=${e => isEnter(e) && e.target.blur()}
    onBlur=${() => { const t = v.trim(); if (!t) setV(cat.name); else if (t !== cat.name) act.updateCategory(cat.id, { name: t }) }} />`
}

function CategoryModal({ categories, items, act, onClose }) {
  const [name, setName] = useState('')
  const [color, setColor] = useState(CAT_COLORS[categories.length % CAT_COLORS.length])
  const [palette, setPalette] = useState(null)

    ${categories.length ? html`<ul class="list">${categories.map((c, i) => html`
      <li class="row catrow" key=${c.id}>
        <button class="cswatch" style=${`--c:${c.color}`} aria-label="色を変更" onClick=${() => setPalette(palette === c.id ? null : c.id)}></button>

        <small class="muted">${items.filter(x => x.category_id === c.id).length}件</small>
        <button class="icon sm" aria-label="上へ" disabled=${i === 0} onClick=${() => act.reorderCategory(c.id, -1)}>↑</button>
        <button class="icon sm" aria-label="下へ" disabled=${i === categories.length - 1} onClick=${() => act.reorderCategory(c.id, 1)}>↓</button>
        <button class="icon sm" aria-label="削除" onClick=${() => { if (confirm(`カテゴリ「${c.name}」を削除しますか？\nカードは消えず、色分けが外れるだけです。`)) act.removeCategory(c) }}>🗑</button>
        ${palette === c.id && html`<div class="swatches catpal">${CAT_COLORS.map(col => html`<button type="button" aria-label=${col} class=${col === c.color ? 'on' : ''} style=${`--c:${col}`}
          onClick=${() => { act.updateCategory(c.id, { color: col }); setPalette(null) }}></button>`)}</div>`}
      </li>`)}</ul>` : html`<div class="empty list">カテゴリはまだありません</div>`}
    <div class="dt-sec">
      <label>新しいカテゴリ</label>
      <div class="swatches" style="margin-bottom:8px">${CAT_COLORS.map(col => html`<button type="button" aria-label=${col} class=${col === color ? 'on' : ''} style=${`--c:${col}`} onClick=${() => setColor(col)}></button>`)}</div>
      <div class="sub-add" style="padding:0">
        <span class="cswatch" style=${`--c:${color}`}></span>
        <input value=${name} placeholder="例: 家族、仕事、勉強" onInput=${e => setName(e.target.value)} onKeyDown=${e => { if (isEnter(e)) { e.preventDefault(); add() } }} />
        <button class="btn" disabled=${!name.trim()} onClick=${add}>追加</button>
      </div>
    </div>
    <div class="acts"><span class="grow"></span><button class="btn" onClick=${onClose}>完了</button></div>
  <//>`
}

/* ================= drag（マウスでもタッチでも） ================= */
// マウス: 5px動かしたら開始 / タッチ: 長押し(0.35秒)で開始（それまでに指を動かしたら普通のスクロール）
const NO_DRAG = 'button:not([data-drag]), input, textarea, select, a, .menu, .dots'
function usePointerDrag({ onMove, onDrop, onEnd }) {
  const [drag, setDrag] = useState(null)
  const [pos, setPos] = useState(null)
  const dragRef = useRef(null), posRef = useRef(null), clickBlock = useRef(false)
  const cb = useRef(); cb.current = { onMove, onDrop, onEnd }
  const press = (e, data, el, label) => {
    if (e.button > 0 || e.target.closest(NO_DRAG)) return
    const touch = e.pointerType !== 'mouse'
    const sx = e.clientX, sy = e.clientY, r = el.getBoundingClientRect()
    let started = false, timer
    const start = (x, y) => {
      started = true
      try { if (navigator.userActivation?.hasBeenActive) navigator.vibrate?.(12) } catch {}
      const d = { ...data, label, w: Math.min(r.width, 300), offX: Math.min(sx - r.left, 280), offY: Math.min(sy - r.top, 40) }
      dragRef.current = d; posRef.current = { x, y }
      setDrag(d); setPos({ x, y }); cb.current.onMove(x, y, d)
    }
    const move = ev => {
      const x = ev.clientX, y = ev.clientY
      if (!started) {
        if (Math.hypot(x - sx, y - sy) > (touch ? 10 : 5)) { if (touch) cleanup(); else start(x, y) }
        return
      }
      posRef.current = { x, y }; setPos({ x, y }); cb.current.onMove(x, y, dragRef.current)
    }
    const blockTouch = ev => { if (started) ev.preventDefault() }   // ドラッグ中は画面をスクロールさせない
    const blockMenu = ev => { if (started || touch) ev.preventDefault() }
    const finish = ok => {
      cleanup()
      if (!started) return
      clickBlock.current = true; setTimeout(() => { clickBlock.current = false }, 60)
      const d = dragRef.current
      dragRef.current = null; setDrag(null); setPos(null)
      if (ok) cb.current.onDrop(d)
      cb.current.onEnd?.()
    }
    const up = () => finish(true), cancel = () => finish(false)
    const key = ev => ev.key === 'Escape' && finish(false)
    function cleanup() {
      clearTimeout(timer)
      removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', cancel)
      removeEventListener('touchmove', blockTouch); removeEventListener('keydown', key); removeEventListener('contextmenu', blockMenu)
    }
    addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', cancel)
    addEventListener('touchmove', blockTouch, { passive: false }); addEventListener('keydown', key); addEventListener('contextmenu', blockMenu)
    if (touch) timer = setTimeout(() => start(sx, sy), 350)
  }
  return {
    drag, pos, posRef, press,
    isDragging: (kind, id) => drag?.kind === kind && drag.id === id,
    consumeClick: () => { const b = clickBlock.current; clickBlock.current = false; return b },
  }
}
const DragGhost = ({ pd, cls = '' }) => (pd.drag && pd.pos
  ? html`<div class=${'drag-ghost ' + cls + ' ' + pd.drag.kind} style=${{ left: pd.pos.x - pd.drag.offX, top: pd.pos.y - pd.drag.offY, width: pd.drag.w }}>${pd.drag.label}</div>` : '')

/* ================= board ================= */
function Card({ item, col, columns, cat, act, openDetail, dnd }) {
  const cls = 'card' + (item.done ? ' done' : '') + (cat ? ' has-cat' : '') + (dnd.isDragging('card', item.id) ? ' dragging' : '') + (dnd.target?.before === item.id ? ' drop-before' : '')
  const sub = !!(item.due || cat || item.note || (item.subtasks || []).length)
  return html`
    <div class=${cls} data-id=${item.id} style=${cat ? `--cc:${cat.color}` : ''}
      onPointerDown=${e => dnd.press(e, { kind: 'card', id: item.id }, e.currentTarget, item.content)}
      onClick=${() => { if (!dnd.consumeClick()) openDetail(item.id) }}>
      <${Check} done=${item.done} onToggle=${() => act.toggle(item)} />
      <div class="cbody">
        <div class="text">${item.content}</div>
        ${sub && html`<div class="csub"><${DueBadge} item=${item} /><${CatBadge} cat=${cat} /><${ItemMeta} item=${item} /></div>`}
      </div>
      <time class="stamp" datetime=${item.created_at} title=${fmtFull(item.created_at)}>${fmtStamp(item.created_at)}</time>
      <${DotMenu} render=${close => html`
        <${MI} icon="✎" label="詳細・編集" onClick=${() => { close(); openDetail(item.id) }} />
        <${MI} icon=${item.done ? '↺' : '✓'} label=${item.done ? '未済に戻す' : '処理済にする'} onClick=${() => { close(); act.toggle(item) }} />
        ${columns.length > 1 && html`<div class="msec">別の列へ移動</div>`}
        ${columns.filter(c => c.id !== col.id).map(c => html`<${MI} key=${c.id} icon="→" label=${c.title} onClick=${() => { close(); act.move(item.id, c.id) }} />`)}
        <div class="msep"></div>
        <${MI} icon="⤺" label="Inboxに戻す" onClick=${() => { close(); act.move(item.id, null) }} />
        <${MI} icon="🗑" label="削除" danger onClick=${() => { close(); act.remove(item) }} />`} />
    </div>`
}

function AddForm({ placeholder, button, onAdd, onClose, keepOpen }) {
  const [v, setV] = useState('')
  const ref = useRef()
  useEffect(() => ref.current.focus(), [])
  const submit = () => { const t = v.trim(); if (!t) return onClose(); onAdd(t); setV(''); keepOpen ? ref.current.focus() : onClose() }
  return html`
    <div class="add-form">
      <input ref=${ref} value=${v} placeholder=${placeholder} onInput=${e => setV(e.target.value)}
        onKeyDown=${e => { if (isEnter(e)) { e.preventDefault(); submit() } else if (e.key === 'Escape') onClose() }}
        onBlur=${() => { if (!v.trim()) setTimeout(onClose, 120) }} />
      <div class="acts"><button class="btn" onMouseDown=${e => e.preventDefault()} onClick=${submit}>${button}</button><button class="btn ghost" onClick=${onClose}>キャンセル</button></div>

}

function useDnd(boardRef, act) {
  const [target, setTarget] = useState(null)   // card: { col, before } / { inbox: true }, col: { before }
  const targetRef = useRef(null)
  const setT = t => {
    if (JSON.stringify(t) === JSON.stringify(targetRef.current)) return
    targetRef.current = t; setTarget(t)
    document.body.classList.toggle('drop-inbox', !!t?.inbox)
  }
  const computeTarget = (x, y, d) => {
    if (!d) return
    const el = document.elementFromPoint(x, y)
    if (d.kind === 'card') {
      if (el?.closest('[data-drop="inbox"]')) return setT({ inbox: true })
      const colEl = el?.closest('.col[data-col]')
      if (!colEl) return setT(null)
      let before = null
      for (const c of colEl.querySelectorAll('.card[data-id]')) {
        if (c.dataset.id === d.id) continue
        const r = c.getBoundingClientRect()
        if (y < r.top + r.height / 2) { before = c.dataset.id; break }
      }
      setT({ col: colEl.dataset.col, before })
    } else {
      let before = null
      for (const c of boardRef.current.querySelectorAll('.col[data-col]')) {
        if (c.dataset.col === d.id) continue
        const r = c.getBoundingClientRect()
        if (x < r.left + r.width / 2) { before = c.dataset.col; break }
      }
      setT({ before })
    }
  }
  const pd = usePointerDrag({
    onMove: computeTarget,
    onDrop: d => {
      const t = targetRef.current
      if (!t) return
      if (d.kind === 'card') t.inbox ? act.move(d.id, null) : act.move(d.id, t.col, t.before, { silent: true })
      else act.reorderColumn(d.id, t.before)
    },
    onEnd: () => setT(null),
  })
  // 端に近づいたら自動スクロール
  useEffect(() => {
    if (!pd.drag) return
    const iv = setInterval(() => {
      const p = pd.posRef.current, b = boardRef.current; if (!p || !b) return
      const edge = 48, sp = 14
      if (p.x < edge) b.scrollLeft -= sp; else if (p.x > innerWidth - edge) b.scrollLeft += sp
      if (pd.drag.kind === 'card') {
        const body = document.elementFromPoint(p.x, p.y)?.closest('.col')?.querySelector('.col-body')
        if (body) { const r = body.getBoundingClientRect(); if (p.y < r.top + 36) body.scrollTop -= 10; else if (p.y > r.bottom - 36) body.scrollTop += 10 }
      }
      computeTarget(p.x, p.y, pd.drag)
    }, 30)
    return () => clearInterval(iv)
  }, [pd.drag])
  return { ...pd, target }
}

function Board({ items, columns, categories, act, openDetail, openCats }) {
  const [addingCol, setAddingCol] = useState(false)
  const [filter, setFilter] = useLS('tb_cat_filter', '')
  const boardRef = useRef()
  const dnd = useDnd(boardRef, act)
  const catById = useMemo(() => Object.fromEntries(categories.map(c => [c.id, c])), [categories])
  const activeFilter = filter && catById[filter] ? filter : ''
  const byCol = useMemo(() => {
    const m = {}
    for (const c of columns) m[c.id] = []
    for (const i of items) if (i.column_id && m[i.column_id]) m[i.column_id].push(i)
    for (const k in m) m[k].sort((a, b) => a.position - b.position)
    return m
  }, [items, columns])
  // 絞り込み中に追加したカードはそのカテゴリにする
  const addCard = async (text, colId) => { await act.addItem(text, colId, activeFilter ? { category_id: activeFilter } : {}) }
  // スクロールバーのすぐ上の小さな列一覧（今見ている列を強調、タップでその列へ）
  const [curCol, setCurCol] = useState(null)
  const colEls = () => [...(boardRef.current?.querySelectorAll('.col[data-col]') || [])]
  const syncCur = () => {
    const b = boardRef.current; if (!b) return
    const bl = b.getBoundingClientRect().left
    let best = null, bd = Infinity
    for (const el of colEls()) { const d = Math.abs(el.getBoundingClientRect().left - bl - 12); if (d < bd) { bd = d; best = el.dataset.col } }
    setCurCol(best)
  }
  useEffect(syncCur, [columns.length])
  const jumpTo = id => {
    const b = boardRef.current, el = colEls().find(e => e.dataset.col === id); if (!b || !el) return
    b.scrollTo({ left: b.scrollLeft + el.getBoundingClientRect().left - b.getBoundingClientRect().left - 12, behavior: 'smooth' })
  }
  const shown = c => { const all = byCol[c.id] || []; return activeFilter ? all.filter(x => x.category_id === activeFilter).length : all.length }
  // 表示サイズ（1=標準、2・3=縮小。スマホ縦では画面に 1/2/3 列が並ぶ）
  const [zoom, setZoom] = useLS('tb_board_zoom', 1)
  const z = [1, 2, 3].includes(+zoom) ? +zoom : 1
  const cycleZoom = () => { setZoom(z % 3 + 1); setTimeout(syncCur, 50) }
  return html`
    <div class=${'board-wrap z' + z}>
      <${Dock} cls="board-dock">
        <div class="catbar" role="toolbar" aria-label="カテゴリで絞り込み">
          <button class="chip zbtn" title="表示サイズを変える" aria-label=${`表示サイズ（いま ${z} 段階目）`} onClick=${cycleZoom}>${['', '🔍 大', '🔍 中', '🔍 小'][z]}</button>
          <button class=${'chip' + (!activeFilter ? ' on' : '')} onClick=${() => setFilter('')}>すべて</button>
          ${categories.map(c => html`<button key=${c.id} class=${'chip cchip' + (activeFilter === c.id ? ' on' : '')} style=${`--c:${c.color}`} onClick=${() => setFilter(activeFilter === c.id ? '' : c.id)}><i></i>${c.name}</button>`)}
          <button class="chip" onClick=${openCats} title="カテゴリの追加・色の変更">⚙ カテゴリ</button>
        </div>
      <//>
      <main ref=${boardRef} class=${'board' + (dnd.drag ? ' is-dragging' : '')} onScroll=${syncCur}>
        ${columns.map((c, i) => {
          const all = byCol[c.id] || []
          return html`<${Column} key=${c.id} col=${c} idx=${i} total=${columns.length} cards=${activeFilter ? all.filter(x => x.category_id === activeFilter) : all} allCount=${all.length}
            columns=${columns} catById=${catById} act=${act} openDetail=${openDetail} dnd=${dnd} addCat=${addCard} />`
        })}
        <section class=${'col add-col' + (dnd.drag?.kind === 'col' && dnd.target && !dnd.target.before ? ' col-drop-before' : '')}>
          ${addingCol
            ? html`<${AddForm} placeholder="列の名前…" button="列を追加" onAdd=${t => act.addColumn(t)} onClose=${() => setAddingCol(false)} />`
            : html`<button class="add-btn" onClick=${() => setAddingCol(true)}>＋ 列を追加</button>`}
        </section>
      </main>
      ${columns.length > 0 && html`
        <nav class="colnav" aria-label="列の一覧">${columns.map(c => html`
          <button key=${c.id} class=${curCol === c.id ? 'on' : ''} aria-current=${curCol === c.id ? 'true' : undefined} onClick=${() => jumpTo(c.id)}>${c.title}<b>${shown(c)}</b></button>`)}
        </nav>`}
    </div>
    <${DragGhost} pd=${dnd} />`
}

const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate())

const hms = ms => { const s = Math.floor(Math.max(0, ms) / 1000); return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}` }
const hm = ms => { const m = Math.round(Math.max(0, ms) / 60000); return `${Math.floor(m / 60)}:${pad(m % 60)}` }

const fmtDT = iso => { const d = new Date(iso); return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${clock(iso)}` }
