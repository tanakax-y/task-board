<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d2125" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TaskBoard">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>TaskBoard</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #fff; --panel2: #ebecf0; --hover: #f1f2f4; --border: #e1e4ea;
  --text: #172b4d; --muted: #6b778c; --accent: #0c66e4; --accent-weak: #e9f2ff;
  --danger: #c9372c; --done: #22a06b; --col: #ebecf0;
  --shadow: 0 1px 1px rgba(9,30,66,.2), 0 0 1px rgba(9,30,66,.25);
  --menu-shadow: 0 8px 24px rgba(9,30,66,.22);
  --top-h: 52px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1d2125; --panel: #22272b; --panel2: #2c333a; --hover: #2a3036; --border: #384048;
    --text: #dee4ea; --muted: #9fadbc; --accent: #579dff; --accent-weak: #1c2b41;
    --danger: #f87168; --done: #4bce97; --col: #161a1d;
    --shadow: 0 1px 1px rgba(0,0,0,.5); --menu-shadow: 0 8px 24px rgba(0,0,0,.55);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Meiryo", "Noto Sans JP", sans-serif;
  font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input { font: inherit; color: inherit; font-size: 16px; } /* 16px未満だとiPhoneで勝手にズームする */
.muted { color: var(--muted); }
.center { min-height: 100dvh; display: grid; place-items: center; }

/* ---- header ---- */
.top {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding: env(safe-area-inset-top) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
  height: calc(var(--top-h) + env(safe-area-inset-top));
  background: var(--panel); border-bottom: 1px solid var(--border);
}
.brand { font-weight: 800; letter-spacing: .3px; display: flex; align-items: center; gap: 8px; }
.brand img { width: 24px; height: 24px; }
.tabs { display: flex; gap: 4px; background: var(--panel2); padding: 3px; border-radius: 9px; margin: 0 auto; }
.tabs button { padding: 5px 14px; border-radius: 7px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.tabs button.on { background: var(--panel); color: var(--text); box-shadow: var(--shadow); }
.tabs button.drop { outline: 2px dashed var(--accent); }
.badge { font-size: 11px; background: var(--accent); color: #fff; border-radius: 10px; padding: 0 6px; min-width: 18px; text-align: center; line-height: 17px; }
.sync { width: 8px; height: 8px; border-radius: 50%; background: var(--done); flex: none; }
.sync.off { background: var(--danger); }

/* ---- common controls ---- */
.check { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: 50%; }
.check i {
  width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--muted);
  display: grid; place-items: center; transition: background .12s, border-color .12s;
}
.check:hover i { border-color: var(--done); }
.check.on i { background: var(--done); border-color: var(--done); }
.check svg { width: 11px; height: 11px; stroke: #fff; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.dots {
  width: 30px; height: 28px; flex: none; border-radius: 6px; color: var(--muted);
  font-size: 18px; line-height: 1; letter-spacing: -1px; display: grid; place-items: center;
}
.dots:hover, .dots[aria-expanded="true"] { background: var(--panel2); color: var(--text); }
.menu {
  position: fixed; z-index: 300; min-width: 210px; max-width: calc(100vw - 16px); max-height: 65vh; overflow: auto;
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: var(--menu-shadow); padding: 5px; animation: pop .1s ease-out;
}
@keyframes pop { from { opacity: 0; transform: scale(.97); } }
.mi { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mi:hover { background: var(--hover); }
.mi .ic { width: 18px; text-align: center; color: var(--muted); flex: none; }
.mi.danger, .mi.danger .ic { color: var(--danger); }
.msec { font-size: 11px; font-weight: 700; color: var(--muted); padding: 8px 10px 3px; }
.msep { height: 1px; background: var(--border); margin: 5px 0; }
.edit {
  flex: 1; min-width: 0; padding: 3px 6px; border: 2px solid var(--accent); border-radius: 6px;
  background: var(--panel); outline: none;
}
.chip { padding: 4px 11px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); border: 1px solid var(--border); background: var(--panel); white-space: nowrap; }
.chip.on { background: var(--accent-weak); color: var(--accent); border-color: transparent; }
.seg { display: inline-flex; background: var(--panel2); padding: 2px; border-radius: 8px; }
.seg button { padding: 4px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--panel); color: var(--text); box-shadow: var(--shadow); }
.btn { padding: 7px 14px; border-radius: 7px; font-weight: 600; background: var(--accent); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--panel2); color: var(--text); }

/* ---- inbox ---- */
.inbox { max-width: 760px; margin: 0 auto; padding: 14px max(12px, env(safe-area-inset-right)) calc(90px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
.composer {
  display: flex; align-items: center; gap: 6px; background: var(--panel);
  border: 1px solid var(--border); border-radius: 10px; padding: 5px 5px 5px 12px; box-shadow: var(--shadow);
}
.composer:focus-within { border-color: var(--accent); }
.composer input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; padding: 5px 0; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 12px 0 4px; }
.toolbar .chips { display: flex; gap: 6px; }
.search { flex: 1; min-width: 120px; display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 0 8px; }
.search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; padding: 4px 0; font-size: 16px; }
.ghead { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; font-weight: 700; color: var(--muted); margin: 16px 4px 6px; }
.list { list-style: none; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
.row { display: flex; align-items: center; gap: 6px; padding: 4px 4px 4px 6px; min-height: 40px; border-top: 1px solid var(--border); }
.row:first-child { border-top: 0; }
.row:hover { background: var(--hover); }
.list .row:first-child { border-radius: 10px 10px 0 0; } .list .row:last-child { border-radius: 0 0 10px 10px; } .list .row:only-child { border-radius: 10px; }
.text { flex: 1; min-width: 0; word-break: break-word; white-space: pre-wrap; padding: 2px 0; }
.done .text { text-decoration: line-through; color: var(--muted); }
.stamp { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.empty { text-align: center; color: var(--muted); padding: 34px 12px; font-size: 14px; }

/* calendar */
.inbox.calmode { max-width: 1100px; }
.calwrap { display: grid; gap: 14px; margin-top: 12px; }
@media (min-width: 900px) { .calwrap { grid-template-columns: 340px 1fr; align-items: start; } .cal { position: sticky; top: calc(var(--top-h) + 14px); } }
.cal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px; }
.cal-head { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; }
.cal-head strong { flex: 1; text-align: center; font-size: 15px; }
.icon { width: 32px; height: 32px; border-radius: 8px; font-size: 20px; color: var(--muted); }
.icon:hover { background: var(--panel2); color: var(--text); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-w { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); padding: 2px 0 4px; }
.cal-w.sun { color: #e5484d; } .cal-w.sat { color: #3e7bfa; }
.cal-d { aspect-ratio: 1 / 1; max-height: 52px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-variant-numeric: tabular-nums; }
.cal-d:hover { background: var(--hover); }
.cal-d .n { font-size: 14px; line-height: 1.1; }
.cal-d .cnt { font-size: 10px; line-height: 14px; min-width: 16px; height: 14px; padding: 0 4px; border-radius: 7px; background: var(--accent); color: #fff; font-weight: 700; }
.cal-d .cnt.alldone { background: var(--panel2); color: var(--muted); }
.cal-d .cnt.none { background: transparent; }
.cal-d.today .n { color: var(--accent); font-weight: 800; }
.cal-d.sel { background: var(--accent); }
.cal-d.sel .n { color: #fff; font-weight: 700; }
.cal-d.sel .cnt { background: #fff; color: var(--accent); }

/* ---- board ---- */
.board {
  display: flex; gap: 12px; align-items: flex-start; overflow-x: auto;
  padding: 12px max(12px, env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  height: calc(100dvh - var(--top-h) - env(safe-area-inset-top));
}
.col { flex: 0 0 284px; max-height: 100%; display: flex; flex-direction: column; background: var(--col); border-radius: 12px; }
.col-head { display: flex; align-items: center; gap: 6px; padding: 8px 6px 6px 12px; }
.col-head h3 { flex: 1; font-size: 14px; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: text; }
.col-head .count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.col-body { flex: 1 1 auto; overflow-y: auto; padding: 2px 8px 4px; display: flex; flex-direction: column; gap: 8px; min-height: 12px; }
.col-body.drop-end::after { content: ""; height: 3px; flex: none; background: var(--accent); border-radius: 2px; }
.col-foot { padding: 4px 8px 8px; }
.add-btn { width: 100%; text-align: left; padding: 7px 8px; border-radius: 8px; color: var(--muted); font-weight: 600; font-size: 14px; }
.add-btn:hover { background: var(--panel2); color: var(--text); }
.add-form input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 2px solid var(--accent); background: var(--panel); outline: none; }
.add-form .acts { display: flex; gap: 6px; margin-top: 6px; }
.card {
  display: flex; align-items: flex-start; gap: 4px; padding: 5px 2px 5px 4px;
  background: var(--panel); border-radius: 8px; box-shadow: var(--shadow); cursor: grab;
}
.card:hover { box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
.card.dragging { opacity: .4; }
.card.drop-before { box-shadow: 0 -4px 0 -1px var(--accent), var(--shadow); }
.card-main { flex: 1; min-width: 0; padding-top: 3px; display: flex; flex-direction: column; gap: 2px; }
.card-main .stamp { font-size: 11px; }
.add-col { background: transparent; border: 2px dashed var(--border); }
.add-col .add-btn { padding: 10px 12px; }
.add-col .add-form { padding: 8px; }
@media (max-width: 640px) {
  .board { scroll-snap-type: x mandatory; scroll-padding: 0 12px; gap: 10px; }
  .col { flex-basis: 86vw; scroll-snap-align: start; }
  .tabs button { padding: 5px 11px; }
  .brand span { display: none; }
}

/* ---- action log ---- */
.logv { max-width: 760px; margin: 0 auto; padding: 12px max(12px, env(safe-area-inset-right)) calc(90px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
.runic { font-size: 14px; line-height: 1; animation: blink 2s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; } }
.now {
  display: flex; align-items: center; gap: 14px; padding: 18px 16px; min-height: 104px;
  border-radius: 16px; background: var(--panel); border: 1px solid var(--border);
}
.now.on { background: var(--c); background: linear-gradient(135deg, var(--c), color-mix(in srgb, var(--c) 62%, #000)); color: #fff; border-color: transparent; }
.now-ic { font-size: 42px; line-height: 1; flex: none; }
.now-main { flex: 1; min-width: 0; }
.now-name { font-size: 14px; font-weight: 700; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.now-name small { opacity: .85; font-weight: 500; font-size: 12px; }
.now-time { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: .5px; line-height: 1.1; }
.stop { width: 54px; height: 54px; flex: none; border-radius: 50%; border: 3px solid #fff; color: #fff; display: grid; place-items: center; }
.stop i { width: 16px; height: 16px; border-radius: 3px; background: #fff; }
.stop:active { transform: scale(.94); }
.now-idle { width: 100%; text-align: center; color: var(--muted); }
.now-idle small { display: block; font-size: 12px; margin-top: 4px; }
.agrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(82px, 1fr)); gap: 8px; margin-top: 12px; }
.abtn {
  display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 12px 4px 9px; min-width: 0;
  background: var(--panel); border: 1px solid var(--border); border-bottom: 3px solid var(--c); border-radius: 12px;
  transition: transform .08s;
}
.abtn:hover { background: var(--hover); }
.abtn:active { transform: scale(.96); }
.abtn .aic { font-size: 28px; line-height: 1; }
.abtn .an { font-size: 13px; font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.abtn.on { background: var(--c); border-color: var(--c); color: #fff; }
.lrow { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 8px 12px; border-top: 1px solid var(--border); }
.lrow:first-child { border-top: 0; }
button.lrow:hover { background: var(--hover); }
.lic { width: 36px; height: 36px; flex: none; border-radius: 10px; display: grid; place-items: center; font-size: 20px; background: color-mix(in srgb, var(--c) 20%, transparent); }
.lmain { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.lmain b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lmain small { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.ldur { font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 600; white-space: nowrap; }
.lrow.live .ldur { color: var(--done); }
.rep-nav { display: flex; align-items: center; gap: 4px; margin: 2px 0 10px; }
.rep-nav strong { flex: 1; text-align: center; font-size: 16px; }
.rep-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
.rep-top { display: grid; gap: 14px; align-items: center; }
@media (min-width: 640px) { .rep-top { grid-template-columns: 220px 1fr; } }
.donut { width: 100%; max-width: 210px; margin: 0 auto; display: block; }
.donut .d-l { font-size: 12px; fill: var(--muted); }
.donut .d-v { font-size: 22px; font-weight: 800; fill: var(--text); }
.lg { display: grid; grid-template-columns: 26px 1fr auto; gap: 2px 8px; align-items: center; padding: 5px 0; }
.lg .nm { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lg .v { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); white-space: nowrap; }
.lg .v b { color: var(--text); font-size: 14px; }
.lg .bar { grid-column: 2 / 4; height: 6px; border-radius: 3px; background: var(--panel2); overflow: hidden; }
.lg .bar i { display: block; height: 100%; background: var(--c); border-radius: 3px; }
.rep-acts { display: flex; gap: 8px; margin: 12px 0 4px; }
.rep-acts .btn { flex: 1; }
.btn.sub { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
.btn.danger { background: transparent; color: var(--danger); }

/* daily */
.dhead { display: flex; align-items: center; gap: 4px; margin: 2px 0 10px; }
.ddate { display: flex; align-items: center; gap: 8px; padding: 0 4px; }
.dnum { font-size: 34px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.dsub { font-size: 12px; line-height: 1.3; color: var(--muted); font-weight: 600; }
.drow { gap: 8px; padding: 6px 6px 6px 10px; }
.dic { width: 30px; text-align: center; font-size: 22px; flex: none; }
.dmain { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.dmain small { font-size: 12px; color: var(--muted); }
.dval { width: 100%; border: 0; outline: none; background: transparent; padding: 1px 0; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); min-height: 30px; }
.dval::placeholder { color: var(--border); }
.dval:focus { color: var(--accent); }
.dval.k-text { font-size: 16px; font-weight: 500; }
.dval.k-time { max-width: 140px; }
.drow:not(.has) .dval.k-time:not(:focus) { color: var(--muted); }
.nowbtn { flex: none; }
.ricon { width: 34px; height: 34px; flex: none; border-radius: 50%; border: 1.5px solid var(--border); color: var(--accent); font-size: 15px; display: grid; place-items: center; }
.ricon:hover { background: var(--accent-weak); border-color: var(--accent); }
.lchart { width: 100%; display: block; }
.lchart .grid { stroke: var(--border); stroke-width: 1; }
.lchart .avg { stroke: var(--done); stroke-width: 1.2; stroke-dasharray: 4 4; }
.lchart .ln { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
.lchart .dot { fill: var(--accent); }
.lchart .ax { font-size: 10px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.stats b { color: var(--text); font-size: 14px; }
.list.hist .lrow { padding: 8px 12px; }

/* habit */
.hgrid { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 6px 8px; }
.hrow { display: grid; grid-template-columns: minmax(0, 1fr) repeat(7, 34px); gap: 3px; align-items: center; padding: 5px 0; border-top: 1px solid var(--border); }
.hrow.hhead { border-top: 0; padding: 2px 0 4px; }
.hd { text-align: center; font-size: 11px; color: var(--muted); font-weight: 700; line-height: 1.2; }
.hd b { display: block; font-size: 14px; color: var(--text); }
.hd.sun { color: #e5484d; } .hd.sat { color: #3e7bfa; }
.hd.today b { color: #fff; background: var(--accent); border-radius: 50%; width: 24px; height: 24px; line-height: 24px; margin: 1px auto 0; }
.hname { display: flex; align-items: center; gap: 6px; min-width: 0; text-align: left; padding: 2px 4px 2px 0; }
.hic { font-size: 20px; flex: none; }
.hn { display: flex; flex-direction: column; min-width: 0; }
.hn b { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hn small { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.hn small.ok { color: var(--done); font-weight: 700; }
.hcell { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--border); color: #fff; font-weight: 800; font-size: 15px; justify-self: center; transition: background .1s, border-color .1s; }
.hcell:hover:not(:disabled) { border-color: var(--done); }
.hcell.today { border-color: var(--accent); }
.hcell.on { background: var(--done); border-color: var(--done); }
.hcell:disabled { opacity: .3; cursor: default; }
.hcell:active:not(:disabled) { transform: scale(.9); }
@media (max-width: 520px) {
  /* スマホでは習慣名を1行使って表示し、その下に7日分のマスを並べる */
  .hrow { grid-template-columns: repeat(7, 1fr); row-gap: 4px; padding: 8px 0; }
  .hrow > .hname { grid-column: 1 / -1; }
  .hrow.hhead > span:first-child { display: none; }
  .hn { flex-direction: row; align-items: baseline; gap: 8px; }
  .hcell { width: 38px; height: 38px; }
}

/* modal */
.ovl { position: fixed; inset: 0; z-index: 150; background: rgba(9,30,66,.45); display: flex; align-items: center; justify-content: center; padding: 16px; animation: fade .12s; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: 100%; max-width: 440px; max-height: 90dvh; overflow: auto; background: var(--panel); border-radius: 14px; padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); box-shadow: var(--menu-shadow); }
@media (max-width: 640px) { .ovl { align-items: flex-end; padding: 0; } .sheet { max-width: none; border-radius: 16px 16px 0 0; } }
.sheet-head { display: flex; align-items: center; margin-bottom: 10px; }
.sheet-head h3 { flex: 1; font-size: 16px; }
.field select { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; font-size: 16px; }
.field .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
.icgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 4px; }
.icgrid button { font-size: 22px; height: 40px; border-radius: 8px; }
.icgrid button:hover { background: var(--hover); }
.icgrid button.on { background: var(--accent-weak); outline: 2px solid var(--accent); }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.swatches button { width: 30px; height: 30px; border-radius: 50%; background: var(--c); }
.swatches button.on { outline: 3px solid var(--text); outline-offset: 2px; }
.sheet .acts { display: flex; gap: 8px; margin-top: 16px; }
.sheet .acts .grow { flex: 1; }

/* ---- bottom navigation & docks (スマホでは操作を画面下に集める) ---- */
:root { --nav-h: 0px; --dock-h: 0px; }
.ptitle { display: none; }
.bnav { display: none; }
.dock .toolbar, .dock .rep-nav, .dock .dhead { margin: 0; }
.dock { margin-bottom: 12px; }
.inbox-dock { display: flex; flex-direction: column-reverse; gap: 12px; }
.inbox .search { margin-bottom: 4px; }
.rep-nav .seg { flex: none; }
.chip:disabled { opacity: .4; cursor: default; }
@media (max-width: 640px) {
  :root { --nav-h: 56px; }
  .top .tabs { display: none; }
  .ptitle { display: block; flex: 1; font-size: 16px; }
  .bnav {
    display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background: var(--panel); border-top: 1px solid var(--border);
  }
  .bnav button { flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10.5px; font-weight: 600; color: var(--muted); }
  .bnav .bi { font-size: 21px; line-height: 1; filter: grayscale(1); opacity: .65; }
  .bnav button.on { color: var(--accent); }
  .bnav button.on .bi, .bnav .bi.runic { filter: none; opacity: 1; }
  .bnav .badge { position: absolute; top: 4px; left: calc(50% + 6px); }
  .dock {
    position: fixed; left: 0; right: 0; z-index: 35; margin: 0;
    bottom: calc(var(--nav-h) + env(safe-area-inset-bottom));
    padding: 8px max(10px, env(safe-area-inset-right)) 8px max(10px, env(safe-area-inset-left));
    background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
  }
  .inbox-dock { flex-direction: column; gap: 8px; }
  .inbox-dock .toolbar { flex-wrap: nowrap; justify-content: space-between; gap: 6px; }
  .inbox-dock .chip { padding: 4px 9px; }
  .inbox, .logv { padding-top: 10px; padding-bottom: calc(var(--dock-h) + var(--nav-h) + env(safe-area-inset-bottom) + 20px); }
  .board { height: calc(100dvh - var(--top-h) - env(safe-area-inset-top) - var(--nav-h) - env(safe-area-inset-bottom)); }
  .toast { bottom: calc(var(--dock-h) + var(--nav-h) + env(safe-area-inset-bottom) + 10px); }
  .rep-nav strong { font-size: 15px; }
  /* 時間：今の記録＋アクションボタンを親指の届く範囲にコンパクトに */
  .rec-dock .now { min-height: 0; padding: 9px 12px; gap: 10px; border-radius: 12px; }
  .rec-dock .now-ic { font-size: 28px; }
  .rec-dock .now-time { font-size: 26px; }
  .rec-dock .now-name { font-size: 13px; }
  .rec-dock .stop { width: 44px; height: 44px; }
  .rec-dock .now-idle { font-size: 13px; padding: 6px 0; }
  .rec-dock .now-idle small { display: none; }
  .rec-dock .agrid { grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; max-height: 148px; overflow-y: auto; }
  .rec-dock .abtn { padding: 8px 2px 6px; gap: 3px; }
  .rec-dock .abtn .aic { font-size: 22px; }
  .rec-dock .abtn .an { font-size: 11.5px; }
  .dhead .dnum { font-size: 28px; }
}

/* ---- toast ---- */
.toast {
  position: fixed; z-index: 200; left: 50%; translate: -50% 0;
  bottom: calc(18px + env(safe-area-inset-bottom));
  display: flex; align-items: center; gap: 14px; max-width: calc(100vw - 24px);
  background: #172b4d; color: #fff; padding: 9px 10px 9px 16px; border-radius: 10px;
  box-shadow: var(--menu-shadow); font-size: 14px; animation: pop .15s ease-out;
}
.toast button { color: #85b8ff; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
.toast button:hover { background: rgba(255,255,255,.1); }

/* ---- auth ---- */
.auth { min-height: 100dvh; display: grid; place-items: center; padding: 20px; }
.auth-card { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 26px 22px; box-shadow: var(--shadow); }
.auth-card h1 { font-size: 22px; display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 6px; }
.auth-card h1 img { width: 30px; }
.auth-card p { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 18px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
.field input { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); outline: none; }
.field input:focus { border-color: var(--accent); }
.auth .btn { width: 100%; padding: 10px; }
.msg { font-size: 13px; margin-top: 10px; text-align: center; }
.msg.err { color: var(--danger); }
.link { display: block; margin: 14px auto 0; color: var(--accent); font-size: 13px; }
</style>
</head>
<body>
<div id="app"><div class="center muted">読み込み中…</div></div>
<script type="module">
import { html, render, useState, useEffect, useRef, useCallback, useMemo } from 'https://unpkg.com/htm@3.1.1/preact/standalone.module.js'
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.49.4'

// LifeOS / 7つの習慣 と同じ Supabase プロジェクト・同じアカウントを使う（テーブルは tb_ プレフィックス）
const sb = createClient('https://aowozgaddvxfrmxvhdms.supabase.co', 'sb_publishable_UoEj1KjRpaoCH1f__MplAw_Yd6NOY0L')
const DEFAULT_COLUMNS = ['未着手', '進行中', '完了']

/* ================= utils ================= */
const uuid = () => (globalThis.crypto?.randomUUID ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16) }))
const pad = n => String(n).padStart(2, '0')
const WD = '日月火水木金土'
const dayKey = d => { const x = typeof d === 'string' ? new Date(d) : d; return `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}` }
const todayKey = () => dayKey(new Date())
const keyToDate = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d) }
function fmtStamp(iso) {
  const d = new Date(iso), t = `${pad(d.getHours())}:${pad(d.getMinutes())}`, md = `${d.getMonth() + 1}/${d.getDate()}`
  return d.getFullYear() !== new Date().getFullYear() ? `${d.getFullYear()}/${md} ${t}` : `${md} ${t}`
}
const fmtFull = iso => { const d = new Date(iso); return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]}) ${pad(d.getHours())}:${pad(d.getMinutes())} 作成` }
function dayLabel(k) {
  const y = new Date(); y.setDate(y.getDate() - 1)
  const d = keyToDate(k), base = `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`
  if (k === todayKey()) return `今日 ${base}`
  if (k === dayKey(y)) return `昨日 ${base}`
  return d.getFullYear() !== new Date().getFullYear() ? `${d.getFullYear()}/${base}` : base
}
const isEnter = e => e.key === 'Enter' && !e.isComposing && e.keyCode !== 229   // 日本語変換の確定Enterは無視
const byCreatedDesc = (a, b) => (a.created_at < b.created_at ? 1 : -1)
function useLS(key, init) {
  const [v, setV] = useState(() => localStorage.getItem(key) ?? init)
  return [v, x => { localStorage.setItem(key, x); setV(x) }]
}

/* ================= data ================= */
function useBoard(userId, notify) {
  const [items, setItems] = useState([])
  const [columns, setColumns] = useState([])
  const [loading, setLoading] = useState(true)
  const [online, setOnline] = useState(true)
  const itemsRef = useRef(items); itemsRef.current = items
  const colsRef = useRef(columns); colsRef.current = columns
  const notifyRef = useRef(notify); notifyRef.current = notify

  const load = useCallback(async () => {
    const [ir, cr] = await Promise.all([
      sb.from('tb_items').select('*').order('created_at', { ascending: false }).limit(5000),
      sb.from('tb_columns').select('*').order('position'),
    ])
    if (ir.error || cr.error) { setOnline(false); setLoading(false); notifyRef.current('読み込みに失敗しました: ' + (ir.error || cr.error).message); return }
    let cols = cr.data
    const seedKey = 'tb_seeded_' + userId
    if (cols.length === 0 && !localStorage.getItem(seedKey)) {
      localStorage.setItem(seedKey, '1')
      const { data } = await sb.from('tb_columns').insert(DEFAULT_COLUMNS.map((title, i) => ({ id: uuid(), title, position: i, user_id: userId }))).select()
      cols = data || []
    }
    setItems(ir.data); setColumns(cols); setOnline(true); setLoading(false)
  }, [userId])

  useEffect(() => {
    load()
    let t
    const soon = () => { clearTimeout(t); t = setTimeout(load, 600) }
    // 他の端末での変更をリアルタイムに反映
    const ch = sb.channel('tb-sync-' + userId)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'tb_items' }, soon)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'tb_columns' }, soon)
      .subscribe()
    const onVis = () => document.visibilityState === 'visible' && load()
    document.addEventListener('visibilitychange', onVis)
    window.addEventListener('online', load)
    return () => { clearTimeout(t); sb.removeChannel(ch); document.removeEventListener('visibilitychange', onVis); window.removeEventListener('online', load) }
  }, [load])

  const act = useMemo(() => {
    const now = () => new Date().toISOString()
    const fail = error => { if (error) { notifyRef.current('保存に失敗しました: ' + error.message); setOnline(false); load() } return !!error }
    const nextPos = colId => { const ps = itemsRef.current.filter(i => i.column_id === colId).map(i => i.position); return ps.length ? Math.max(...ps) + 1 : 0 }
    const colName = id => colsRef.current.find(c => c.id === id)?.title ?? ''

    const a = {
      async addItem(content, columnId = null) {
        const it = { id: uuid(), content, done: false, done_at: null, column_id: columnId, position: columnId ? nextPos(columnId) : 0, created_at: now() }
        setItems(p => [it, ...p])
        const { error } = await sb.from('tb_items').insert({ ...it, user_id: userId }); fail(error)
      },
      async update(id, patch) {
        setItems(p => p.map(i => (i.id === id ? { ...i, ...patch } : i)))
        const { error } = await sb.from('tb_items').update({ ...patch, updated_at: now() }).eq('id', id); return !fail(error)
      },
      toggle: item => a.update(item.id, item.done ? { done: false, done_at: null } : { done: true, done_at: now() }),
      async remove(item) {
        setItems(p => p.filter(i => i.id !== item.id))
        const { error } = await sb.from('tb_items').delete().eq('id', item.id)
        if (fail(error)) return
        notifyRef.current('削除しました', async () => {
          const back = { ...item, column_id: colsRef.current.some(c => c.id === item.column_id) ? item.column_id : null }
          setItems(p => [back, ...p].sort(byCreatedDesc))
          const { error } = await sb.from('tb_items').insert({ ...back, user_id: userId }); fail(error)
        })
      },
      // columnId=null で Inbox に戻す。beforeId を渡すとそのカードの直前に入れる
      async move(id, columnId, beforeId = null, { silent = false } = {}) {
        const it = itemsRef.current.find(i => i.id === id)
        if (!it || beforeId === id) return
        let position = 0
        if (columnId) {
          const list = itemsRef.current.filter(i => i.column_id === columnId && i.id !== id).sort((x, y) => x.position - y.position)
          const idx = beforeId ? list.findIndex(i => i.id === beforeId) : -1
          if (idx === -1) position = list.length ? list[list.length - 1].position + 1 : 0
          else position = idx === 0 ? list[0].position - 1 : (list[idx - 1].position + list[idx].position) / 2
        }
        const prev = { column_id: it.column_id, position: it.position }
        const ok = await a.update(id, { column_id: columnId, position })
        if (ok && !silent && prev.column_id !== columnId) {
          notifyRef.current(columnId ? `「${colName(columnId)}」へ移動しました` : 'Inboxに戻しました', () => a.update(id, prev))
        }
      },
      async addColumn(title) {
        const c = { id: uuid(), title, position: colsRef.current.length ? Math.max(...colsRef.current.map(c => c.position)) + 1 : 0, created_at: now() }
        setColumns(p => [...p, c])
        const { error } = await sb.from('tb_columns').insert({ ...c, user_id: userId }); fail(error)
      },
      async renameColumn(id, title) {
        setColumns(p => p.map(c => (c.id === id ? { ...c, title } : c)))
        const { error } = await sb.from('tb_columns').update({ title }).eq('id', id); fail(error)
      },
      async shiftColumn(id, dir) {
        const cols = [...colsRef.current], i = cols.findIndex(c => c.id === id), j = i + dir
        if (i < 0 || j < 0 || j >= cols.length) return
        const A = cols[i], B = cols[j]
        let pa = B.position, pb = A.position
        if (pa === pb) { pa = j; pb = i }
        setColumns(p => p.map(c => (c.id === A.id ? { ...c, position: pa } : c.id === B.id ? { ...c, position: pb } : c)).sort((x, y) => x.position - y.position))
        const r = await Promise.all([sb.from('tb_columns').update({ position: pa }).eq('id', A.id), sb.from('tb_columns').update({ position: pb }).eq('id', B.id)])
        fail(r[0].error || r[1].error)
      },
      async removeColumn(col) {
        // 列を消しても中のカードは消さずに Inbox へ戻す（DB側も on delete set null）
        setItems(p => p.map(i => (i.column_id === col.id ? { ...i, column_id: null } : i)))
        setColumns(p => p.filter(c => c.id !== col.id))
        const r1 = await sb.from('tb_items').update({ column_id: null }).eq('column_id', col.id)
        if (fail(r1.error)) return
        const { error } = await sb.from('tb_columns').delete().eq('id', col.id); fail(error)
      },
    }
    return a
  }, [userId, load])

  return { items, columns, loading, online, act, reload: load }
}

/* ================= small components ================= */
function DotMenu({ render, label = 'メニュー' }) {
  const [pos, setPos] = useState(null)
  const btn = useRef(), menu = useRef()
  const close = () => setPos(null)
  useEffect(() => {
    if (!pos) return
    const down = e => { if (!menu.current?.contains(e.target) && !btn.current?.contains(e.target)) close() }
    const key = e => e.key === 'Escape' && close()
    const scroll = e => { if (!menu.current?.contains(e.target)) close() }
    document.addEventListener('pointerdown', down)
    document.addEventListener('keydown', key)
    window.addEventListener('scroll', scroll, true)
    window.addEventListener('resize', close)
    return () => {
      document.removeEventListener('pointerdown', down); document.removeEventListener('keydown', key)
      window.removeEventListener('scroll', scroll, true); window.removeEventListener('resize', close)
    }
  }, [pos])
  const toggle = e => {
    e.stopPropagation()
    if (pos) return close()
    const r = btn.current.getBoundingClientRect()
    const right = Math.max(8, innerWidth - r.right)
    setPos(r.bottom < innerHeight * 0.6 ? { top: r.bottom + 4, right } : { bottom: innerHeight - r.top + 4, right })
  }
  return html`
    <button ref=${btn} class="dots" aria-label=${label} aria-haspopup="menu" aria-expanded=${pos ? 'true' : 'false'} onClick=${toggle} draggable=${false}>•••</button>
    ${pos && html`<div ref=${menu} class="menu" role="menu" style=${pos} onClick=${e => e.stopPropagation()}>${render(close)}</div>`}`
}

const Check = ({ done, onToggle }) => html`
  <button class=${'check' + (done ? ' on' : '')} role="checkbox" aria-checked=${done ? 'true' : 'false'}
    title=${done ? 'クリックで未済に戻す' : 'クリックで処理済にする'} onClick=${e => { e.stopPropagation(); onToggle() }}>
    <i>${done && html`<svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7" /></svg>`}</i>
  </button>`

function EditInput({ value, onSave, onCancel }) {
  const [v, setV] = useState(value)
  const ref = useRef(), finished = useRef(false)
  useEffect(() => { ref.current.focus(); ref.current.select() }, [])
  const save = () => { if (finished.current) return; finished.current = true; const t = v.trim(); t && t !== value ? onSave(t) : onCancel() }
  return html`<input ref=${ref} class="edit" value=${v} onInput=${e => setV(e.target.value)} onBlur=${save}
    onKeyDown=${e => { if (isEnter(e)) { e.preventDefault(); save() } else if (e.key === 'Escape') { finished.current = true; onCancel() } }} />`
}

const MI = ({ icon, label, onClick, danger }) => html`
  <button class=${'mi' + (danger ? ' danger' : '')} role="menuitem" onClick=${onClick}><span class="ic">${icon}</span>${label}</button>`

/* ================= inbox ================= */
function InboxRow({ item, columns, act, editing, setEditing }) {
  return html`
    <li class=${'row' + (item.done ? ' done' : '')}>
      <${Check} done=${item.done} onToggle=${() => act.toggle(item)} />
      ${editing
        ? html`<${EditInput} value=${item.content} onSave=${t => { act.update(item.id, { content: t }); setEditing(null) }} onCancel=${() => setEditing(null)} />`
        : html`<span class="text" onDblClick=${() => setEditing(item.id)}>${item.content}</span>`}
      <time class="stamp" datetime=${item.created_at} title=${fmtFull(item.created_at)}>${fmtStamp(item.created_at)}</time>
      <${DotMenu} render=${close => html`
        <${MI} icon="✎" label="編集" onClick=${() => { close(); setEditing(item.id) }} />
        <${MI} icon=${item.done ? '↺' : '✓'} label=${item.done ? '未済に戻す' : '処理済にする'} onClick=${() => { close(); act.toggle(item) }} />
        <div class="msec">ボード（カンバン）へ移動</div>
        ${columns.length === 0 && html`<div class="msec" style="font-weight:400">列がありません</div>`}
        ${columns.map(c => html`<${MI} key=${c.id} icon="→" label=${c.title} onClick=${() => { close(); act.move(item.id, c.id) }} />`)}
        <div class="msep"></div>
        <${MI} icon="🗑" label="削除" danger onClick=${() => { close(); act.remove(item) }} />`} />
    </li>`
}

function Calendar({ month, setMonth, counts, day, setDay }) {
  const y = month.getFullYear(), m = month.getMonth()
  const lead = new Date(y, m, 1).getDay(), n = new Date(y, m + 1, 0).getDate(), tk = todayKey()
  const cells = [...Array(lead).fill(0), ...Array.from({ length: n }, (_, i) => i + 1)]
  const goToday = () => { const d = new Date(); setMonth(new Date(d.getFullYear(), d.getMonth(), 1)); setDay(tk) }
  return html`
    <div class="cal">
      <div class="cal-head">
        <button class="icon" aria-label="前の月" onClick=${() => setMonth(new Date(y, m - 1, 1))}>‹</button>
        <strong>${y}年${m + 1}月</strong>
        <button class="icon" aria-label="次の月" onClick=${() => setMonth(new Date(y, m + 1, 1))}>›</button>
        <button class="chip" onClick=${goToday}>今日</button>
      </div>
      <div class="cal-grid">
        ${[...WD].map((w, i) => html`<div class=${'cal-w' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '')}>${w}</div>`)}
        ${cells.map((d, i) => {
          if (!d) return html`<div key=${'b' + i}></div>`
          const k = `${y}-${pad(m + 1)}-${pad(d)}`, c = counts[k]
          return html`<button key=${k} class=${'cal-d' + (k === day ? ' sel' : '') + (k === tk ? ' today' : '')} onClick=${() => setDay(k)}
              title=${c ? `${c.total}件（未済 ${c.open}）` : ''}>
            <span class="n">${d}</span>
            <span class=${'cnt' + (!c ? ' none' : c.open === 0 ? ' alldone' : '')}>${c ? (c.open || c.total) : ''}</span>
          </button>`
        })}
      </div>
    </div>`
}

function Inbox({ items, columns, act }) {
  const [text, setText] = useState('')
  const [view, setView] = useLS('tb_view', 'list')
  const [status, setStatus] = useLS('tb_status', 'all')
  const [q, setQ] = useState('')
  const [day, setDay] = useState(todayKey)
  const [month, setMonth] = useState(() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1) })
  const [editing, setEditing] = useState(null)
  const inputRef = useRef()

  const add = () => {
    const t = text.trim(); if (!t) return
    act.addItem(t); setText('')
    if (view === 'calendar') { const d = new Date(); setDay(todayKey()); setMonth(new Date(d.getFullYear(), d.getMonth(), 1)) }
    inputRef.current?.focus()
  }

  const base = useMemo(() => {
    const ql = q.trim().toLowerCase()
    return items.filter(i => (status === 'all' || (status === 'open' ? !i.done : i.done)) && (!ql || i.content.toLowerCase().includes(ql)))
  }, [items, status, q])
  const counts = useMemo(() => {
    const m = {}
    for (const i of items) { const k = dayKey(i.created_at); (m[k] ||= { total: 0, open: 0 }).total++; if (!i.done) m[k].open++ }
    return m
  }, [items])
  const groups = useMemo(() => {
    const out = []; let cur = null
    for (const i of base) { const k = dayKey(i.created_at); if (!cur || cur.k !== k) out.push(cur = { k, list: [] }); cur.list.push(i) }
    return out
  }, [base])
  const dayList = useMemo(() => base.filter(i => dayKey(i.created_at) === day), [base, day])

  const rows = list => html`<ul class="list">${list.map(i => html`<${InboxRow} key=${i.id} item=${i} columns=${columns} act=${act} editing=${editing === i.id} setEditing=${setEditing} />`)}</ul>`
  const openCount = items.filter(i => !i.done).length

  return html`
    <main class=${'inbox' + (view === 'calendar' ? ' calmode' : '')}>
      <${Dock} cls="inbox-dock">
        <div class="toolbar">
          <div class="seg" role="tablist">
            <button class=${view === 'list' ? 'on' : ''} onClick=${() => setView('list')}>☰ 一覧</button>
            <button class=${view === 'calendar' ? 'on' : ''} onClick=${() => setView('calendar')}>▦ カレンダー</button>
          </div>
          <div class="chips">
            ${[['all', 'すべて'], ['open', '未済'], ['done', '処理済']].map(([k, l]) => html`<button class=${'chip' + (status === k ? ' on' : '')} onClick=${() => setStatus(k)}>${l}</button>`)}
          </div>
        </div>
        <div class="composer">
          <input ref=${inputRef} value=${text} placeholder="思いついたことを入力…" enterkeyhint="done" aria-label="新しいメモ・タスク"
            onInput=${e => setText(e.target.value)} onKeyDown=${e => { if (isEnter(e)) { e.preventDefault(); add() } }} />
          <button class="btn" disabled=${!text.trim()} onClick=${add}>追加</button>
        </div>
      <//>
      <label class="search"><span class="muted">⌕</span><input type="search" placeholder="検索" value=${q} onInput=${e => setQ(e.target.value)} /></label>

      ${view === 'list' ? html`
        ${groups.length === 0 && html`<div class="empty">${items.length ? '条件に合うものはありません' : 'まだ何もありません。入力欄に思いついたことを書いてみましょう。'}</div>`}
        ${groups.map(g => html`<section key=${g.k}><div class="ghead"><span>${dayLabel(g.k)}</span><span>${g.list.length}件</span></div>${rows(g.list)}</section>`)}
        ${items.length > 0 && html`<div class="ghead" style="justify-content:center;margin-top:20px"><span>Inbox 未済 ${openCount} 件</span></div>`}
      ` : html`
        <div class="calwrap">
          <${Calendar} month=${month} setMonth=${setMonth} counts=${counts} day=${day} setDay=${setDay} />
          <section>
            <div class="ghead" style="margin-top:0"><span>${dayLabel(day)}</span><span>${dayList.length}件</span></div>
            ${dayList.length ? rows(dayList) : html`<div class="empty list">この日の項目はありません</div>`}
          </section>
        </div>`}
    </main>`
}

function Card({ item, col, columns, act, drag, setDrag, over, setOver }) {
  const [editing, setEditing] = useState(false)
  const cls = 'card' + (item.done ? ' done' : '') + (drag === item.id ? ' dragging' : '') + (over && over.before === item.id && drag !== item.id ? ' drop-before' : '')
  return html`
    <div class=${cls} draggable=${!editing}
      onDragStart=${e => { e.dataTransfer.setData('text/plain', item.id); e.dataTransfer.effectAllowed = 'move'; setDrag(item.id) }}
      onDragEnd=${() => { setDrag(null); setOver(null) }}
      onDragOver=${e => { if (!drag) return; e.preventDefault(); e.stopPropagation(); if (!over || over.before !== item.id) setOver({ col: col.id, before: item.id }) }}
      onDrop=${e => { e.preventDefault(); e.stopPropagation(); const id = e.dataTransfer.getData('text/plain') || drag; setDrag(null); setOver(null); id && act.move(id, col.id, item.id, { silent: true }) }}>
      <${Check} done=${item.done} onToggle=${() => act.toggle(item)} />
      <div class="card-main">
        ${editing
          ? html`<${EditInput} value=${item.content} onSave=${t => { act.update(item.id, { content: t }); setEditing(false) }} onCancel=${() => setEditing(false)} />`
          : html`<div class="text" onDblClick=${() => setEditing(true)}>${item.content}</div>`}
        <time class="stamp" datetime=${item.created_at} title=${fmtFull(item.created_at)}>${fmtStamp(item.created_at)}</time>
      </div>
      <${DotMenu} render=${close => html`
        <${MI} icon="✎" label="編集" onClick=${() => { close(); setEditing(true) }} />
        <${MI} icon=${item.done ? '↺' : '✓'} label=${item.done ? '未済に戻す' : '処理済にする'} onClick=${() => { close(); act.toggle(item) }} />
        ${columns.length > 1 && html`<div class="msec">別の列へ移動</div>`}
        ${columns.filter(c => c.id !== col.id).map(c => html`<${MI} key=${c.id} icon="→" label=${c.title} onClick=${() => { close(); act.move(item.id, c.id) }} />`)}
        <div class="msep"></div>
        <${MI} icon="⤺" label="Inboxに戻す" onClick=${() => { close(); act.move(item.id, null) }} />
        <${MI} icon="🗑" label="削除" danger onClick=${() => { close(); act.remove(item) }} />`} />
    </div>`
}

function AddForm({ placeholder, button, onAdd, onClose, keepOpen }) {
  const [v, setV] = useState('')
  const ref = useRef()
  useEffect(() => ref.current.focus(), [])
  const submit = () => { const t = v.trim(); if (!t) return onClose(); onAdd(t); setV(''); keepOpen ? ref.current.focus() : onClose() }
  return html`
    <div class="add-form">
      <input ref=${ref} value=${v} placeholder=${placeholder} onInput=${e => setV(e.target.value)}
        onKeyDown=${e => { if (isEnter(e)) { e.preventDefault(); submit() } else if (e.key === 'Escape') onClose() }}
        onBlur=${() => { if (!v.trim()) setTimeout(onClose, 120) }} />
      <div class="acts"><button class="btn" onMouseDown=${e => e.preventDefault()} onClick=${submit}>${button}</button><button class="btn ghost" onClick=${onClose}>キャンセル</button></div>
    </div>`
}

function Column({ col, idx, total, cards, columns, act, drag, setDrag, over, setOver }) {
  const [adding, setAdding] = useState(false)
  const [renaming, setRenaming] = useState(false)
  const isOverEnd = over && over.col === col.id && !over.before
  return html`
    <section class="col" aria-label=${col.title}>
      <div class="col-head">
        ${renaming
          ? html`<${EditInput} value=${col.title} onSave=${t => { act.renameColumn(col.id, t); setRenaming(false) }} onCancel=${() => setRenaming(false)} />`
          : html`<h3 onDblClick=${() => setRenaming(true)} title="ダブルクリックで名前を変更">${col.title}</h3>`}
        <span class="count">${cards.filter(c => !c.done).length}/${cards.length}</span>
        <${DotMenu} label="列のメニュー" render=${close => html`
          <${MI} icon="✎" label="列の名前を変更" onClick=${() => { close(); setRenaming(true) }} />
          <${MI} icon="＋" label="カードを追加" onClick=${() => { close(); setAdding(true) }} />
          ${idx > 0 && html`<${MI} icon="←" label="左へ移動" onClick=${() => { close(); act.shiftColumn(col.id, -1) }} />`}
          ${idx < total - 1 && html`<${MI} icon="→" label="右へ移動" onClick=${() => { close(); act.shiftColumn(col.id, 1) }} />`}
          <div class="msep"></div>
          <${MI} icon="🗑" label="列を削除" danger onClick=${() => {
            close()
            if (confirm(`列「${col.title}」を削除しますか？${cards.length ? `\n中のカード ${cards.length} 件は Inbox に戻ります。` : ''}`)) act.removeColumn(col)
          }} />`} />
      </div>
      <div class=${'col-body' + (isOverEnd ? ' drop-end' : '')}
        onDragOver=${e => { if (!drag) return; e.preventDefault(); if (!isOverEnd) setOver({ col: col.id, before: null }) }}
        onDrop=${e => { e.preventDefault(); const id = e.dataTransfer.getData('text/plain') || drag; setDrag(null); setOver(null); id && act.move(id, col.id, null, { silent: true }) }}>
        ${cards.map(it => html`<${Card} key=${it.id} item=${it} col=${col} columns=${columns} act=${act} drag=${drag} setDrag=${setDrag} over=${over} setOver=${setOver} />`)}
      </div>
      <div class="col-foot">
        ${adding
          ? html`<${AddForm} placeholder="カードの内容…" button="追加" keepOpen onAdd=${t => act.addItem(t, col.id)} onClose=${() => setAdding(false)} />`
          : html`<button class="add-btn" onClick=${() => setAdding(true)}>＋ カードを追加</button>`}
      </div>
    </section>`
}

function Board({ items, columns, act, drag, setDrag }) {
  const [over, setOver] = useState(null)
  const [addingCol, setAddingCol] = useState(false)
  const byCol = useMemo(() => {
    const m = {}
    for (const c of columns) m[c.id] = []
    for (const i of items) if (i.column_id && m[i.column_id]) m[i.column_id].push(i)
    for (const k in m) m[k].sort((a, b) => a.position - b.position)
    return m
  }, [items, columns])
  return html`
    <main class="board" onDragLeave=${e => { if (!e.relatedTarget) setOver(null) }}>
      ${columns.map((c, i) => html`<${Column} key=${c.id} col=${c} idx=${i} total=${columns.length} cards=${byCol[c.id] || []} columns=${columns}
          act=${act} drag=${drag} setDrag=${setDrag} over=${over} setOver=${setOver} />`)}
      <section class="col add-col">
        ${addingCol
          ? html`<${AddForm} placeholder="列の名前…" button="列を追加" onAdd=${t => act.addColumn(t)} onClose=${() => setAddingCol(false)} />`
          : html`<button class="add-btn" onClick=${() => setAddingCol(true)}>＋ 列を追加</button>`}
      </section>
    </main>`
}

const hms = ms => { const s = Math.floor(Math.max(0, ms) / 1000); return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}` }
const hm = ms => { const m = Math.round(Math.max(0, ms) / 60000); return `${Math.floor(m / 60)}:${pad(m % 60)}` }

const md = iso => { const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()}` }
const toLocalInput = iso => { const d = new Date(iso); return `${dayKey(d)}T${clock(iso)}` }
const fmtDT = iso => { const d = new Date(iso); return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${clock(iso)}` }

const logRange = l => `${md(l.started_at)} ${clock(l.started_at)} - ${l.ended_at ? `${md(l.ended_at)} ${clock(l.ended_at)}` : '記録中'}`
const nextPos = list => (list.length ? Math.max(...list.map(x => x.position)) + 1 : 0)
const hmToMin = v => { const m = /^(\d{1,2}):(\d{2})/.exec(v || ''); return m ? +m[1] * 60 + +m[2] : null }
const minToHm = v => { const m = Math.round(v); return `${Math.floor(m / 60)}:${pad(((m % 60) + 60) % 60)}` }

function useNow(ms = 1000) {
  const [n, setN] = useState(Date.now())
  useEffect(() => { const t = setInterval(() => setN(Date.now()), ms); return () => clearInterval(t) }, [ms])
  return n
}
async function fetchAll(build) {
  const out = []
  for (let off = 0; ; off += 1000) {
    const { data, error } = await build().range(off, off + 999)
    if (error) throw error
    out.push(...data)
    if (data.length < 1000) return out
  }
}
// 期間 [from, to) に少しでも重なる記録を返す（日付をまたぐ睡眠なども両方の日に出す）
const fetchLogs = async (from, to) => {
  const rows = await fetchAll(() => sb.from('tb_logs').select('*').gte('started_at', addDays(from, -2).toISOString()).lt('started_at', to.toISOString()).order('started_at', { ascending: false }))
  return rows.filter(l => (l.ended_at ? Date.parse(l.ended_at) : Date.now()) > from.getTime())
}
// 期間内に収まる部分だけの長さ
const overlapMs = (l, from, to, now = Date.now()) => Math.max(0, Math.min(l.ended_at ? Date.parse(l.ended_at) : now, to.getTime()) - Math.max(Date.parse(l.started_at), from.getTime()))

function useLog(userId, notify) {
  const [actions, setActions] = useState([])
  const [items, setItems] = useState([])
  const [running, setRunning] = useState(null)
  const [counts, setCounts] = useState({})
  const [version, setVersion] = useState(0)
  const [ready, setReady] = useState(false)
  const runRef = useRef(running); runRef.current = running
  const actRef = useRef(actions); actRef.current = actions
  const itemsRef = useRef(items); itemsRef.current = items
  const notifyRef = useRef(notify); notifyRef.current = notify

  const load = useCallback(async () => {
    const [ar, rr, ir, cr] = await Promise.all([
      sb.from('tb_actions').select('*').order('position'),
      sb.from('tb_logs').select('*').is('ended_at', null).limit(1),
      sb.from('tb_daily_items').select('*').order('position'),
      sb.rpc('tb_action_counts'),
    ])
    const err = ar.error || rr.error || ir.error
    if (err) { notifyRef.current('ログの読み込みに失敗しました: ' + err.message); setReady(true); return }
    let acts = ar.data, its = ir.data
    const seed = async (table, key, rows, cur) => {
      if (cur.length || localStorage.getItem(key)) return cur
      localStorage.setItem(key, '1')
      const { data } = await sb.from(table).insert(rows).select()
      return data || []
    }
    acts = await seed('tb_actions', 'tb_actions_seeded_' + userId,
      DEFAULT_ACTIONS.map(([name, icon, color], i) => ({ id: uuid(), user_id: userId, name, icon, color, position: i })), acts)
    its = await seed('tb_daily_items', 'tb_daily_seeded_' + userId,
      DEFAULT_DAILY.map(([name, icon, kind, unit], i) => ({ id: uuid(), user_id: userId, name, icon, kind, unit: unit || '', position: i })), its)
    if (!its.some(i => i.kind === 'habit')) {
      const added = await seed('tb_daily_items', 'tb_habits_seeded_' + userId,
        DEFAULT_HABITS.map(([name, icon, target], i) => ({ id: uuid(), user_id: userId, name, icon, kind: 'habit', target, unit: '', position: 100 + i })), [])
      its = [...its, ...added]
    }
    const byPos = (a, b) => a.position - b.position
    setActions([...acts].sort(byPos)); setItems([...its].sort(byPos)); setRunning(rr.data[0] || null)
    if (!cr.error) setCounts(Object.fromEntries((cr.data || []).map(r => [r.action_id, Number(r.n)])))
    setVersion(v => v + 1); setReady(true)
  }, [userId])

  useEffect(() => {
    load()
    let t
    const soon = () => { clearTimeout(t); t = setTimeout(load, 600) }
    const ch = sb.channel('tb-log-' + userId)
    for (const table of ['tb_actions', 'tb_logs', 'tb_daily_items', 'tb_daily_values']) ch.on('postgres_changes', { event: '*', schema: 'public', table }, soon)
    ch.subscribe()
    const onVis = () => document.visibilityState === 'visible' && load()
    document.addEventListener('visibilitychange', onVis)
    return () => { clearTimeout(t); sb.removeChannel(ch); document.removeEventListener('visibilitychange', onVis) }
  }, [load])

  const act = useMemo(() => {
    const now = () => new Date().toISOString()
    const fail = e => { if (e) { notifyRef.current('保存に失敗しました: ' + e.message); load() } return !!e }
    const bump = () => setVersion(v => v + 1)
    const inc = (id, d) => setCounts(c => ({ ...c, [id]: Math.max(0, (c[id] || 0) + d) }))
    const swap = async (table, list, setList, id, dir) => {
      const i = list.findIndex(x => x.id === id), j = i + dir
      if (i < 0 || j < 0 || j >= list.length) return
      const A = list[i], B = list[j]
      let pa = B.position, pb = A.position
      if (pa === pb) { pa = j; pb = i }
      setList(p => p.map(x => (x.id === A.id ? { ...x, position: pa } : x.id === B.id ? { ...x, position: pb } : x)).sort((x, y) => x.position - y.position))
      const r = await Promise.all([sb.from(table).update({ position: pa }).eq('id', A.id), sb.from(table).update({ position: pb }).eq('id', B.id)])
      fail(r[0].error || r[1].error)
    }
    return {
      // アクションをタップ → 記録中のものを終了して新しく開始
      async start(action) {
        const cur = runRef.current
        if (cur && cur.action_id === action.id) return
        const t = now(), log = { id: uuid(), action_id: action.id, started_at: t, ended_at: null }
        setRunning(log); inc(action.id, 1)
        const r1 = await sb.from('tb_logs').update({ ended_at: t }).is('ended_at', null)
        if (fail(r1.error)) return
        const { error } = await sb.from('tb_logs').insert({ ...log, user_id: userId })
        if (!fail(error)) bump()
      },
      async stop() {
        if (!runRef.current) return
        setRunning(null)
        const { error } = await sb.from('tb_logs').update({ ended_at: now() }).is('ended_at', null)
        if (!fail(error)) bump()
      },
      async addLog(l) {
        const { error } = await sb.from('tb_logs').insert({ id: uuid(), ...l, user_id: userId })
        if (!fail(error)) { inc(l.action_id, 1); bump() }
      },
      async updateLog(id, patch) {
        const { error } = await sb.from('tb_logs').update(patch).eq('id', id)
        if (!fail(error)) load()
      },
      async deleteLog(l) {
        if (runRef.current?.id === l.id) setRunning(null)
        const { error } = await sb.from('tb_logs').delete().eq('id', l.id)
        if (fail(error)) return
        inc(l.action_id, -1); bump()
        notifyRef.current('記録を削除しました', async () => {
          const { error } = await sb.from('tb_logs').insert({ id: l.id, action_id: l.action_id, started_at: l.started_at, ended_at: l.ended_at, user_id: userId })
          if (!fail(error)) load()
        })
      },
      async addAction(v) {
        const row = { id: uuid(), position: nextPos(actRef.current), archived: false, created_at: now(), ...v }
        setActions(p => [...p, row])
        const { error } = await sb.from('tb_actions').insert({ ...row, user_id: userId }); fail(error)
      },
      async updateAction(id, patch) {
        setActions(p => p.map(x => (x.id === id ? { ...x, ...patch } : x)))
        const { error } = await sb.from('tb_actions').update(patch).eq('id', id); fail(error)
      },
      moveAction: (id, dir) => swap('tb_actions', actRef.current.filter(x => !x.archived), setActions, id, dir),
      async deleteAction(x) {
        setActions(p => p.filter(y => y.id !== x.id))
        if (runRef.current?.action_id === x.id) setRunning(null)
        const { error } = await sb.from('tb_actions').delete().eq('id', x.id)
        if (!fail(error)) load()
      },
      async addDaily(v) {
        const row = { id: uuid(), position: nextPos(itemsRef.current), hidden: false, created_at: now(), ...v }
        setItems(p => [...p, row])
        const { error } = await sb.from('tb_daily_items').insert({ ...row, user_id: userId }); fail(error)
      },
      async updateDaily(id, patch) {
        setItems(p => p.map(x => (x.id === id ? { ...x, ...patch } : x)))
        const { error } = await sb.from('tb_daily_items').update(patch).eq('id', id); fail(error)
      },
      moveDaily: (id, dir, habit) => swap('tb_daily_items', itemsRef.current.filter(x => (x.kind === 'habit') === !!habit), setItems, id, dir),
      async deleteDaily(x) {
        setItems(p => p.filter(y => y.id !== x.id))
        const { error } = await sb.from('tb_daily_items').delete().eq('id', x.id); if (!fail(error)) bump()
      },
      async setValue(itemId, day, value) {
        const { error } = value === ''
          ? await sb.from('tb_daily_values').delete().eq('item_id', itemId).eq('day', day)
          : await sb.from('tb_daily_values').upsert({ user_id: userId, item_id: itemId, day, value, updated_at: now() }, { onConflict: 'item_id,day' })
        if (!fail(error)) bump()
      },
    }
  }, [userId, load])

  return { actions, items, running, counts, version, ready, act }
}

function Modal({ title, onClose, children }) {
  useEffect(() => {
    const k = e => e.key === 'Escape' && onClose()
    document.addEventListener('keydown', k)
    return () => document.removeEventListener('keydown', k)
  }, [onClose])
  return html`
    <div class="ovl" onClick=${e => e.target === e.currentTarget && onClose()}>

function RecordView({ L, openLog, openActions }) {

  const now = useNow(1000)
  const ra = running && actions.find(a => a.id === running.action_id)
  const [today, setToday] = useState([])
  useEffect(() => {
    let alive = true
    const s = startOfDay(new Date())
    fetchLogs(s, addDays(s, 1)).then(d => alive && setToday(d)).catch(() => {})
    return () => { alive = false }
  }, [version])
  const byId = Object.fromEntries(actions.map(a => [a.id, a]))

          <div class="now-name">${ra?.name || '記録中'}

      : html`<div class="now-idle">記録中の行動はありません<small>アクションをタップすると記録が始まります（別のアクションをタップすると自動で切り替わります）</small></div>`}
    </section>
    <div class="agrid">
      ${actions.filter(a => !a.archived).map(a => html`
        <button key=${a.id} class=${'abtn' + (running?.action_id === a.id ? ' on' : '')} style=${`--c:${a.color}`} onClick=${() => act.start(a)}>

    <div class="ghead"><span>今日の記録</span><span class="chips"><button class="chip" onClick=${newLog}>＋ あとから記録</button><button class="chip" onClick=${openActions}>⚙ 編集</button></span></div>
    ${today.length ? html`<div class="list">${today.map(l => html`<${LogRow} key=${l.id} l=${l} a=${byId[l.action_id]} now=${now} onClick=${() => openLog(l)} />`)}</div>`
      : html`<div class="empty list">今日の記録はまだありません。付け忘れたときは「＋ あとから記録」で追加できます。</div>`}`

function Donut({ parts, total, center }) {
  const R = 70, C = 2 * Math.PI * R
  let acc = 0
  return html`
    <svg class="donut" viewBox="0 0 200 200" role="img" aria-label="内訳のグラフ">
      <circle cx="100" cy="100" r=${R} fill="none" stroke="var(--panel2)" stroke-width="34" />
      ${parts.map(p => {
        const len = total ? (p.ms / total) * C : 0
        const el = html`<circle cx="100" cy="100" r=${R} fill="none" stroke=${p.color} stroke-width="34"
          stroke-dasharray=${`${len} ${C - len}`} stroke-dashoffset=${-acc} transform="rotate(-90 100 100)" />`
        acc += len
        return el
      })}
      <text x="100" y="94" text-anchor="middle" class="d-l">${center[0]}</text>
      <text x="100" y="120" text-anchor="middle" class="d-v">${center[1]}</text>
    </svg>`
}

function ReportView({ L, openLog }) {
  const { actions, version } = L
  const [mode, setMode] = useLS('tb_rep_mode', 'day')
  const [anchor, setAnchor] = useState(() => startOfDay(new Date()))
  const [logs, setLogs] = useState(null)
  const now = useNow(30000)
  const { from, to, label } = useMemo(() => {
    const a = anchor
    if (mode === 'week') { const f = addDays(a, -((a.getDay() + 6) % 7)), t = addDays(f, 7), e = addDays(t, -1); return { from: f, to: t, label: `${f.getMonth() + 1}/${f.getDate()}(${WD[f.getDay()]}) 〜 ${e.getMonth() + 1}/${e.getDate()}(${WD[e.getDay()]})` } }
    if (mode === 'month') { const f = new Date(a.getFullYear(), a.getMonth(), 1); return { from: f, to: new Date(a.getFullYear(), a.getMonth() + 1, 1), label: `${f.getFullYear()}年${f.getMonth() + 1}月` } }
    return { from: a, to: addDays(a, 1), label: `${a.getFullYear() !== new Date().getFullYear() ? a.getFullYear() + '/' : ''}${a.getMonth() + 1}/${a.getDate()}(${WD[a.getDay()]})` }
  }, [mode, anchor])
  useEffect(() => {
    let alive = true
    setLogs(null)
    fetchLogs(from, to).then(d => alive && setLogs(d)).catch(() => alive && setLogs([]))
    return () => { alive = false }
  }, [from.getTime(), to.getTime(), version])
  const shift = dir => setAnchor(mode === 'day' ? addDays(anchor, dir) : mode === 'week' ? addDays(anchor, 7 * dir) : new Date(anchor.getFullYear(), anchor.getMonth() + dir, 1))

  const byId = Object.fromEntries(actions.map(a => [a.id, a]))
  const totals = {}
  for (const l of logs || []) totals[l.action_id] = (totals[l.action_id] || 0) + overlapMs(l, from, to, now)
  const parts = Object.entries(totals).map(([id, ms]) => ({ id, ms, a: byId[id], color: byId[id]?.color || UNTRACKED })).sort((x, y) => y.ms - x.ms)
  const tracked = parts.reduce((s, p) => s + p.ms, 0)
  // 「日」表示では、記録のない時間を「未記録」として見せる（付け忘れに気づけるように）
  const span = Math.min(to, Math.max(from, now)) - from
  const untracked = mode === 'day' ? Math.max(0, span - tracked) : 0
  const chartParts = untracked > 60000 ? [...parts, { id: '_none', ms: untracked, color: UNTRACKED }] : parts
  const chartTotal = tracked + (untracked > 60000 ? untracked : 0)

  const exportCsv = () => {
    const rows = [['日付', 'アクション', '開始', '終了', '時間(分)']]
    for (const l of [...(logs || [])].reverse()) rows.push([dayKey(l.started_at), byId[l.action_id]?.name ?? '', fmtDT(l.started_at), l.ended_at ? fmtDT(l.ended_at) : '記録中', Math.round(logMs(l) / 60000)])
    const csv = '﻿' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n')
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }))
    const el = document.createElement('a'); el.href = url; el.download = `行動ログ_${dayKey(from)}_${mode}.csv`; el.click()
    setTimeout(() => URL.revokeObjectURL(url), 2000)
  }
  const newLog = () => { const e = mode === 'day' && dayKey(anchor) !== todayKey() ? new Date(anchor.getTime() + 12 * 3600000) : new Date(); openLog({ started_at: new Date(e - 3600000).toISOString(), ended_at: e.toISOString() }) }

  return html`
    <${Dock}>
      <div class="rep-nav">
        <div class="seg">${[['day', '日'], ['week', '週'], ['month', '月']].map(([k, l]) => html`<button class=${mode === k ? 'on' : ''} onClick=${() => setMode(k)}>${l}</button>`)}</div>
        <button class="icon" aria-label="前へ" onClick=${() => shift(-1)}>‹</button>
        <strong>${label}</strong>
        <button class="icon" aria-label="次へ" onClick=${() => shift(1)}>›</button>
        <button class="chip" onClick=${() => setAnchor(startOfDay(new Date()))}>今日</button>
      </div>
    <//>
    <div class="rep-card">
      ${logs === null ? html`<div class="empty">読み込み中…</div>` : !parts.length ? html`<div class="empty">この期間の記録はありません</div>` : html`
        <div class="rep-top">
          <${Donut} parts=${chartParts} total=${chartTotal} center=${['記録 合計', hm(tracked)]} />
          <div>
            ${parts.map(p => html`
              <div class="lg" key=${p.id} style=${`--c:${p.color}`}>
                <span>${p.a?.icon || '？'}</span>
                <span class="nm">${p.a?.name || '（削除済み）'}</span>
                <span class="v"><b>${hm(p.ms)}</b>　${Math.round(p.ms / 60000)}分・${Math.round((p.ms / tracked) * 100)}%</span>
                <span class="bar"><i style=${`width:${(p.ms / parts[0].ms) * 100}%`}></i></span>
              </div>`)}
            ${untracked > 60000 && html`<div class="lg" style=${`--c:${UNTRACKED}`}><span>·</span><span class="nm muted">未記録</span><span class="v">${hm(untracked)}</span></div>`}
          </div>
        </div>`}
    </div>
    <div class="rep-acts">
      <button class="btn sub" onClick=${newLog}>＋ あとから記録</button>
      <button class="btn sub" disabled=${!logs?.length} onClick=${exportCsv}>⇩ CSV</button>
    </div>
    ${mode === 'day' && logs?.length > 0 && html`
      <div class="ghead"><span>行動履歴</span><span>${logs.length}件</span></div>
      <div class="list">${logs.map(l => html`<${LogRow} key=${l.id} l=${l} a=${byId[l.action_id]} now=${now} onClick=${() => openLog(l)} />`)}</div>`}`
}

function ActionsView({ L, openAction }) {

function LogModal({ L, entry, onClose }) {
  const isNew = !entry.id, live = !isNew && !entry.ended_at
  const choices = L.actions.filter(a => !a.archived || a.id === entry.action_id)
  const [actionId, setActionId] = useState(entry.action_id || choices[0]?.id || '')
  const [start, setStart] = useState(toLocalInput(entry.started_at))
  const [end, setEnd] = useState(entry.ended_at ? toLocalInput(entry.ended_at) : '')
  const [err, setErr] = useState('')
  const save = async () => {
    if (!actionId || !start) return setErr('アクションと開始時刻を入れてください')
    if (!live && !end) return setErr('終了時刻を入れてください')
    // 分単位の入力欄なので、変更していない時刻は元の値（秒まで）をそのまま使う
    const s = start === toLocalInput(entry.started_at) ? entry.started_at : new Date(start).toISOString()
    const e = !end ? null : entry.ended_at && end === toLocalInput(entry.ended_at) ? entry.ended_at : new Date(end).toISOString()
    if (e && Date.parse(e) < Date.parse(s)) return setErr('終了は開始より後にしてください')
    if (!e && Date.parse(s) > Date.now()) return setErr('開始時刻が未来になっています')
    isNew ? await L.act.addLog({ action_id: actionId, started_at: s, ended_at: e }) : await L.act.updateLog(entry.id, { action_id: actionId, started_at: s, ended_at: e })
    onClose()
  }
  return html`<${Modal} title=${isNew ? 'あとから記録' : live ? '記録中の行動を修正' : '記録を修正'} onClose=${onClose}>
    <div class="field"><label>アクション</label>
      <select value=${actionId} onChange=${e => setActionId(e.target.value)}>${choices.map(a => html`<option value=${a.id}>${a.icon} ${a.name}</option>`)}</select></div>
    <div class="field"><label>開始</label><input type="datetime-local" value=${start} onInput=${e => setStart(e.target.value)} /></div>
    <div class="field"><label>終了</label><input type="datetime-local" value=${end} onInput=${e => setEnd(e.target.value)} />
      ${live && html`<div class="hint">空欄のままなら記録中のまま。時刻を入れるとそこで終了します。</div>`}</div>
    ${err && html`<div class="msg err">${err}</div>`}
    <div class="acts">
      ${!isNew && html`<button class="btn danger" onClick=${() => { L.act.deleteLog(entry); onClose() }}>削除</button>`}
      <span class="grow"></span>
      <button class="btn ghost" onClick=${onClose}>キャンセル</button>
      <button class="btn" onClick=${save}>保存</button>
    </div>
  <//>`
}

function DailyRow({ it, value, isToday, onSave, onHist }) {
  const [draft, setDraft] = useState(value)
  const focused = useRef(false)
  useEffect(() => { if (!focused.current) setDraft(value) }, [value])
  const commit = v => { focused.current = false; const t = String(v).trim(); if (t !== value) onSave(t) }
  const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}` }
  const suffix = it.kind === 'time' ? '（h:m）' : it.unit ? `（${it.unit}）` : ''
  const field = it.kind === 'check'
    ? html`<div><${Check} done=${value === '1'} onToggle=${() => onSave(value === '1' ? '' : '1')} /></div>`
    : html`<input class=${'dval k-' + it.kind} type=${it.kind === 'time' ? 'time' : it.kind === 'number' ? 'number' : 'text'}
        inputmode=${it.kind === 'number' ? 'decimal' : undefined} step=${it.kind === 'number' ? 'any' : undefined}
        value=${draft} placeholder=${it.kind === 'time' ? '--:--' : it.kind === 'number' ? '–' : 'タップして入力'} aria-label=${it.name}
        onFocus=${() => { focused.current = true }} onInput=${e => setDraft(e.target.value)} onBlur=${e => commit(e.target.value)}
        onKeyDown=${e => { if (isEnter(e)) e.target.blur() }} />`
  return html`
    <li class=${'row drow' + (value ? ' has' : '')}>
      <span class="dic">${it.icon}</span>
      <div class="dmain"><small>${it.name}${suffix}</small>${field}</div>
      ${it.kind === 'time' && isToday && !value && html`<button class="chip nowbtn" title="今の時刻を記録" onClick=${() => onSave(nowHM())}>今</button>`}
      ${(it.kind === 'time' || it.kind === 'number') && html`<button class="ricon" title="グラフで推移を見る" aria-label=${it.name + 'のグラフ'} onClick=${() => onHist('chart')}>📈</button>`}
      <button class="ricon" title="過去の記録一覧" aria-label=${it.name + 'の履歴'} onClick=${() => onHist('list')}>☰</button>
    </li>`
}
