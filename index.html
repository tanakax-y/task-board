function LineChart({ rows, kind, span }) {
  const end = startOfDay(new Date()), start = addDays(end, -(span - 1))
  const pts = rows.map(r => ({ day: r.day, y: kind === 'time' ? hmToMin(r.value) : parseFloat(r.value) }))
    .filter(p => p.y != null && !isNaN(p.y) && keyToDate(p.day) >= start && keyToDate(p.day) <= end)
    .sort((a, b) => (a.day < b.day ? -1 : 1))
  if (!pts.length) return html`<div class="empty">この期間の記録はありません</div>`
  const W = 340, H = 190, P = { l: 42, r: 10, t: 12, b: 24 }
  let lo = Math.min(...pts.map(p => p.y)), hi = Math.max(...pts.map(p => p.y))
  if (lo === hi) { const d = kind === 'time' ? 30 : 1; lo -= d; hi += d }
  const m = (hi - lo) * 0.12; lo -= m; hi += m
  const x = day => P.l + ((keyToDate(day) - start) / 86400000 / Math.max(1, span - 1)) * (W - P.l - P.r)
  const y = v => P.t + (1 - (v - lo) / (hi - lo)) * (H - P.t - P.b)
  const fmt = v => (kind === 'time' ? minToHm(v) : String(Math.round(v * 10) / 10))
  const avg = pts.reduce((s, p) => s + p.y, 0) / pts.length
  const ticks = [0, 1, 2, 3].map(i => lo + ((hi - lo) * i) / 3)
  return html`
    <svg class="lchart" viewBox=${`0 0 ${W} ${H}`} role="img" aria-label="推移グラフ">
      ${ticks.map(t => html`<line x1=${P.l} x2=${W - P.r} y1=${y(t)} y2=${y(t)} class="grid" /><text x=${P.l - 6} y=${y(t) + 4} text-anchor="end" class="ax">${fmt(t)}</text>`)}
      <line x1=${P.l} x2=${W - P.r} y1=${y(avg)} y2=${y(avg)} class="avg" />
      <polyline points=${pts.map(p => `${x(p.day)},${y(p.y)}`).join(' ')} class="ln" />
      ${pts.map(p => html`<circle cx=${x(p.day)} cy=${y(p.y)} r=${span > 120 ? 2 : 3.5} class="dot"><title>${dayLabel(p.day)} ${fmt(p.y)}</title></circle>`)}
      <text x=${P.l} y=${H - 6} class="ax">${start.getMonth() + 1}/${start.getDate()}</text>
      <text x=${W - P.r} y=${H - 6} text-anchor="end" class="ax">${end.getMonth() + 1}/${end.getDate()}</text>
    </svg>
    <div class="stats"><span>平均 <b>${fmt(avg)}</b></span><span>最早/最小 <b>${fmt(Math.min(...pts.map(p => p.y)))}</b></span><span>最遅/最大 <b>${fmt(Math.max(...pts.map(p => p.y)))}</b></span><span>${pts.length}日分</span></div>`
}

function HistoryModal({ L, item, mode: initMode, onClose }) {
  const chartable = item.kind === 'time' || item.kind === 'number'
  const [mode, setMode] = useState(chartable ? initMode : 'list')
  const [span, setSpan] = useLS('tb_hist_span', '30')
  const [rows, setRows] = useState(null)
  useEffect(() => {
    let alive = true
    fetchAll(() => sb.from('tb_daily_values').select('day,value').eq('item_id', item.id).order('day', { ascending: false }))
      .then(d => alive && setRows(d)).catch(() => alive && setRows([]))
    return () => { alive = false }
  }, [item.id, L.version])
  const show = v => (item.kind === 'check' || item.kind === 'habit' ? '✓' : item.kind === 'number' && item.unit ? `${v} ${item.unit}` : v)
  return html`<${Modal} title=${`${item.icon} ${item.name}`} onClose=${onClose}>
    ${chartable && html`<div class="toolbar" style="margin-top:0">
      <div class="seg"><button class=${mode === 'chart' ? 'on' : ''} onClick=${() => setMode('chart')}>📈 グラフ</button><button class=${mode === 'list' ? 'on' : ''} onClick=${() => setMode('list')}>☰ 一覧</button></div>
      ${mode === 'chart' && html`<div class="chips">${[['30', '30日'], ['90', '90日'], ['365', '1年']].map(([k, l]) => html`<button class=${'chip' + (span === k ? ' on' : '')} onClick=${() => setSpan(k)}>${l}</button>`)}</div>`}
    </div>`}
    ${rows === null ? html`<div class="empty">読み込み中…</div>`
      : mode === 'chart' ? html`<${LineChart} rows=${rows} kind=${item.kind} span=${+span} />`
      : rows.length ? html`<div class="list hist">${rows.map(r => html`<div class="lrow" key=${r.day}><span class="lmain"><b>${dayLabel(r.day)}</b></span><span class="ldur">${show(r.value)}</span></div>`)}</div>`
      : html`<div class="empty">まだ記録がありません</div>`}
  <//>`
}

function DailyItemModal({ L, item, habit, onClose }) {
  const [name, setName] = useState(item?.name || '')
  const [icon, setIcon] = useState(item?.icon || (habit ? '✅' : '⏰'))
  const [kind, setKind] = useState(habit ? 'habit' : item?.kind || 'time')
  const [unit, setUnit] = useState(item?.unit || '')
  const [target, setTarget] = useState(String(item?.target ?? 3))
  const save = () => {
    const n = name.trim(); if (!n) return
    const v = { name: n, icon: icon.trim() || '✳️', kind, unit: kind === 'number' ? unit.trim() : '' }
    if (habit) v.target = Math.min(7, Math.max(0, parseInt(target) || 0))
    item ? L.act.updateDaily(item.id, v) : L.act.addDaily(v)
    onClose()
  }
  const word = habit ? '習慣' : '項目'
  return html`<${Modal} title=${item ? `${word}を編集` : `${word}を追加`} onClose=${onClose}>
    <div class="field"><label>名前</label><input value=${name} placeholder=${habit ? '例: 筋トレ、ストレッチ、読書' : '例: 起床、電車（帰り）、体重'} onInput=${e => setName(e.target.value)} /></div>
    ${habit ? html`
      <div class="field"><label>1週間の目標</label>
        <select value=${target} onChange=${e => setTarget(e.target.value)}>${[0, 1, 2, 3, 4, 5, 6, 7].map(n => html`<option value=${n}>${n ? `週 ${n} 回` : '目標なし'}</option>`)}</select></div>`
    : html`
      <div class="field"><label>種類</label>
        <select value=${kind} onChange=${e => setKind(e.target.value)}>${Object.entries(DAILY_KINDS).map(([k, l]) => html`<option value=${k}>${l}</option>`)}</select>
        ${item && kind !== item.kind && html`<div class="hint">種類を変えると、過去の値がグラフに出なくなる場合があります。</div>`}</div>
      ${kind === 'number' && html`<div class="field"><label>単位（任意）</label><input value=${unit} placeholder="例: 時間、kg、℃、歩" onInput=${e => setUnit(e.target.value)} /></div>`}`}
    <div class="field"><label>アイコン</label><${IconPicker} value=${icon} onChange=${setIcon} /></div>
    <div class="acts"><span class="grow"></span><button class="btn ghost" onClick=${onClose}>キャンセル</button><button class="btn" disabled=${!name.trim()} onClick=${save}>保存</button></div>
  <//>`
}

function DailySettings({ L, habit, onClose }) {
  const { act } = L
  const items = L.items.filter(x => (x.kind === 'habit') === !!habit)
  const [edit, setEdit] = useState(null)
  const word = habit ? '習慣' : '項目'
  if (edit) return html`<${DailyItemModal} L=${L} habit=${habit} item=${edit.id ? edit : null} onClose=${() => setEdit(null)} />`
  return html`<${Modal} title=${habit ? '習慣の設定' : 'デイリーの項目'} onClose=${onClose}>
    <p class="muted" style="font-size:13px;margin-bottom:10px">目のボタンで表示・非表示を切り替えます。非表示にしても過去の記録は残ります。</p>
    <ul class="list">${items.map((it, i) => html`
      <li class=${'row' + (it.hidden ? ' done' : '')} key=${it.id}>
        <button class="ricon" title=${it.hidden ? '表示する' : '非表示にする'} aria-label=${it.hidden ? '表示する' : '非表示にする'} onClick=${() => act.updateDaily(it.id, { hidden: !it.hidden })}>${it.hidden ? '🙈' : '👁'}</button>
        <span class="dic">${it.icon}</span>
        <span class="text" onClick=${() => setEdit(it)}>${it.name}<small class="muted" style="margin-left:6px;font-size:11px">${habit ? (it.target ? `週${it.target}回` : '目標なし') : DAILY_KINDS[it.kind] + (it.unit ? '・' + it.unit : '')}</small></span>
        <${DotMenu} render=${close => html`
          <${MI} icon="✎" label="編集" onClick=${() => { close(); setEdit(it) }} />
          ${i > 0 && html`<${MI} icon="↑" label="上へ" onClick=${() => { close(); act.moveDaily(it.id, -1, habit) }} />`}
          ${i < items.length - 1 && html`<${MI} icon="↓" label="下へ" onClick=${() => { close(); act.moveDaily(it.id, 1, habit) }} />`}
          <div class="msep"></div>
          <${MI} icon="🗑" label="削除" danger onClick=${() => { close(); if (confirm(`「${it.name}」を削除しますか？\nこの${word}の過去の記録もすべて消えます（元に戻せません）。\n残したい場合は非表示にしてください。`)) act.deleteDaily(it) }} />`} />
      </li>`)}</ul>
    <div class="acts"><button class="btn sub" onClick=${() => setEdit({})}>＋ ${word}を追加</button><span class="grow"></span><button class="btn" onClick=${onClose}>完了</button></div>
  <//>`
}

/* ---- 習慣（週ごとのチェック） ---- */
function HabitView({ L }) {
  const { items, act, version } = L
  const habits = items.filter(i => i.kind === 'habit' && !i.hidden)
  const thisWeek = () => { const t = startOfDay(new Date()); return addDays(t, -((t.getDay() + 6) % 7)) }
  const [weekStart, setWeekStart] = useState(thisWeek)
  const [done, setDone] = useState({})
  const [settings, setSettings] = useState(false)
  const [hist, setHist] = useState(null)
  const days = [...Array(7)].map((_, i) => dayKey(addDays(weekStart, i)))
  const tk = todayKey()
  useEffect(() => {
    let alive = true
    sb.from('tb_daily_values').select('item_id,day').gte('day', days[0]).lte('day', days[6])
      .then(({ data }) => { if (alive && data) setDone(Object.fromEntries(data.map(r => [r.item_id + '|' + r.day, true]))) })
    return () => { alive = false }
  }, [days[0], version])
  const toggle = (it, d) => {
    const k = it.id + '|' + d, was = !!done[k]
    setDone(p => { const q = { ...p }; if (was) delete q[k]; else q[k] = true; return q })
    act.setValue(it.id, d, was ? '' : '1')
  }
  const s = keyToDate(days[0]), e = keyToDate(days[6])
  return html`
    <${Dock}>
      <div class="rep-nav">
        <button class="icon" aria-label="前の週" onClick=${() => setWeekStart(addDays(weekStart, -7))}>‹</button>
        <strong>${s.getMonth() + 1}/${s.getDate()} 〜 ${e.getMonth() + 1}/${e.getDate()}</strong>
        <button class="icon" aria-label="次の週" onClick=${() => setWeekStart(addDays(weekStart, 7))}>›</button>
        <button class="chip" disabled=${days[0] === dayKey(thisWeek())} onClick=${() => setWeekStart(thisWeek())}>今週</button>
      </div>
    <//>
    <div class="ghead" style="margin-top:0"><span>やった日をタップ</span><button class="chip" onClick=${() => setSettings(true)}>⚙ 習慣</button></div>
    ${habits.length ? html`
      <div class="hgrid">
        <div class="hrow hhead"><span></span>${days.map(d => { const dt = keyToDate(d); return html`<span class=${'hd' + (d === tk ? ' today' : '') + (dt.getDay() === 0 ? ' sun' : dt.getDay() === 6 ? ' sat' : '')}>${WD[dt.getDay()]}<b>${dt.getDate()}</b></span>` })}</div>
        ${habits.map(it => {
          const n = days.filter(d => done[it.id + '|' + d]).length, ok = it.target > 0 && n >= it.target
          return html`
            <div class="hrow" key=${it.id}>
              <button class="hname" title="これまでの記録" onClick=${() => setHist(it)}>
                <span class="hic">${it.icon}</span>
                <span class="hn"><b>${it.name}</b><small class=${ok ? 'ok' : ''}>${n}${it.target ? ` / ${it.target}` : ''} 回${ok ? ' 達成 🎉' : ''}</small></span>
              </button>
              ${days.map(d => {
                const on = !!done[it.id + '|' + d]
                return html`<button class=${'hcell' + (on ? ' on' : '') + (d === tk ? ' today' : '')} disabled=${d > tk}
                  aria-pressed=${on ? 'true' : 'false'} aria-label=${`${it.name} ${dayLabel(d)}`} onClick=${() => toggle(it, d)}>${on ? '✓' : ''}</button>`
              })}
            </div>`
        })}
      </div>
      <p class="muted" style="font-size:12px;text-align:center;margin-top:10px">もう一度タップで取り消し</p>`
    : html`<div class="empty list">習慣がありません。「⚙ 習慣」から追加できます。</div>`}
    ${settings && html`<${DailySettings} L=${L} habit onClose=${() => setSettings(false)} />`}
    ${hist && html`<${HistoryModal} L=${L} item=${hist} mode="list" onClose=${() => setHist(null)} />`}`
}

function ActionsModal({ L, onClose }) {
  const [edit, setEdit] = useState(null)
  if (edit) return html`<${ActionModal} L=${L} action=${edit.id ? edit : null} onClose=${() => setEdit(null)} />`
  return html`<${Modal} title="アクションの設定" onClose=${onClose}>
    <${ActionsView} L=${L} openAction=${setEdit} />
    <div class="acts"><span class="grow"></span><button class="btn" onClick=${onClose}>完了</button></div>
  <//>`
}

// スマホでは画面下（ナビの上）に固定、PCではその場（上部）に出る操作エリア
function Dock({ children, cls = '' }) {
  const ref = useRef()
  useEffect(() => {
    const el = ref.current, root = document.documentElement
    const set = () => root.style.setProperty('--dock-h', (getComputedStyle(el).position === 'fixed' ? el.offsetHeight : 0) + 'px')
    const ro = new ResizeObserver(set)
    ro.observe(el); window.addEventListener('resize', set); set()
    return () => { ro.disconnect(); window.removeEventListener('resize', set); root.style.setProperty('--dock-h', '0px') }
  }, [])
  return html`<div ref=${ref} class=${'dock ' + cls}>${children}</div>`
}

const TABS = [['inbox', '📥', 'Inbox'], ['board', '🗂️', 'ボード'], ['record', '⏱️', '時間'], ['daily', '📅', 'デイリー'], ['habit', '✅', '習慣'], ['report', '📊', 'レポート']]

function LogView({ L, sub }) {
  const [editLog, setEditLog] = useState(null)
  const [actionsOpen, setActionsOpen] = useState(false)
  return html`
    <main class="logv">
      ${!L.ready ? html`<div class="empty">読み込み中…</div>`
        : sub === 'record' ? html`<${RecordView} L=${L} openLog=${setEditLog} openActions=${() => setActionsOpen(true)} />`
        : sub === 'daily' ? html`<${DailyView} L=${L} />`
        : sub === 'habit' ? html`<${HabitView} L=${L} />`
        : html`<${ReportView} L=${L} openLog=${setEditLog} />`}
      ${editLog && html`<${LogModal} L=${L} entry=${editLog} onClose=${() => setEditLog(null)} />`}
      ${actionsOpen && html`<${ActionsModal} L=${L} onClose=${() => setActionsOpen(false)} />`}
    </main>`
}

/* ================= shell ================= */
function Main({ session }) {
  const [toast, setToast] = useState(null)
  const timer = useRef()
  const notify = useCallback((msg, undo) => {
    clearTimeout(timer.current)
    setToast({ msg, undo, k: Date.now() })
    timer.current = setTimeout(() => setToast(null), undo ? 6000 : 4000)
  }, [])
  const { items, columns, loading, online, act } = useBoard(session.user.id, notify)
  const log = useLog(session.user.id, notify)
  const runAct = log.running && log.actions.find(a => a.id === log.running.action_id)
  const [savedTab, setTab] = useLS('tb_tab', 'inbox')
  // 旧バージョンの「ログ」タブを開いていた場合は、そのとき見ていた画面へ
  const tab = savedTab === 'log' ? localStorage.getItem('tb_log_sub') || 'record' : TABS.some(t => t[0] === savedTab) ? savedTab : 'inbox'
  const [drag, setDrag] = useState(null)
  const [tabDrop, setTabDrop] = useState(false)

  const inboxItems = useMemo(() => items.filter(i => !i.column_id), [items])
  const openInbox = inboxItems.filter(i => !i.done).length
  const tabBtn = ([k, icon, label], bottom) => {
    const isRec = k === 'record' && runAct
    const props = k !== 'inbox' ? {} : {
      onDragOver: e => { if (drag) { e.preventDefault(); setTabDrop(true) } }, onDragLeave: () => setTabDrop(false),
      onDrop: e => { e.preventDefault(); setTabDrop(false); const id = e.dataTransfer.getData('text/plain') || drag; setDrag(null); id && act.move(id, null) },
      title: 'ボードのカードをここへドラッグすると Inbox に戻せます',
    }
    return html`<button key=${k} class=${(tab === k ? 'on' : '') + (k === 'inbox' && tabDrop ? ' drop' : '')} onClick=${() => setTab(k)} aria-current=${tab === k ? 'page' : undefined} ...${props}>
      ${bottom ? html`<span class=${'bi' + (isRec ? ' runic' : '')}>${isRec ? runAct.icon : icon}</span>${label}` : html`${k === 'inbox' ? '' : icon + ' '}${label}${isRec ? html` <span class="runic">${runAct.icon}</span>` : ''}`}
      ${k === 'inbox' && openInbox > 0 && html`<span class="badge">${openInbox}</span>`}
    </button>`
  }

  return html`
    <header class="top">
      <div class="brand"><img src="icon.svg" alt="" /><span>TaskBoard</span></div>
      <strong class="ptitle">${TABS.find(t => t[0] === tab)[2]}${tab !== 'record' && runAct ? html` <small class="runic" title=${runAct.name + ' を記録中'}>${runAct.icon}</small>` : ''}</strong>
      <nav class="tabs">${TABS.map(t => tabBtn(t, false))}</nav>
      <span class=${'sync' + (online ? '' : ' off')} title=${online ? '同期中' : '同期できていません'}></span>
      <${DotMenu} label="アカウント" render=${close => html`
        <div class="msec" style="font-weight:400">${session.user.email}</div>
        <${MI} icon="⟳" label="再読み込み" onClick=${() => { close(); location.reload() }} />
        <div class="msep"></div>
        <${MI} icon="⎋" label="ログアウト" onClick=${() => { close(); sb.auth.signOut() }} />`} />
    </header>
    ${tab !== 'inbox' && tab !== 'board' ? html`<${LogView} key=${tab} L=${log} sub=${tab} />`
      : loading ? html`<div class="empty">読み込み中…</div>`
      : tab === 'inbox' ? html`<${Inbox} items=${inboxItems} columns=${columns} act=${act} />`
      : html`<${Board} items=${items} columns=${columns} act=${act} drag=${drag} setDrag=${setDrag} />`}
    <nav class="bnav" aria-label="画面の切り替え">${TABS.map(t => tabBtn(t, true))}</nav>
    ${toast && html`<div class="toast" key=${toast.k} role="status">
        <span>${toast.msg}</span>
        ${toast.undo && html`<button onClick=${() => { const u = toast.undo; setToast(null); u() }}>元に戻す</button>`}
      </div>`}`
}

function Auth() {
  const [mode, setMode] = useState('signin')
  const [email, setEmail] = useState(''), [password, setPassword] = useState('')
  const [err, setErr] = useState(''), [info, setInfo] = useState(''), [busy, setBusy] = useState(false)
  const submit = async e => {
    e.preventDefault(); setErr(''); setInfo(''); setBusy(true)
    try {
      if (mode === 'signin') {
        const { error } = await sb.auth.signInWithPassword({ email, password })
        if (error) setErr('ログインに失敗しました: ' + error.message)
      } else {
        const { data, error } = await sb.auth.signUp({ email, password })
        if (error) setErr('登録に失敗しました: ' + error.message)
        else if (!data.session) setInfo('確認メールを送信しました。リンクをクリックしてからログインしてください。')
      }
    } finally { setBusy(false) }
  }
  return html`
    <div class="auth"><form class="auth-card" onSubmit=${submit}>
      <h1><img src="icon.svg" alt="" />TaskBoard</h1>
      <p>LifeOS・7つの習慣アプリと同じアカウントで使えます</p>
      <div class="field"><label>メールアドレス</label><input type="email" required autocomplete="email" value=${email} onInput=${e => setEmail(e.target.value)} /></div>
      <div class="field"><label>パスワード（6文字以上）</label><input type="password" required minlength="6" autocomplete=${mode === 'signin' ? 'current-password' : 'new-password'} value=${password} onInput=${e => setPassword(e.target.value)} /></div>
      <button class="btn" disabled=${busy}>${mode === 'signin' ? 'ログイン' : 'アカウント作成'}</button>
      ${err && html`<div class="msg err">${err}</div>`}
      ${info && html`<div class="msg">${info}</div>`}
      <button type="button" class="link" onClick=${() => { setMode(mode === 'signin' ? 'signup' : 'signin'); setErr(''); setInfo('') }}>
        ${mode === 'signin' ? '初めての方：アカウントを作成' : 'ログイン画面に戻る'}
      </button>
    </form></div>`
}

function App() {
  const [session, setSession] = useState(undefined)
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session))
    const { data } = sb.auth.onAuthStateChange((_e, s) => setSession(s))
    return () => data.subscription.unsubscribe()
  }, [])
  if (session === undefined) return html`<div class="center muted">読み込み中…</div>`
  if (!session) return html`<${Auth} />`
  return html`<${Main} key=${session.user.id} session=${session} />`
}

render(html`<${App} />`, document.getElementById('app'))
</script>
