const logRange = l => `${md(l.started_at)} ${clock(l.started_at)} - ${l.ended_at ? `${md(l.ended_at)} ${clock(l.ended_at)}` : '記録中'}`
const nextPos = list => (list.length ? Math.max(...list.map(x => x.position)) + 1 : 0)
const hmToMin = v => { const m = /^(\d{1,2}):(\d{2})/.exec(v || ''); return m ? +m[1] * 60 + +m[2] : null }
const minToHm = v => { const m = Math.round(v); return `${pad(Math.floor(m / 60))}:${pad(((m % 60) + 60) % 60)}` }

function useNow(ms = 1000) {
  const [n, setN] = useState(Date.now())
  useEffect(() => { const t = setInterval(() => setN(Date.now()), ms); return () => clearInterval(t) }, [ms])
  return n
}
async function fetchAll(build) {
  const out = []
  for (let off = 0; ; off += 1000) {
    const { data, error } = await build().range(off, off + 999)
    if (error) throw error
    out.push(...data)
    if (data.length < 1000) return out
  }
}
// 期間 [from, to) に少しでも重なる記録を返す（日付をまたぐ睡眠なども両方の日に出す）
const fetchLogs = async (from, to) => {
  const rows = await fetchAll(() => sb.from('tb_logs').select('*').gte('started_at', addDays(from, -2).toISOString()).lt('started_at', to.toISOString()).order('started_at', { ascending: false }))
  return rows.filter(l => (l.ended_at ? Date.parse(l.ended_at) : Date.now()) > from.getTime())
}
// 期間内に収まる部分だけの長さ
const overlapMs = (l, from, to, now = Date.now()) => Math.max(0, Math.min(l.ended_at ? Date.parse(l.ended_at) : now, to.getTime()) - Math.max(Date.parse(l.started_at), from.getTime()))

function useLog(userId, notify) {
  const [actions, setActions] = useState([])
  const [items, setItems] = useState([])
  const [running, setRunning] = useState(null)
  const [counts, setCounts] = useState({})
  const [version, setVersion] = useState(0)
  const [ready, setReady] = useState(false)
  const runRef = useRef(running); runRef.current = running
  const actRef = useRef(actions); actRef.current = actions
  const itemsRef = useRef(items); itemsRef.current = items
  const notifyRef = useRef(notify); notifyRef.current = notify

  const load = useCallback(async () => {
    const [ar, rr, ir, cr] = await Promise.all([
      sb.from('tb_actions').select('*').order('position'),
      sb.from('tb_logs').select('*').is('ended_at', null).limit(1),
      sb.from('tb_daily_items').select('*').order('position'),
      sb.rpc('tb_action_counts'),
    ])
    const err = ar.error || rr.error || ir.error
    if (err) { notifyRef.current('ログの読み込みに失敗しました: ' + err.message); setReady(true); return }
    let acts = ar.data, its = ir.data
    const seed = async (table, key, rows, cur) => {
      if (cur.length || localStorage.getItem(key)) return cur
      localStorage.setItem(key, '1')
      const { data } = await sb.from(table).insert(rows).select()
      return data || []
    }
    acts = await seed('tb_actions', 'tb_actions_seeded_' + userId,
      DEFAULT_ACTIONS.map(([name, icon, color], i) => ({ id: uuid(), user_id: userId, name, icon, color, position: i })), acts)
    // 初めて使うときだけ：デイリーの項目＋チェックリスト（うち習慣フラグ付き）を用意
    its = await seed('tb_daily_items', 'tb_daily_seeded_' + userId, [
      ...DEFAULT_DAILY.map(([name, icon, kind, unit], i) => ({ id: uuid(), user_id: userId, name, icon, kind, unit: unit || '', position: i })),
      ...DEFAULT_HABITS.map(([name, icon, target], i) => ({ id: uuid(), user_id: userId, name, icon, kind: 'check', is_habit: true, target, unit: '', position: 100 + i })),
    ], its)
    // 旧形式（kind='habit'）が残っていたら表示上はチェック項目として扱う
    its = its.map(i => (i.kind === 'habit' ? { ...i, kind: 'check', is_habit: true } : i))
    const byPos = (a, b) => a.position - b.position
    setActions([...acts].sort(byPos)); setItems([...its].sort(byPos)); setRunning(rr.data[0] || null)
    if (!cr.error) setCounts(Object.fromEntries((cr.data || []).map(r => [r.action_id, Number(r.n)])))
    setVersion(v => v + 1); setReady(true)
  }, [userId])

  useEffect(() => {
    load()
    let t
    const soon = () => { clearTimeout(t); t = setTimeout(load, 600) }
    const ch = sb.channel('tb-log-' + userId)
    for (const table of ['tb_actions', 'tb_logs', 'tb_daily_items', 'tb_daily_values', 'tb_memos']) ch.on('postgres_changes', { event: '*', schema: 'public', table }, soon)
    ch.subscribe()
    const onVis = () => document.visibilityState === 'visible' && load()
    document.addEventListener('visibilitychange', onVis)
    return () => { clearTimeout(t); sb.removeChannel(ch); document.removeEventListener('visibilitychange', onVis) }
  }, [load])

  const act = useMemo(() => {
    const now = () => new Date().toISOString()
    const fail = e => { if (e) { notifyRef.current('保存に失敗しました: ' + e.message); load() } return !!e }
    const bump = () => setVersion(v => v + 1)
    const inc = (id, d) => setCounts(c => ({ ...c, [id]: Math.max(0, (c[id] || 0) + d) }))
    const swap = async (table, list, setList, id, dir) => {
      const i = list.findIndex(x => x.id === id), j = i + dir
      if (i < 0 || j < 0 || j >= list.length) return
      const A = list[i], B = list[j]
      let pa = B.position, pb = A.position
      if (pa === pb) { pa = j; pb = i }
      setList(p => p.map(x => (x.id === A.id ? { ...x, position: pa } : x.id === B.id ? { ...x, position: pb } : x)).sort((x, y) => x.position - y.position))
      const r = await Promise.all([sb.from(table).update({ position: pa }).eq('id', A.id), sb.from(table).update({ position: pb }).eq('id', B.id)])
      fail(r[0].error || r[1].error)
    }
    return {
      // アクションをタップ → 記録中のものを終了して新しく開始
      async start(action) {
        const cur = runRef.current
        if (cur && cur.action_id === action.id) return
        const t = now(), log = { id: uuid(), action_id: action.id, started_at: t, ended_at: null }
        setRunning(log); inc(action.id, 1)
        const r1 = await sb.from('tb_logs').update({ ended_at: t }).is('ended_at', null)
        if (fail(r1.error)) return
        const { error } = await sb.from('tb_logs').insert({ ...log, user_id: userId })
        if (!fail(error)) bump()
      },
      async stop() {
        if (!runRef.current) return
        setRunning(null)
        const { error } = await sb.from('tb_logs').update({ ended_at: now() }).is('ended_at', null)
        if (!fail(error)) bump()
      },
      async addLog(l) {
        const { error } = await sb.from('tb_logs').insert({ id: uuid(), ...l, user_id: userId })
        if (!fail(error)) { inc(l.action_id, 1); bump() }
      },
      async updateLog(id, patch) {
        const { error } = await sb.from('tb_logs').update(patch).eq('id', id)
        if (!fail(error)) load()
      },
      async deleteLog(l) {
        if (runRef.current?.id === l.id) setRunning(null)
        const { error } = await sb.from('tb_logs').delete().eq('id', l.id)
        if (fail(error)) return
        inc(l.action_id, -1); bump()
        notifyRef.current('記録を削除しました', async () => {
          const { error } = await sb.from('tb_logs').insert({ id: l.id, action_id: l.action_id, started_at: l.started_at, ended_at: l.ended_at, user_id: userId })
          if (!fail(error)) load()
        })
      },
      // 「今日の記録」に挟むメモ（created_at の時刻で記録の間に並ぶ）
      async addMemo(content, at = now()) {
        const { error } = await sb.from('tb_memos').insert({ id: uuid(), content, created_at: at, updated_at: now(), user_id: userId })
        if (!fail(error)) bump()
      },
      async updateMemo(id, patch) {
        const { error } = await sb.from('tb_memos').update({ ...patch, updated_at: now() }).eq('id', id)
        if (!fail(error)) bump()
      },
      async deleteMemo(m) {
        const { error } = await sb.from('tb_memos').delete().eq('id', m.id)
        if (fail(error)) return
        bump()
        notifyRef.current('メモを削除しました', async () => {
          const { error } = await sb.from('tb_memos').insert({ id: m.id, content: m.content, created_at: m.created_at, updated_at: now(), user_id: userId })
          if (!fail(error)) bump()
        })
      },
      async addAction(v) {
        const row ={ id: uuid(), position: nextPos(actRef.current), archived: false, created_at: now(), ...v }
        setActions(p => [...p, row])
        const { error } = await sb.from('tb_actions').insert({ ...row, user_id: userId }); fail(error)
      },
      async updateAction(id, patch) {
        setActions(p => p.map(x => (x.id === id ? { ...x, ...patch } : x)))
        const { error } = await sb.from('tb_actions').update(patch).eq('id', id); fail(error)
      },
      moveAction: (id, dir) => swap('tb_actions', actRef.current.filter(x => !x.archived), setActions, id, dir),
      // ドラッグでアクションを beforeId の直前へ（null なら最後）
      async reorderAction(id, beforeId) {
        if (id === beforeId) return
        const list = actRef.current.filter(x => !x.archived && x.id !== id)
        const idx = beforeId ? list.findIndex(x => x.id === beforeId) : -1
        const position = idx === -1 ? (list.length ? list[list.length - 1].position + 1 : 0)
          : idx === 0 ? list[0].position - 1 : (list[idx - 1].position + list[idx].position) / 2
        setActions(p => p.map(x => (x.id === id ? { ...x, position } : x)).sort((a, b) => a.position - b.position))
        const { error } = await sb.from('tb_actions').update({ position }).eq('id', id); fail(error)
      },
      async deleteAction(x) {
        setActions(p => p.filter(y => y.id !== x.id))
        if (runRef.current?.action_id === x.id) setRunning(null)
        const { error } = await sb.from('tb_actions').delete().eq('id', x.id)
        if (!fail(error)) load()
      },
      async addDaily(v) {
        const row = { id: uuid(), position: nextPos(itemsRef.current), hidden: false, created_at: now(), ...v }
        setItems(p => [...p, row])
        const { error } = await sb.from('tb_daily_items').insert({ ...row, user_id: userId }); fail(error)
      },
      async updateDaily(id, patch) {
        setItems(p => p.map(x => (x.id === id ? { ...x, ...patch } : x)))
        const { error } = await sb.from('tb_daily_items').update(patch).eq('id', id); fail(error)
      },
      moveDaily: (id, dir) => swap('tb_daily_items', itemsRef.current, setItems, id, dir),
      // ドラッグでデイリー項目を beforeId の直前へ（null なら最後）
      async reorderDaily(id, beforeId) {
        if (id === beforeId) return
        const list = itemsRef.current.filter(x => x.id !== id)
        const idx = beforeId ? list.findIndex(x => x.id === beforeId) : -1
        const position = idx === -1 ? (list.length ? list[list.length - 1].position + 1 : 0)
          : idx === 0 ? list[0].position - 1 : (list[idx - 1].position + list[idx].position) / 2
        setItems(p => p.map(x => (x.id === id ? { ...x, position } : x)).sort((a, b) => a.position - b.position))
        const { error } = await sb.from('tb_daily_items').update({ position }).eq('id', id); fail(error)
      },
      async deleteDaily(x) {
        setItems(p => p.filter(y => y.id !== x.id))
        const { error } = await sb.from('tb_daily_items').delete().eq('id', x.id); if (!fail(error)) bump()
      },
      async setValue(itemId, day, value) {
        const { error } = value === ''
          ? await sb.from('tb_daily_values').delete().eq('item_id', itemId).eq('day', day)
          : await sb.from('tb_daily_values').upsert({ user_id: userId, item_id: itemId, day, value, updated_at: now() }, { onConflict: 'item_id,day' })
        if (!fail(error)) bump()
      },
    }
  }, [userId, load])

  return { actions, items, running, counts, version, ready, act }
}

const FOCUSABLE = 'input:not([type=hidden]):not([disabled]), select:not([disabled]), textarea:not([disabled]), button:not([disabled]):not([tabindex="-1"]), [tabindex="0"]'
function Modal({ title, onClose, children }) {
  const sheet = useRef()
  useEffect(() => {
    const k = e => {
      if (e.key === 'Escape') return onClose()
      // Tab は画面の中だけを巡回（最後→最初、最初→最後）
      if (e.key !== 'Tab' || !sheet.current) return
      const els = [...sheet.current.querySelectorAll(FOCUSABLE)].filter(el => el.offsetParent !== null)
      if (!els.length) return
      const first = els[0], last = els[els.length - 1], cur = document.activeElement
      if (!sheet.current.contains(cur)) { e.preventDefault(); (e.shiftKey ? last : first).focus() }
      else if (!e.shiftKey && cur === last) { e.preventDefault(); first.focus() }
      else if (e.shiftKey && cur === first) { e.preventDefault(); last.focus() }
    }
    document.addEventListener('keydown', k)
    return () => document.removeEventListener('keydown', k)
  }, [onClose])
  // PC（マウス・キーボード）では開いたとき最初の入力欄にカーソルを置く。スマホはキーボードが勝手に出ないようにしない
  useEffect(() => {
    const s = sheet.current
    if (!s || s.contains(document.activeElement) || !matchMedia('(pointer: fine)').matches) return
    s.querySelector('input:not([type=hidden]):not([type=checkbox]):not([disabled]), select, textarea')?.focus()
  }, [])
  return html`
    <div class="ovl" onClick=${e => e.target === e.currentTarget && onClose()}>
      <div class="sheet" ref=${sheet} role="dialog" aria-modal="true" aria-label=${title}>
        <div class="sheet-head"><h3>${title}</h3><button class="icon" tabindex="-1" aria-label="閉じる" title="閉じる（Esc）" onClick=${onClose}>×</button></div>
        ${children}
      </div>
    </div>`
}

function RecordView({ L, B, notify, openLog, openActions, newAction }) {
  const { actions, running, act, version } = L
  const now = useNow(1000)
  const ra = running && actions.find(a => a.id === running.action_id)
  const [today, setToday] = useState([])
  const [memos, setMemos] = useState([])
  const [memo, setMemo] = useState('')
  const [editMemo, setEditMemo] = useState(null)
  const [day, setDay] = useState(todayKey)   // 「今日の記録」で表示する日（‹ › で過去の日も見られる）
  const tk = todayKey(), isToday = day === tk, dd = keyToDate(day)
  useEffect(() => {
    let alive = true
    const s = keyToDate(day)
    fetchLogs(s, addDays(s, 1)).then(d => alive && setToday(d)).catch(() => {})
    sb.from('tb_memos').select('*').gte('created_at', s.toISOString()).lt('created_at', addDays(s, 1).toISOString()).order('created_at', { ascending: false })
      .then(({ data }) => alive && data && setMemos(data))
    return () => { alive = false }
  }, [version, day])
  const addMemo = e => { e.preventDefault(); const t = memo.trim(); if (!t) return; setMemo(''); act.addMemo(t) }
  const copyTo = (m, col) => { B.act.addItem(m.content, col ? col.id : null); notify(col ? `ボードの「${col.title}」にコピーしました` : 'Inboxにコピーしました') }
  // 記録とメモを時刻の新しい順に混ぜて並べる
  const timeline = [...today.map(l => ({ t: l.started_at, l })), ...memos.map(m => ({ t: m.created_at, m }))].sort((a, b) => (a.t < b.t ? 1 : -1))
  const byId = Object.fromEntries(actions.map(a => [a.id, a]))
  const newLog = () => { const e = isToday ? new Date() : new Date(dd.getTime() + 12 * 3600000), s = new Date(e - 60 * 60000); openLog({ started_at: s.toISOString(), ended_at: e.toISOString() }) }

  // アクションボタンの並べ替え（PCはドラッグ、スマホは長押し→ドラッグ。普通のタップは記録開始）
  const [before, setBefore] = useState(undefined)
  const beforeRef = useRef(undefined)
  const setB = b => { if (b === beforeRef.current) return; beforeRef.current = b; setBefore(b) }
  const pd = usePointerDrag({
    onMove: (x, y, d) => {
      const el = document.elementFromPoint(x, y)?.closest('.abtn[data-id]')
      if (!el) return
      if (el.dataset.id === d.id) return setB(undefined)
      const r = el.getBoundingClientRect()
      if (x < r.left + r.width / 2) return setB(el.dataset.id)
      let n = el.nextElementSibling
      while (n && n.dataset.id === d.id) n = n.nextElementSibling
      setB(n?.dataset.id ?? null)
    },
    onDrop: d => { if (beforeRef.current !== undefined) act.reorderAction(d.id, beforeRef.current) },
    onEnd: () => setB(undefined),
  })
  const vis = actions.filter(a => !a.archived)
  return html`
    <${Dock} cls="rec-dock">
    <section class=${'now' + (ra ? ' on' : '')} style=${ra ? `--c:${ra.color}` : ''}>
      ${running ? html`
        <div class="now-ic">${ra?.icon || '⏱️'}</div>
        <div class="now-main">
          <div class="now-name">${ra?.name || '記録中'}
            <small><button style="color:inherit;text-decoration:underline" title="開始時刻を修正" onClick=${() => openLog(running)}>${clock(running.started_at)} から ✎</button></small></div>
          <div class="now-time">${hms(now - Date.parse(running.started_at))}</div>
        </div>
        <button class="stop" aria-label="記録を止める" title="止める" onClick=${act.stop}><i></i></button>`
      : html`<div class="now-idle">記録中の行動はありません<small>アクションをタップすると記録が始まります（長押し・ドラッグで並べ替え）</small></div>`}
    </section>
    <form class="memo-in" onSubmit=${addMemo}>
      <input value=${memo} placeholder="📝 メモ（今の時刻で記録の間に入ります）" aria-label="メモ" enterkeyhint="done"
        onInput=${e => setMemo(e.target.value)} onKeyDown=${e => { if (e.key === 'Enter' && (e.isComposing || e.keyCode === 229)) e.preventDefault() }} />
      <button class="btn" disabled=${!memo.trim()}>メモ</button>
    </form>
    <div class=${'agrid' + (pd.drag ? ' sorting' : '')}>
      ${vis.map((a, i) => html`
        <button key=${a.id} data-id=${a.id} data-drag
          class=${'abtn' + (running?.action_id === a.id ? ' on' : '') + (pd.isDragging('act', a.id) ? ' dragging' : '') + (before === a.id ? ' drop-before' : '') + (before === null && i === vis.length - 1 ? ' drop-after' : '')}
          style=${`--c:${a.color}`} title="タップで開始・長押しで並べ替え"
          onPointerDown=${e => pd.press(e, { kind: 'act', id: a.id }, e.currentTarget, `${a.icon} ${a.name}`)}
          onClick=${() => { if (!pd.consumeClick()) act.start(a) }}>
          <span class="aic">${a.icon}</span><span class="an">${a.name}</span>
        </button>`)}
      <button class="abtn add" aria-label="アクションを追加" title="アクションを追加" onClick=${newAction}><span class="aic">＋</span><span class="an">追加</span></button>
    </div>
    <//>
    <${DragGhost} pd=${pd} cls="aghost" />
    <div class="ghead rec-head"><span class="rday">
        <button class="icon sm" aria-label="前の日" onClick=${() => setDay(dayKey(addDays(dd, -1)))}>‹</button>
        <span>${isToday ? '今日の記録' : `${dd.getMonth() + 1}/${dd.getDate()}(${WD[dd.getDay()]})の記録`}</span>
        <button class="icon sm" aria-label="次の日" disabled=${isToday} onClick=${() => setDay(dayKey(addDays(dd, 1)))}>›</button>
        ${!isToday && html`<button class="chip" onClick=${() => setDay(tk)}>今日</button>`}
      </span><span class="chips"><button class="chip" onClick=${newLog}>＋ あとから記録</button><button class="chip" onClick=${openActions}>⚙ 編集</button></span></div>
    ${timeline.length ? html`<div class="list">${timeline.map(x => x.l
        ? html`<${LogRow} key=${x.l.id} l=${x.l} a=${byId[x.l.action_id]} now=${now} onClick=${() => openLog(x.l)} />`
        : html`<${MemoRow} key=${x.m.id} m=${x.m} columns=${B.columns} onEdit=${setEditMemo} onDelete=${act.deleteMemo} copyTo=${copyTo} />`)}</div>`
      : html`<div class="empty list">${isToday ? '今日の記録はまだありません。付け忘れたときは「＋ あとから記録」で追加できます。' : 'この日の記録はありません。'}</div>`}
    ${editMemo && html`<${MemoModal} memo=${editMemo} onSave=${p => act.updateMemo(editMemo.id, p)} onClose=${() => setEditMemo(null)} />`}`
}

function Donut({ parts, total, center }) {
  const R = 70, C = 2 * Math.PI * R
  let acc = 0
  return html`
    <svg class="donut" viewBox="0 0 200 200" role="img" aria-label="内訳のグラフ">
      <circle cx="100" cy="100" r=${R} fill="none" stroke="var(--panel2)" stroke-width="34" />
      ${parts.map(p => {
        const len = total ? (p.ms / total) * C : 0
        const el = html`<circle cx="100" cy="100" r=${R} fill="none" stroke=${p.color} stroke-width="34"
          stroke-dasharray=${`${len} ${C - len}`} stroke-dashoffset=${-acc} transform="rotate(-90 100 100)" />`
        acc += len
        return el
      })}
      <text x="100" y="94" text-anchor="middle" class="d-l">${center[0]}</text>
      <text x="100" y="120" text-anchor="middle" class="d-v">${center[1]}</text>
    </svg>`
}

// 習慣の値: '1'=達成(チェック) / 数値=回数 / '0'=未達成 / '-'=非アクティブ（集計から外す）
const isOffVal = v => v === '-'
const isDoneVal = (it, v) => (v == null || v === '' || v === '-' ? false : it.kind === 'check' ? v === '1' : it.kind === 'number' ? parseFloat(v) > 0 : true)
const showVal = (it, v) => (v === '-' ? '休み' : it.kind === 'check' ? (v === '1' ? '✓' : v === '0' ? '✗' : v) : it.kind === 'number' && it.unit && v !== '' ? `${v} ${it.unit}` : v)

function ReportView({ L, B, openLog }) {
  const { actions, items: dItems, version } = L
  const [mode, setMode] = useLS('tb_rep_mode', 'day')
  const [anchor, setAnchor] = useState(() => startOfDay(new Date()))
  const [logs, setLogs] = useState(null)
  const [vals, setVals] = useState(null)
  const now = useNow(30000)
  const { from, to, label } = useMemo(() => {
    const a = anchor
    if (mode === 'week') { const f = addDays(a, -((a.getDay() + 6) % 7)), t = addDays(f, 7), e = addDays(t, -1); return { from: f, to: t, label: `${f.getMonth() + 1}/${f.getDate()}(${WD[f.getDay()]}) 〜 ${e.getMonth() + 1}/${e.getDate()}(${WD[e.getDay()]})` } }
    if (mode === 'month') { const f = new Date(a.getFullYear(), a.getMonth(), 1); return { from: f, to: new Date(a.getFullYear(), a.getMonth() + 1, 1), label: `${f.getFullYear()}年${f.getMonth() + 1}月` } }
    return { from: a, to: addDays(a, 1), label: `${a.getFullYear() !== new Date().getFullYear() ? a.getFullYear() + '/' : ''}${a.getMonth() + 1}/${a.getDate()}(${WD[a.getDay()]})` }
  }, [mode, anchor])
  useEffect(() => {
    let alive = true
    setLogs(null)
    fetchLogs(from, to).then(d => alive && setLogs(d)).catch(() => alive && setLogs([]))
    fetchAll(() => sb.from('tb_daily_values').select('item_id,day,value').gte('day', dayKey(from)).lte('day', dayKey(addDays(to, -1))).order('day', { ascending: false }))
      .then(d => alive && setVals(d)).catch(() => alive && setVals([]))
    return () => { alive = false }
  }, [from.getTime(), to.getTime(), version])
  const shift = dir => setAnchor(mode === 'day' ? addDays(anchor, dir) : mode === 'week' ? addDays(anchor, 7 * dir) : new Date(anchor.getFullYear(), anchor.getMonth() + dir, 1))

  // ---- タスク ----
  const catById = Object.fromEntries((B.categories || []).map(c => [c.id, c]))
  const inRange = iso => { if (!iso) return false; const t = Date.parse(iso); return t >= from.getTime() && t < to.getTime() }
  const doneTasks = B.items.filter(i => i.done && inRange(i.done_at)).sort((a, b) => (a.done_at < b.done_at ? 1 : -1))
  const addedTasks = B.items.filter(i => inRange(i.created_at))
  const whenFmt = iso => (mode === 'day' ? clock(iso) : `${md(iso)} ${clock(iso)}`)

  // ---- 習慣・デイリー ----
  const byItem = Object.fromEntries(dItems.map(i => [i.id, i]))
  const habits = dItems.filter(i => i.is_habit && !i.hidden)
  const today = startOfDay(new Date())
  const elapsed = Math.max(0, Math.round((Math.min(to.getTime(), addDays(today, 1).getTime()) - from.getTime()) / 86400000))
  const doneDays = {}, offDays = {}, valsBy = {}
  const tkR = dayKey(today)
  for (const v of vals || []) {
    const it = byItem[v.item_id]; if (!it) continue
    ;(valsBy[v.item_id] ||= []).push(v)
    if (isDoneVal(it, v.value)) (doneDays[v.item_id] ||= new Set()).add(v.day)
    if (isOffVal(v.value) && v.day <= tkR) offDays[v.item_id] = (offDays[v.item_id] || 0) + 1
  }
  const activeDays = h => Math.max(0, elapsed - (offDays[h.id] || 0))   // 非アクティブの日は分母から外す
  const habitHits = habits.reduce((s, h) => s + (doneDays[h.id]?.size || 0), 0)
  const habitPossible = habits.reduce((s, h) => s + activeDays(h), 0)
  const others = dItems.filter(i => !i.is_habit && !i.hidden && valsBy[i.id]?.length)
  const avgOf = (it, list) => {
    if (it.kind === 'time') { const m = list.map(v => hmToMin(v.value)).filter(x => x != null); return m.length ? `平均 ${minToHm(m.reduce((a, b) => a + b, 0) / m.length)}` : '' }
    if (it.kind === 'number') { const m = list.map(v => parseFloat(v.value)).filter(x => !isNaN(x)); return m.length ? `平均 ${Math.round((m.reduce((a, b) => a + b, 0) / m.length) * 10) / 10}${it.unit ? ' ' + it.unit : ''}` : '' }
    if (it.kind === 'check') return `${list.filter(v => v.value === '1').length} 回`
    return `${list.length} 件`
  }

  // ---- 時間 ----
  const byId = Object.fromEntries(actions.map(a => [a.id, a]))
  const totals = {}
  for (const l of logs || []) totals[l.action_id] = (totals[l.action_id] || 0) + overlapMs(l, from, to, now)
  const parts = Object.entries(totals).map(([id, ms]) => ({ id, ms, a: byId[id], color: byId[id]?.color || UNTRACKED })).sort((x, y) => y.ms - x.ms)
  const tracked = parts.reduce((s, p) => s + p.ms, 0)
  const span = Math.min(to, Math.max(from, now)) - from
  const untracked = mode === 'day' ? Math.max(0, span - tracked) : 0
  const chartParts = untracked > 60000 ? [...parts, { id: '_none', ms: untracked, color: UNTRACKED }] : parts
  const chartTotal = tracked + (untracked > 60000 ? untracked : 0)

  const exportCsv = () => {
    const rows = [['日付', 'アクション', '開始', '終了', '時間(分)']]
    for (const l of [...(logs || [])].reverse()) rows.push([dayKey(l.started_at), byId[l.action_id]?.name ?? '', fmtDT(l.started_at), l.ended_at ? fmtDT(l.ended_at) : '記録中', Math.round(logMs(l) / 60000)])
    const csv = '﻿' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n')
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }))
    const el = document.createElement('a'); el.href = url; el.download = `行動ログ_${dayKey(from)}_${mode}.csv`; el.click()
    setTimeout(() => URL.revokeObjectURL(url), 2000)
  }
  const newLog = () => { const e = mode === 'day' && dayKey(anchor) !== todayKey() ? new Date(anchor.getTime() + 12 * 3600000) : new Date(); openLog({ started_at: new Date(e - 3600000).toISOString(), ended_at: e.toISOString() }) }
  const dayK = dayKey(from)

  return html`

function LogModal({ L, entry, onClose }) {
  const isNew = !entry.id, live = !isNew && !entry.ended_at
  const choices = L.actions.filter(a => !a.archived || a.id === entry.action_id)
  const [actionId, setActionId] = useState(entry.action_id || choices[0]?.id || '')
  const [start, setStart] = useState(toLocalInput(entry.started_at))
  const [end, setEnd] = useState(entry.ended_at ? toLocalInput(entry.ended_at) : '')
  const [err, setErr] = useState('')
  const save = async () => {
    if (!actionId || !start) return setErr('アクションと開始時刻を入れてください')
    if (!live && !end) return setErr('終了時刻を入れてください')
    // 分単位の入力欄なので、変更していない時刻は元の値（秒まで）をそのまま使う
    const s = start === toLocalInput(entry.started_at) ? entry.started_at : new Date(start).toISOString()
    const e = !end ? null : entry.ended_at && end === toLocalInput(entry.ended_at) ? entry.ended_at : new Date(end).toISOString()
    if (e && Date.parse(e) < Date.parse(s)) return setErr('終了は開始より後にしてください')
    if (!e && Date.parse(s) > Date.now()) return setErr('開始時刻が未来になっています')
    isNew ? await L.act.addLog({ action_id: actionId, started_at: s, ended_at: e }) : await L.act.updateLog(entry.id, { action_id: actionId, started_at: s, ended_at: e })
    onClose()
  }
  return html`<${Modal} title=${isNew ? 'あとから記録' : live ? '記録中の行動を修正' : '記録を修正'} onClose=${onClose}>
    <div class="field"><label>アクション</label>
      <select value=${actionId} onChange=${e => setActionId(e.target.value)}>${choices.map(a => html`<option value=${a.id}>${a.icon} ${a.name}</option>`)}</select></div>
    <div class="field"><label>開始</label><input type="datetime-local" value=${start} onInput=${e => setStart(e.target.value)} /></div>
    <div class="field"><label>終了</label><input type="datetime-local" value=${end} onInput=${e => setEnd(e.target.value)} />
      ${live && html`<div class="hint">空欄のままなら記録中のまま。時刻を入れるとそこで終了します。</div>`}</div>
    ${err && html`<div class="msg err">${err}</div>`}
    <div class="acts">
      ${!isNew && html`<button class="btn danger" onClick=${() => { L.act.deleteLog(entry); onClose() }}>削除</button>`}
      <span class="grow"></span>
      <button class="btn ghost" onClick=${onClose}>キャンセル</button>
      <button class="btn" onClick=${save}>保存</button>
    </div>
  <//>`
}

// 縦の一覧を並べ替える（スマホは長押し→ドラッグ、PCはそのままドラッグ）。入力欄・ボタンからは始まらない
function useRowSort(rowSel, onReorder) {
  const [before, setBefore] = useState(undefined)
  const beforeRef = useRef(undefined)
  const setB = b => { if (b === beforeRef.current) return; beforeRef.current = b; setBefore(b) }
  const pd = usePointerDrag({
    onMove: (x, y, dr) => {
      const el = document.elementFromPoint(x, y)?.closest(rowSel + '[data-id]')
      if (!el) return
      if (el.dataset.id === dr.id) return setB(undefined)
      const r = el.getBoundingClientRect()
      if (y < r.top + r.height / 2) return setB(el.dataset.id)
      let n = el.nextElementSibling
      while (n && n.dataset.id === dr.id) n = n.nextElementSibling
      setB(n?.dataset.id ?? null)
    },
    onDrop: dr => { if (beforeRef.current !== undefined) onReorder(dr.id, beforeRef.current) },
    onEnd: () => setB(undefined),
  })
  return {
    pd,
    props: (id, label) => ({ 'data-id': id, onPointerDown: e => pd.press(e, { kind: 'row', id }, e.currentTarget, label) }),
    cls: (id, last) => (pd.isDragging('row', id) ? ' dragging' : '') + (before === id ? ' drop-before' : '') + (before === null && last ? ' drop-after' : ''),
  }
}

function DailyRow({ it, value, isToday, onSave, onHist, sort, last }) {
  const [draft, setDraft] = useState(value === '-' ? '' : value)
  const pd = sort.pd
  const dragCls = sort.cls(it.id, last)
  const dp = sort.props(it.id, `${it.icon} ${it.name}`)
  const focused = useRef(false)
  useEffect(() => { if (!focused.current) setDraft(value === '-' ? '' : value) }, [value])
  const commit = v => { focused.current = false; const t = String(v).trim(); if (t !== (value === '-' ? '' : value)) onSave(t) }
  const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}` }
  const suffix = it.unit && it.kind === 'number' ? `（${it.unit}）` : ''
  const taRef = useRef()
  useEffect(() => autoGrow(taRef.current), [draft])
  if (it.kind === 'check') return html`
    <li class=${'row drow chk' + (value === '1' ? ' has done' : '') + dragCls} ...${dp}>
      <span class="dic">${it.icon}</span>
      <${Check} done=${value === '1'} onToggle=${() => onSave(value === '1' ? '' : '1')} />
      <span class="text" onClick=${() => { if (!pd.consumeClick()) onSave(value === '1' ? '' : '1') }}>${it.name}${it.is_habit ? html` <span class="htag" title="習慣">🔁</span>` : ''}${value === '0' ? html` <span class="vtag miss">✗ 未達成</span>` : value === '-' ? html` <span class="vtag">休み</span>` : ''}</span>
      <button class="ricon" tabindex="-1" title="過去の記録一覧" aria-label=${it.name + 'の履歴'} onClick=${() => onHist('list')}>☰</button>
    </li>`
  const field = it.kind === 'check'
    ? html`<div><${Check} done=${value === '1'} onToggle=${() => onSave(value === '1' ? '' : '1')} /></div>`
    : it.kind === 'text' ? html`<textarea ref=${taRef} class="dval k-text" rows="1" value=${draft} placeholder="タップして入力" aria-label=${it.name}
        onFocus=${() => { focused.current = true }} onInput=${e => setDraft(e.target.value)} onBlur=${e => commit(e.target.value)}></textarea>`
    : it.kind === 'time' ? html`<span class="tbox"><input class="dval k-time" type="time" value=${draft} aria-label=${it.name}
        onFocus=${() => { focused.current = true }} onInput=${e => setDraft(e.target.value)} onChange=${e => setDraft(e.target.value)} onBlur=${e => commit(e.target.value)}
        onKeyDown=${e => { if (isEnter(e)) e.target.blur() }} /><span class="tshow" aria-hidden="true">${draft ? draft.replace(/^(\d):/, '0$1:').slice(0, 5) : '--:--'}</span></span>`
    : html`<input class=${'dval k-' + it.kind} type=${it.kind === 'time' ? 'time' : it.kind === 'number' ? 'number' : 'text'}
        inputmode=${it.kind === 'number' ? 'decimal' : undefined} step=${it.kind === 'number' ? 'any' : undefined}
        value=${draft} placeholder=${it.kind === 'time' ? '--:--' : it.kind === 'number' ? (value === '-' ? '休み' : '–') : 'タップして入力'} aria-label=${it.name}
        onFocus=${() => { focused.current = true }} onInput=${e => setDraft(e.target.value)} onBlur=${e => commit(e.target.value)}
        onKeyDown=${e => { if (isEnter(e)) e.target.blur() }} />`
  return html`
    <li class=${'row drow' + (value ? ' has' : '') + dragCls} ...${dp}>
      <span class="dic">${it.icon}</span>
      <div class="dmain"><small>${it.name}${suffix}${it.is_habit ? html` <span class="htag" title="習慣">🔁</span>` : ''}</small>${field}</div>
      <button class="ricon rst" tabindex="-1" disabled=${!value && !draft} title="リセット（この日の値を消す）" aria-label=${it.name + 'をリセット'}
        onClick=${() => { setDraft(''); if (value) onSave('') }}>↺</button>
      ${it.kind === 'time' && isToday && html`<button class="chip nowbtn" tabindex="-1" title="今の時刻を記録" onClick=${() => onSave(nowHM())}>今</button>`}

function LineChart({ rows, kind, span }) {
  const end = startOfDay(new Date()), start = addDays(end, -(span - 1))
  const pts = rows.map(r => ({ day: r.day, y: kind === 'time' ? hmToMin(r.value) : parseFloat(r.value) }))
    .filter(p => p.y != null && !isNaN(p.y) && keyToDate(p.day) >= start && keyToDate(p.day) <= end)
    .sort((a, b) => (a.day < b.day ? -1 : 1))
  if (!pts.length) return html`<div class="empty">この期間の記録はありません</div>`
  const W = 340, H = 190, P = { l: 42, r: 10, t: 12, b: 24 }
  let lo = Math.min(...pts.map(p => p.y)), hi = Math.max(...pts.map(p => p.y))
  if (lo === hi) { const d = kind === 'time' ? 30 : 1; lo -= d; hi += d }
  const m = (hi - lo) * 0.12; lo -= m; hi += m
  const x = day => P.l + ((keyToDate(day) - start) / 86400000 / Math.max(1, span - 1)) * (W - P.l - P.r)
  const y = v => P.t + (1 - (v - lo) / (hi - lo)) * (H - P.t - P.b)
  const fmt = v => (kind === 'time' ? minToHm(v) : String(Math.round(v * 10) / 10))
  const avg = pts.reduce((s, p) => s + p.y, 0) / pts.length
  const ticks = [0, 1, 2, 3].map(i => lo + ((hi - lo) * i) / 3)
  return html`
    <svg class="lchart" viewBox=${`0 0 ${W} ${H}`} role="img" aria-label="推移グラフ">
      ${ticks.map(t => html`<line x1=${P.l} x2=${W - P.r} y1=${y(t)} y2=${y(t)} class="grid" /><text x=${P.l - 6} y=${y(t) + 4} text-anchor="end" class="ax">${fmt(t)}</text>`)}
      <line x1=${P.l} x2=${W - P.r} y1=${y(avg)} y2=${y(avg)} class="avg" />
      <polyline points=${pts.map(p => `${x(p.day)},${y(p.y)}`).join(' ')} class="ln" />
      ${pts.map(p => html`<circle cx=${x(p.day)} cy=${y(p.y)} r=${span > 120 ? 2 : 3.5} class="dot"><title>${dayLabel(p.day)} ${fmt(p.y)}</title></circle>`)}
      <text x=${P.l} y=${H - 6} class="ax">${start.getMonth() + 1}/${start.getDate()}</text>
      <text x=${W - P.r} y=${H - 6} text-anchor="end" class="ax">${end.getMonth() + 1}/${end.getDate()}</text>
    </svg>
    <div class="stats"><span>平均 <b>${fmt(avg)}</b></span><span>最早/最小 <b>${fmt(Math.min(...pts.map(p => p.y)))}</b></span><span>最遅/最大 <b>${fmt(Math.max(...pts.map(p => p.y)))}</b></span><span>${pts.length}日分</span></div>`
}

function HistoryModal({ L, item, mode: initMode, onClose }) {
  const chartable = item.kind === 'time' || item.kind === 'number'
  const [mode, setMode] = useState(chartable ? initMode : 'list')
  const [span, setSpan] = useLS('tb_hist_span', '30')
  const [rows, setRows] = useState(null)
  useEffect(() => {
    let alive = true
    fetchAll(() => sb.from('tb_daily_values').select('day,value').eq('item_id', item.id).order('day', { ascending: false }))
      .then(d => alive && setRows(d)).catch(() => alive && setRows([]))
    return () => { alive = false }
  }, [item.id, L.version])
  const show = v => showVal(item, v)
  return html`<${Modal} title=${`${item.icon} ${item.name}`} onClose=${onClose}>
    ${chartable && html`<div class="toolbar" style="margin-top:0">
      <div class="seg"><button class=${mode === 'chart' ? 'on' : ''} onClick=${() => setMode('chart')}>📈 グラフ</button><button class=${mode === 'list' ? 'on' : ''} onClick=${() => setMode('list')}>☰ 一覧</button></div>
      ${mode === 'chart' && html`<div class="chips">${[['30', '30日'], ['90', '90日'], ['365', '1年']].map(([k, l]) => html`<button class=${'chip' + (span === k ? ' on' : '')} onClick=${() => setSpan(k)}>${l}</button>`)}</div>`}
    </div>`}
    ${rows === null ? html`<div class="empty">読み込み中…</div>`
      : mode === 'chart' ? html`<${LineChart} rows=${rows} kind=${item.kind} span=${+span} />`
      : rows.length ? html`<div class="list hist">${rows.map(r => html`<div class="lrow" key=${r.day}><span class="lmain"><b>${dayLabel(r.day)}</b></span><span class=${"ldur" + (item.kind === "text" ? " wrap" : "")}>${show(r.value)}</span></div>`)}</div>`
      : html`<div class="empty">まだ記録がありません</div>`}
  <//>`
}

function DailyItemModal({ L, item, habit, onClose }) {
  const [name, setName] = useState(item?.name || '')
  const [icon, setIcon] = useState(item?.icon || '⏰')
  const [kind, setKind] = useState(item?.kind === 'habit' ? 'check' : item?.kind || 'time')
  const [unit, setUnit] = useState(item?.unit || '')
  const [isHabit, setIsHabit] = useState(item ? !!item.is_habit : !!habit)
  const [target, setTarget] = useState(String(item?.target || 0))
  const save = () => {
    const n = name.trim(); if (!n) return
    const v = { name: n, icon: icon.trim() || '✳️', kind, unit: kind === 'number' ? unit.trim() : '', is_habit: isHabit, target: isHabit ? Math.min(7, Math.max(0, parseInt(target) || 0)) : 0 }
    item ? L.act.updateDaily(item.id, v) : L.act.addDaily(v)
    onClose()
  }
  return html`<${Modal} title=${item ? '項目を編集' : '項目を追加'} onClose=${onClose}>
    <div class="field"><label>名前</label><input value=${name} placeholder="例: 起床、電車（帰り）、ゴミ出し、筋トレ" onInput=${e => setName(e.target.value)} /></div>
    <div class="field"><label>種類</label>
      <select value=${kind} onChange=${e => setKind(e.target.value)}>${Object.entries(DAILY_KINDS).map(([k, l]) => html`<option value=${k}>${l}</option>`)}</select>
      <div class="hint">${kind === 'check' ? '毎日のチェックリスト（やったらチェック）' : kind === 'time' ? '起床・電車などの時刻を記録' : kind === 'number' ? '体重・歩数・睡眠時間などの数値' : '自由なメモ'}</div>
      ${item && kind !== item.kind && item.kind !== 'habit' && html`<div class="hint">種類を変えると、過去の値がグラフに出なくなる場合があります。</div>`}</div>
    ${kind === 'number' && html`<div class="field"><label>単位（任意）</label><input value=${unit} placeholder="例: 時間、kg、℃、歩" onInput=${e => setUnit(e.target.value)} /></div>`}
    <div class="field">
      <label class="switch"><input type="checkbox" checked=${isHabit} onChange=${e => setIsHabit(e.target.checked)} /><span>🔁 習慣にする（習慣ページで週・月・年の達成状況を見る）</span></label>
      ${isHabit && html`<select style="margin-top:8px" value=${target} onChange=${e => setTarget(e.target.value)}>${[0, 1, 2, 3, 4, 5, 6, 7].map(n => html`<option value=${n}>${n ? `目標：週 ${n} 回` : '目標なし'}</option>`)}</select>
        <div class="hint">${kind === 'check' ? 'チェックした日が「できた日」になります。習慣ページではタップごとに 達成→未達成→休み→未入力 と切り替わります。' : kind === 'number' ? '回数（1以上）を記録した日が「できた日」になります。習慣ページのマスをタップすると回数を入力でき、「休み」にもできます。' : '何か記録した日が「できた日」になります（例：起床を記録した日）。'}</div>`}
    </div>
    <div class="field"><label>アイコン</label><${IconPicker} value=${icon} onChange=${setIcon} /></div>
    <div class="acts"><span class="grow"></span><button class="btn ghost" onClick=${onClose}>キャンセル</button><button class="btn" disabled=${!name.trim()} onClick=${save}>保存</button></div>
  <//>`
}

function DailySettings({ L, onClose, onlyHabits }) {
  const { act } = L
  const items = onlyHabits ? L.items.filter(x => x.is_habit) : L.items
  const [edit, setEdit] = useState(null)
  const sort = useRowSort('.slist > li', act.reorderDaily)
  if (edit) return html`<${DailyItemModal} L=${L} item=${edit.id ? edit : null} habit=${onlyHabits} onClose=${() => setEdit(null)} />`
  return html`<${Modal} title=${onlyHabits ? '習慣の設定' : 'デイリーの項目'} onClose=${onClose}>
    <p class="muted" style="font-size:13px;margin-bottom:10px">${onlyHabits ? '習慣はデイリーの項目のうち「習慣にする」をオンにしたものです。' : '目のボタンで表示・非表示。🔁 が付いた項目は習慣ページにも出ます。'}</p>
    <ul class=${'list slist' + (sort.pd.drag ? ' sorting' : '')}>${items.map((it, i) => html`
      <li class=${'row' + (it.hidden ? ' done' : '') + sort.cls(it.id, i === items.length - 1)} key=${it.id} ...${sort.props(it.id, `${it.icon} ${it.name}`)}>
        <span class="grip" aria-hidden="true">⋮⋮</span>
        <button class="ricon" title=${it.hidden ? '表示する' : '非表示にする'} aria-label=${it.hidden ? '表示する' : '非表示にする'} onClick=${() => act.updateDaily(it.id, { hidden: !it.hidden })}>${it.hidden ? '🙈' : '👁'}</button>
        <span class="dic">${it.icon}</span>
        <span class="text" onClick=${() => { if (!sort.pd.consumeClick()) setEdit(it) }}>${it.name}<small class="muted" style="margin-left:6px;font-size:11px">${DAILY_KINDS[it.kind] || ''}${it.unit ? '・' + it.unit : ''}${it.is_habit ? ` ・🔁${it.target ? '週' + it.target : ''}` : ''}</small></span>
        <${DotMenu} render=${close => html`
          <${MI} icon="✎" label="編集" onClick=${() => { close(); setEdit(it) }} />
          <${MI} icon="🔁" label=${it.is_habit ? '習慣から外す' : '習慣にする'} onClick=${() => { close(); act.updateDaily(it.id, { is_habit: !it.is_habit }) }} />
          ${!onlyHabits && i > 0 && html`<${MI} icon="↑" label="上へ" onClick=${() => { close(); act.moveDaily(it.id, -1) }} />`}
          ${!onlyHabits && i < items.length - 1 && html`<${MI} icon="↓" label="下へ" onClick=${() => { close(); act.moveDaily(it.id, 1) }} />`}
          <div class="msep"></div>
          <${MI} icon="🗑" label="削除" danger onClick=${() => { close(); if (confirm(`「${it.name}」を削除しますか？\n過去の記録もすべて消えます（元に戻せません）。\n残したい場合は非表示にしてください。`)) act.deleteDaily(it) }} />`} />
      </li>`)}</ul>
    <${DragGhost} pd=${sort.pd} cls="dghost" />
    ${onlyHabits && !items.length && html`<div class="empty list">まだありません。下のボタンから追加するか、デイリーの項目で「習慣にする」をオンにしてください。</div>`}
    <div class="acts"><button class="btn sub" onClick=${() => setEdit({})}>＋ 項目を追加</button><span class="grow"></span><button class="btn" onClick=${onClose}>完了</button></div>
  <//>`
}

// 数値の習慣（腹筋の回数など）をその日に記録する。0=未達成、休み=非アクティブ
function CountModal({ it, day, value, onSave, onClose }) {
  const [n, setN] = useState(value === '-' ? '' : value)
  const done = v => { onSave(v); onClose() }
  const save = () => { const t = String(n).trim(); done(t === '' || isNaN(parseFloat(t)) ? '' : String(parseFloat(t))) }
  return html`<${Modal} title=${`${it.icon} ${it.name}　${dayLabel(day)}`} onClose=${onClose}>
    <div class="field"><label>${it.unit ? `回数・量（${it.unit}）` : '回数・量'}</label>
      <div class="cnt-in"><input type="number" inputmode="decimal" step="any" min="0" value=${n} placeholder="例: 30" aria-label="回数"
        onInput=${e => setN(e.target.value)} onKeyDown=${e => { if (isEnter(e)) { e.preventDefault(); save() } }} />${it.unit && html`<span>${it.unit}</span>`}</div>
      <div class="hint">${value === '-' ? 'いまは「休み（非アクティブ）」です。' : ''}0 を入れると未達成になります。</div></div>
    <div class="acts">
      <button class="btn sub" onClick=${() => done('-')}>– 休み</button>
      ${value !== '' && html`<button class="btn ghost" onClick=${() => done('')}>クリア</button>`}
      <span class="grow"></span>
      <button class="btn" onClick=${save}>保存</button>
    </div>
  <//>`
}

/* ---- 習慣（週のチェック表・月/年のヒートマップ） ---- */
const hmLevel = r => (r <= 0 ? 0 : r < 0.34 ? 1 : r < 0.67 ? 2 : r < 1 ? 3 : 4)

function YearHeat({ year, ratio, tk }) {
  const ref = useRef()
  const jan1 = new Date(year, 0, 1), start = addDays(jan1, -((jan1.getDay() + 6) % 7)), end = new Date(year, 11, 31)
  const weeks = []
  for (let w = start; w <= end; w = addDays(w, 7)) weeks.push(w)
  useEffect(() => { const el = ref.current; if (el && year === new Date().getFullYear()) el.scrollLeft = el.scrollWidth }, [year])
  return html`
    <div class="yheat" ref=${ref}>
      <div class="ymonths" style=${`grid-template-columns:repeat(${weeks.length}, var(--hc))`}>
        ${weeks.map((w, i) => { const dd = [...Array(7)].map((_, k) => addDays(w, k)).find(x => x.getDate() === 1 && x.getFullYear() === year); return html`<span key=${i}>${dd ? dd.getMonth() + 1 + '月' : ''}</span>` })}
      </div>
      <div class="ygrid" style=${`grid-template-columns:repeat(${weeks.length}, var(--hc))`}>
        ${weeks.flatMap(w => [...Array(7)].map((_, k) => {
          const d = addDays(w, k), key = dayKey(d)
          if (d.getFullYear() !== year) return html`<i key=${key} class="hc out"></i>`
          const r = key > tk ? -1 : ratio(key)
          return html`<i key=${key} class=${'hc hm' + (r < 0 ? 'x' : hmLevel(r)) + (key === tk ? ' today' : '')} title=${`${dayLabel(key)}${r >= 0 ? ` ${Math.round(r * 100)}%` : ''}`}></i>`
        }))}
      </div>
    </div>`
}

function MonthHeat({ y, m, ratio, tk }) {
  const first = new Date(y, m, 1), lead = (first.getDay() + 6) % 7, n = new Date(y, m + 1, 0).getDate()
  const cells = [...Array(lead).fill(0), ...Array.from({ length: n }, (_, i) => i + 1)]
  return html`
    <div class="mheat">
      ${['月', '火', '水', '木', '金', '土', '日'].map((w, i) => html`<span class=${'mh-w' + (i === 5 ? ' sat' : i === 6 ? ' sun' : '')}>${w}</span>`)}
      ${cells.map((d, i) => {
        if (!d) return html`<span key=${'b' + i}></span>`
        const key = `${y}-${pad(m + 1)}-${pad(d)}`, r = key > tk ? -1 : ratio(key)
        return html`<span key=${key} class=${'mh-d hm' + (r < 0 ? 'x' : hmLevel(r)) + (key === tk ? ' today' : '')} title=${r >= 0 ? `${Math.round(r * 100)}%` : ''}>${d}</span>`
      })}
    </div>`
}

function HabitView({ L }) {
  const { items, act, version } = L
  const habits = items.filter(i => i.is_habit && !i.hidden)
  const [mode, setMode] = useLS('tb_habit_mode', 'week')
  const [sel, setSel] = useState('')
  const thisWeek = () => { const t = startOfDay(new Date()); return addDays(t, -((t.getDay() + 6) % 7)) }
  const [weekStart, setWeekStart] = useState(thisWeek)
  const [anchor, setAnchor] = useState(() => startOfDay(new Date()))
  const [vals, setVals] = useState({})
  const [settings, setSettings] = useState(false)
  const [hist, setHist] = useState(null)
  const sort = useRowSort('.hgrid .hrow', act.reorderDaily)
  const tk = todayKey()
  const y = anchor.getFullYear(), m = anchor.getMonth()
  const [rs, re] = mode === 'week' ? [weekStart, addDays(weekStart, 6)] : mode === 'month' ? [new Date(y, m, 1), new Date(y, m + 1, 0)] : [new Date(y, 0, 1), new Date(y, 11, 31)]
  const fromK = dayKey(rs), toK = dayKey(re)
  useEffect(() => {
    let alive = true
    fetchAll(() => sb.from('tb_daily_values').select('item_id,day,value').gte('day', fromK).lte('day', toK).order('day', { ascending: false }))
      .then(d => { if (alive) setVals(Object.fromEntries(d.map(r => [r.item_id + '|' + r.day, r.value]))) }).catch(() => {})
    return () => { alive = false }
  }, [fromK, toK, version])
  const isDone = (it, d) => isDoneVal(it, vals[it.id + '|' + d])
  const isOff = (it, d) => isOffVal(vals[it.id + '|' + d])
  const setV = (it, d, v) => {
    const k = it.id + '|' + d
    setVals(p => { const q = { ...p }; if (v === '') delete q[k]; else q[k] = v; return q })
    act.setValue(it.id, d, v)
  }
  // チェック: タップごとに 達成(1) → 未達成(0) → 非アクティブ(-) → 未入力 → …  数値: 回数を入力
  const [countFor, setCountFor] = useState(null)
  const tap = (it, d) => {
    if (it.kind === 'number') return setCountFor({ it, d })
    if (it.kind !== 'check') return
    const v = vals[it.id + '|' + d]
    setV(it, d, v === '1' ? '0' : v === '0' ? '-' : v === '-' ? '' : '1')
  }
  const selected = habits.find(h => h.id === sel)
  // 非アクティブの習慣はその日の分母から外す（全部休みの日は色なし）
  const ratio = key => {
    const list = (selected ? [selected] : habits).filter(h => !isOff(h, key))
    return list.length ? list.filter(h => isDone(h, key)).length / list.length : -1
  }
  const offIn = h => Object.keys(vals).filter(k => k.startsWith(h.id + '|') && k.slice(h.id.length + 1) <= tk && isOffVal(vals[k])).length
  const shift = dir => {
    if (mode === 'week') setWeekStart(addDays(weekStart, 7 * dir))
    else if (mode === 'month') setAnchor(new Date(y, m + dir, 1))
    else setAnchor(new Date(y + dir, 0, 1))
  }
  const goNow = () => { setWeekStart(thisWeek()); setAnchor(startOfDay(new Date())) }
  const isNow = mode === 'week' ? fromK === dayKey(thisWeek()) : mode === 'month' ? y === new Date().getFullYear() && m === new Date().getMonth() : y === new Date().getFullYear()
  const days = [...Array(7)].map((_, i) => dayKey(addDays(weekStart, i)))
  const label = mode === 'week' ? `${rs.getMonth() + 1}/${rs.getDate()} 〜 ${re.getMonth() + 1}/${re.getDate()}` : mode === 'month' ? `${y}年${m + 1}月` : `${y}年`
  // 期間内で今日までの日数
  const elapsed = Math.max(0, Math.round((Math.min(addDays(re, 1).getTime(), addDays(startOfDay(new Date()), 1).getTime()) - rs.getTime()) / 86400000))
  const countIn = h => Object.keys(vals).filter(k => k.startsWith(h.id + '|') && k.slice(h.id.length + 1) <= tk && isDoneVal(h, vals[k])).length

  return html`
    <${Dock}>
      <div class="rep-nav">
        <div class="seg">${[['week', '週'], ['month', '月'], ['year', '年']].map(([k, l]) => html`<button class=${mode === k ? 'on' : ''} onClick=${() => setMode(k)}>${l}</button>`)}</div>
        <button class="icon" aria-label="前へ" onClick=${() => shift(-1)}>‹</button>
        <strong>${label}</strong>
        <button class="icon" aria-label="次へ" onClick=${() => shift(1)}>›</button>
        <button class="chip" disabled=${isNow} onClick=${goNow}>今</button>
      </div>
    <//>
    <div class="ghead" style="margin-top:0"><span>${mode === 'week' ? 'タップごとに ✓達成 → ✗未達成 → –休み → 未入力' : '色が濃いほど多くできた日'}</span><button class="chip" onClick=${() => setSettings(true)}>⚙ 習慣</button></div>
    ${!habits.length ? html`<div class="empty list">習慣がありません。「⚙ 習慣」から追加するか、デイリーの項目で「習慣にする」をオンにしてください。</div>`
    : mode === 'week' ? html`
      <div class=${'hgrid' + (sort.pd.drag ? ' sorting' : '')}>
        <div class="hrow hhead"><span></span>${days.map(d => { const dt = keyToDate(d); return html`<span class=${'hd' + (d === tk ? ' today' : '') + (dt.getDay() === 0 ? ' sun' : dt.getDay() === 6 ? ' sat' : '')}>${WD[dt.getDay()]}<b>${dt.getDate()}</b></span>` })}</div>
        ${habits.map(it => {
          const n = days.filter(d => d <= tk && isDone(it, d)).length, ok = it.target > 0 && n >= it.target
          return html`
            <div class=${'hrow' + sort.cls(it.id, it === habits[habits.length - 1])} key=${it.id} ...${sort.props(it.id, `${it.icon} ${it.name}`)}>
              <button class="hname" data-drag title="タップでこれまでの記録・長押し/ドラッグで並べ替え" onClick=${() => { if (!sort.pd.consumeClick()) setHist(it) }}>
                <span class="hic">${it.icon}</span>
                <span class="hn"><b>${it.name}</b><small class=${ok ? 'ok' : ''}>${n}${it.target ? ` / ${it.target}` : ''} 回${ok ? ' 達成 🎉' : ''}</small></span>
              </button>
              ${days.map(d => {
                const v = vals[it.id + '|' + d], on = isDone(it, d), off = isOffVal(v), miss = !on && !off && v === '0'
                const ro = it.kind !== 'check' && it.kind !== 'number', num = it.kind === 'number' && on
                const state = on ? '達成' : off ? '休み' : miss ? '未達成' : '未記録'
                return html`<button class=${'hcell' + (on ? ' on' : '') + (off ? ' off' : '') + (miss ? ' miss' : '') + (num ? ' num' : '') + (d === tk ? ' today' : '') + (ro ? ' ro' : '')} disabled=${d > tk}
                  aria-label=${`${it.name} ${dayLabel(d)}：${state}${num ? ' ' + v + (it.unit || '') : ''}`}
                  title=${ro ? (on ? `${v}（デイリーで記録）` : 'デイリーで記録すると付きます') : it.kind === 'number' ? `${state}${num ? ` ${v}${it.unit || ''}` : ''}（タップで回数を入力）` : `${state}（タップで切り替え）`}
                  onClick=${() => tap(it, d)}>${num ? v : on ? '✓' : off ? '–' : miss ? '✗' : ''}</button>`
              })}
            </div>`
        })}
      </div>`
    : html`
      <div class="catbar habit-sel">
        <button class=${'chip' + (!selected ? ' on' : '')} onClick=${() => setSel('')}>すべて</button>
        ${habits.map(h => html`<button key=${h.id} class=${'chip' + (sel === h.id ? ' on' : '')} onClick=${() => setSel(sel === h.id ? '' : h.id)}>${h.icon} ${h.name}</button>`)}
      </div>
      <div class="rep-card">
        ${mode === 'month' ? html`<${MonthHeat} y=${y} m=${m} ratio=${ratio} tk=${tk} />` : html`<${YearHeat} year=${y} ratio=${ratio} tk=${tk} />`}
        <div class="hlegend"><span>少</span>${[0, 1, 2, 3, 4].map(l => html`<i class=${'hc hm' + l}></i>`)}<span>多</span></div>
      </div>`}
    ${habits.length > 0 && mode !== 'week' && html`
      <div class="ghead"><span>${label}の達成（${elapsed}日間）</span></div>
      <div class="rep-card">${habits.map(h => {
        const n = countIn(h), ad = Math.max(0, elapsed - offIn(h)), goal = h.target ? Math.round(h.target * ad / 7) : 0
        return html`<div class="lg" key=${h.id} style="--c:var(--done)" onClick=${() => setSel(sel === h.id ? '' : h.id)}>
          <span>${h.icon}</span><span class="nm">${h.name}</span>
          <span class="v"><b>${n}</b> 日${ad ? `・${Math.round((n / ad) * 100)}%` : ''}${ad < elapsed ? `（休み ${elapsed - ad}日）` : ''}${goal ? `（目標 ${goal}）` : ''}</span>
          <span class="bar"><i style=${`width:${ad ? (n / ad) * 100 : 0}%`}></i></span></div>`
      })}</div>`}
    ${habits.length > 0 && html`<div class="dfoot end"><button class="chip" onClick=${() => setSettings(true)}>⚙ 習慣</button></div>`}
    <${DragGhost} pd=${sort.pd} cls="dghost" />
    ${settings && html`<${DailySettings} L=${L} onlyHabits onClose=${() => setSettings(false)} />`}
    ${hist && html`<${HistoryModal} L=${L} item=${hist} mode="list" onClose=${() => setHist(null)} />`}
    ${countFor && html`<${CountModal} it=${countFor.it} day=${countFor.d} value=${vals[countFor.it.id + '|' + countFor.d] ?? ''}
      onSave=${v => setV(countFor.it, countFor.d, v)} onClose=${() => setCountFor(null)} />`}`
}

function ActionsModal({ L, onClose }) {
  const [edit, setEdit] = useState(null)
  if (edit) return html`<${ActionModal} L=${L} action=${edit.id ? edit : null} onClose=${() => setEdit(null)} />`
  return html`<${Modal} title="アクションの設定" onClose=${onClose}>
    <${ActionsView} L=${L} openAction=${setEdit} />
    <div class="acts"><span class="grow"></span><button class="btn" onClick=${onClose}>完了</button></div>
  <//>`
}

// スマホでは画面下（ナビの上）に固定、PCではその場（上部）に出る操作エリア
function Dock({ children, cls = '' }) {
  const ref = useRef()
  useEffect(() => {
    const el = ref.current, root = document.documentElement
    const set = () => root.style.setProperty('--dock-h', (getComputedStyle(el).position === 'fixed' ? el.offsetHeight : 0) + 'px')
    const ro = new ResizeObserver(set)
    ro.observe(el); window.addEventListener('resize', set); set()
    return () => { ro.disconnect(); window.removeEventListener('resize', set); root.style.setProperty('--dock-h', '0px') }
  }, [])
  return html`<div ref=${ref} class=${'dock ' + cls}>${children}</div>`
}

const TABS = [['inbox', '📥', 'Inbox'], ['board', '🗂️', 'ボード'], ['record', '⏱️', '時間'], ['daily', '📅', 'デイリー'], ['habit', '✅', '習慣'], ['report', '📊', 'レポート']]

function LogView({ L, B, sub }) {
  const [editLog, setEditLog] = useState(null)
  const [actionsOpen, setActionsOpen] = useState(false)
  const [newAct, setNewAct] = useState(false)
  return html`
    <main class="logv">
      ${!L.ready ? html`<div class="empty">読み込み中…</div>`
        : sub === 'record' ? html`<${RecordView} L=${L} B=${B} notify=${B.notify} openLog=${setEditLog} openActions=${() => setActionsOpen(true)} newAction=${() => setNewAct(true)} />`
        : sub === 'daily' ? html`<${DailyView} L=${L} />`
        : sub === 'habit' ? html`<${HabitView} L=${L} />`
        : html`<${ReportView} L=${L} B=${B} openLog=${setEditLog} />`}
      ${editLog && html`<${LogModal} L=${L} entry=${editLog} onClose=${() => setEditLog(null)} />`}
      ${actionsOpen && html`<${ActionsModal} L=${L} onClose=${() => setActionsOpen(false)} />`}
      ${newAct && html`<${ActionModal} L=${L} action=${null} onClose=${() => setNewAct(false)} />`}
    </main>`
}

/* ================= shell ================= */
function Main({ session }) {
  const [toast, setToast] = useState(null)
  const timer = useRef()
  const notify = useCallback((msg, undo) => {
    clearTimeout(timer.current)
    setToast({ msg, undo, k: Date.now() })
    timer.current = setTimeout(() => setToast(null), undo ? 6000 : 4000)
  }, [])
  const { items, columns, categories, loading, online, act } = useBoard(session.user.id, notify)
  const [catsOpen, setCatsOpen] = useState(false)
  const log = useLog(session.user.id, notify)
  const runAct = log.running && log.actions.find(a => a.id === log.running.action_id)
  const [savedTab, setTab] = useLS('tb_tab', 'inbox')
  // 旧バージョンの「ログ」タブを開いていた場合は、そのとき見ていた画面へ
  const tab = savedTab === 'log' ? localStorage.getItem('tb_log_sub') || 'record' : TABS.some(t => t[0] === savedTab) ? savedTab : 'inbox'
  const [detailId, setDetailId] = useState(null)
  const detailItem = detailId && items.find(i => i.id === detailId)

  const inboxItems = useMemo(() => items.filter(i => !i.column_id), [items])
  const openInbox = inboxItems.filter(i => !i.done).length
  const tabBtn = ([k, icon, label], bottom) => {
    const isRec = k === 'record' && runAct
    // ボードのカードを Inbox タブへドラッグすると Inbox に戻せる
    const props = k === 'inbox' ? { 'data-drop': 'inbox', title: 'ボードのカードをここへドラッグすると Inbox に戻せます' } : {}
    return html`<button key=${k} class=${tab === k ? 'on' : ''} onClick=${() => setTab(k)} aria-current=${tab === k ? 'page' : undefined} ...${props}>
      ${bottom ? html`<span class=${'bi' + (isRec ? ' runic' : '')}>${isRec ? runAct.icon : icon}</span>${label}` : html`${k === 'inbox' ? '' : icon + ' '}${label}${isRec ? html` <span class="runic">${runAct.icon}</span>` : ''}`}
      ${k === 'inbox' && openInbox > 0 && html`<span class="badge">${openInbox}</span>`}
    </button>`
  }

  return html`
    <header class="top">
      <div class="brand"><img src="icon.svg" alt="" /><span>TaskBoard</span></div>
      <strong class="ptitle">${TABS.find(t => t[0] === tab)[2]}${tab !== 'record' && runAct ? html` <small class="runic" title=${runAct.name + ' を記録中'}>${runAct.icon}</small>` : ''}</strong>
      <nav class="tabs">${TABS.map(t => tabBtn(t, false))}</nav>
      <span class=${'sync' + (online ? '' : ' off')} title=${online ? '同期中' : '同期できていません'}></span>
      <${DotMenu} label="アカウント" render=${close => html`
        <div class="msec" style="font-weight:400">${session.user.email}</div>
        <${MI} icon="⟳" label="再読み込み" onClick=${() => { close(); location.reload() }} />
        <div class="msep"></div>
        <${MI} icon="⎋" label="ログアウト" onClick=${() => { close(); sb.auth.signOut() }} />`} />
    </header>
    ${tab !== 'inbox' && tab !== 'board' ? html`<${LogView} key=${tab} L=${log} B=${{ items, categories, columns, act, notify }} sub=${tab} />`
      : loading ? html`<div class="empty">読み込み中…</div>`
      : tab === 'inbox' ? html`<${Inbox} items=${inboxItems} columns=${columns} categories=${categories} act=${act} openDetail=${setDetailId} />`
      : html`<${Board} items=${items} columns=${columns} categories=${categories} act=${act} openDetail=${setDetailId} openCats=${() => setCatsOpen(true)} />`}
    <nav class="bnav" aria-label="画面の切り替え">${TABS.map(t => tabBtn(t, true))}</nav>
    ${detailItem && html`<${ItemDetail} key=${detailItem.id} item=${detailItem} columns=${columns} categories=${categories} act=${act} onClose=${() => setDetailId(null)} openCats=${() => setCatsOpen(true)} />`}
    ${catsOpen && html`<${CategoryModal} categories=${categories} items=${items} act=${act} onClose=${() => setCatsOpen(false)} />`}
    ${toast && html`<div class="toast" key=${toast.k} role="status">
        <span>${toast.msg}</span>
        ${toast.undo && html`<button onClick=${() => { const u = toast.undo; setToast(null); u() }}>元に戻す</button>`}
      </div>`}`
}

function Auth() {
  const [mode, setMode] = useState('signin')
  const [email, setEmail] = useState(''), [password, setPassword] = useState('')
  const [err, setErr] = useState(''), [info, setInfo] = useState(''), [busy, setBusy] = useState(false)
  const submit = async e => {
    e.preventDefault(); setErr(''); setInfo(''); setBusy(true)
    try {
      if (mode === 'signin') {
        const { error } = await sb.auth.signInWithPassword({ email, password })
        if (error) setErr('ログインに失敗しました: ' + error.message)
      } else {
        const { data, error } = await sb.auth.signUp({ email, password })
        if (error) setErr('登録に失敗しました: ' + error.message)
        else if (!data.session) setInfo('確認メールを送信しました。リンクをクリックしてからログインしてください。')
      }
    } finally { setBusy(false) }
  }
  return html`
    <div class="auth"><form class="auth-card" onSubmit=${submit}>
      <h1><img src="icon.svg" alt="" />TaskBoard</h1>
      <p>LifeOS・7つの習慣アプリと同じアカウントで使えます</p>
      <div class="field"><label>メールアドレス</label><input type="email" required autocomplete="email" value=${email} onInput=${e => setEmail(e.target.value)} /></div>
      <div class="field"><label>パスワード（6文字以上）</label><input type="password" required minlength="6" autocomplete=${mode === 'signin' ? 'current-password' : 'new-password'} value=${password} onInput=${e => setPassword(e.target.value)} /></div>
      <button class="btn" disabled=${busy}>${mode === 'signin' ? 'ログイン' : 'アカウント作成'}</button>
      ${err && html`<div class="msg err">${err}</div>`}
      ${info && html`<div class="msg">${info}</div>`}
      <button type="button" class="link" onClick=${() => { setMode(mode === 'signin' ? 'signup' : 'signin'); setErr(''); setInfo('') }}>
        ${mode === 'signin' ? '初めての方：アカウントを作成' : 'ログイン画面に戻る'}
      </button>
    </form></div>`
}

function App() {
  const [session, setSession] = useState(undefined)
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session))
    const { data } = sb.auth.onAuthStateChange((_e, s) => setSession(s))
    return () => data.subscription.unsubscribe()
  }, [])
  if (session === undefined) return html`<div class="center muted">読み込み中…</div>`
  if (!session) return html`<${Auth} />`
  return html`<${Main} key=${session.user.id} session=${session} />`
}

render(html`<${App} />`, document.getElementById('app'))
</script>
